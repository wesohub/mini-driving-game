    // 起点线周围的圆弧
    const startArcRadius = 250;
    const startTreeCount = 18;
    
    for (let i = 0; i < startTreeCount; i++) {
        // 计算圆弧分布的角度
        let angleOffset = (i / startTreeCount) * Math.PI * 1.5 - Math.PI * 0.75; // 135度弧形
        let angle = startDir + Math.PI + angleOffset; // 与赛道方向相反
        
        let distance = startArcRadius + randRange(-50, 50); // 距离略有变化
        let sx = startP.x + Math.cos(angle) * distance;
        let sy = startP.y + Math.sin(angle) * distance;
        
        // 确保树木在赛道外

        let distToTrack = Math.abs(getTrackDistance(sx, sy, closest.index));

    for (let i = 0; i < finishTreeCount; i++) {
        // 计算圆弧分布的角度 - 扩大的弧形
        let angleOffset = (i / finishTreeCount) * Math.PI * 2 - Math.PI; // 180度弧形（半圆）
        let angle = finishDir + angleOffset; // 与赛道方向相同
        
        let distance = finishArcRadius + randRange(-100, 100); // 距离变化更大
        let sx = finishP.x + Math.cos(angle) * distance;
        let sy = finishP.y + Math.sin(angle) * distance;
        
        // 确保树木在赛道外
        let closest = findClosestTrackPoint(sx, sy);
        let distToTrack = Math.abs(getTrackDistance(sx, sy, closest.index));
        if (distToTrack < TRACK_WIDTH / 2 + 50) continue; // 让树木离赛道更远
        
        // 跳过会与道路重叠的树木
        if (distToTrack < TRACK_WIDTH / 2 + 60) continue;
        
        let tree = treePool.get();
        tree.x = sx;
        tree.y = sy;
        tree.size = randRange(25, 55); // 稍大的树木
        tree.shade = randRange(0.7, 1.0);
        tree.cachedColor = 'rgba(46,' + Math.floor(139 * tree.shade) + ',56,0.9)';
        tree.visible = false;
        tree.lastVisibleTime = 0;
        sceneryItems.push(tree);
    }

// 在地图空白区域添加稀疏的树木
    // 首先计算赛道边界以知道在哪里生成树木
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let p of trackPath) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
    }
    
    // 扩大边界以覆盖更多区域
    let padding = 1000;
    minX -= padding;
    maxX += padding;
    minY -= padding;
    maxY += padding;
    
    // 使用对象池在空白区域生成稀疏的树木
    const sparseTreeAttempts = 800; // 尝试放置树木的次数（增加以获得更密集的树木）
    const minTreeDistance = 100; // 树木之间的最小距离（减少以获得更密集的树木）
    
    for (let i = 0; i < sparseTreeAttempts; i++) {
        // 边界内的随机位置
        let sx = randRange(minX, maxX);
        let sy = randRange(minY, maxY);
        
        // 检查与赛道的距离
        let closest = findClosestTrackPoint(sx, sy);
        let distToTrack = Math.abs(getTrackDistance(sx, sy, closest.index));
        if (distToTrack < TRACK_WIDTH / 2 + 100) continue; // 与赛道保持距离
        
        // 检查是否在分支上
        if (isOnBranch(sx, sy)) continue;
        
        // 检查与其他场景物品的距离
        let tooClose = false;
        for (let item of sceneryItems) {
            let dx = sx - item.x;
            let dy = sy - item.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < minTreeDistance) {
                tooClose = true;
                break;
            }
        }
        if (tooClose) continue;
        
        // 检查是否靠近分支
        if (isNearBranch(sx, sy, 100)) continue;
        
        // 如果所有检查都通过，使用对象池添加树木
        let tree = treePool.get();
        tree.x = sx;
        tree.y = sy;
        tree.size = randRange(20, 40);

        tree.lastVisibleTime = 0;
        sceneryItems.push(tree);
    }

    buildSceneryGrid();
}

// ==================== 最近赛道点 ====================
// 用于快速赛道点查询的空间网格索引
const TRACK_GRID_SIZE = 200;
let trackGrid = {};

function gridKey(x, y) {
    const gx = Math.floor(x / TRACK_GRID_SIZE);
    const gy = Math.floor(y / TRACK_GRID_SIZE);
    return gx + "_" + gy;
}

function buildTrackGrid() {
    trackGrid = {};
    for (let i = 0; i < trackPath.length; i++) {
        let p = trackPath[i];
        let key = gridKey(p.x, p.y);
        if (!trackGrid[key]) trackGrid[key] = [];
        trackGrid[key].push({ x: p.x, y: p.y, index: i });
    }
}

// 最近赛道点缓存
let lastClosestCache = { x: 0, y: 0, index: 0, dist: Infinity };
const CACHE_RADIUS = 200;

// 使用更大半径和基于索引验证的优化赛道点缓存
const TRACK_CACHE_RADIUS = 250;
const TRACK_CACHE_MAX_AGE = 3;
let trackCache = { x: 0, y: 0, index: 0, dist: Infinity, age: 0 };
let trackPointResult = { index: 0, dist: 0 };

function findClosestTrackPoint(x, y) {
    // 检查缓存结果是否仍然有效
    let cacheDist = Math.sqrt((x - trackCache.x) ** 2 + (y - trackCache.y) ** 2);
    if (cacheDist < TRACK_CACHE_RADIUS && trackCache.dist < Infinity && trackCache.age < TRACK_CACHE_MAX_AGE) {
        trackCache.age++;
        trackPointResult.index = trackCache.index;
        trackPointResult.dist = trackCache.dist;
        return trackPointResult;
    }

    // 使用空间网格进行快速查找
    let gx = Math.floor(x / TRACK_GRID_SIZE);
    let gy = Math.floor(y / TRACK_GRID_SIZE);
    
    let bestDist = Infinity;
    let bestIdx = 0;
    
    // 检查9个相邻单元格
    for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
            let key = (gx + dx) + "_" + (gy + dy);
            let cell = trackGrid[key];
            if (!cell) continue;
            
            for (let pt of cell) {
                let ddx = x - pt.x;
                let ddy = y - pt.y;
                let d = ddx * ddx + ddy * ddy;
                if (d < bestDist) {
                    bestDist = d;
                    bestIdx = pt.index;
                }
            }
        }
    }
    
    // 如果网格查找失败，回退到粗略搜索
    if (bestDist === Infinity) {
        let coarseStep = 10;
        for (let i = 0; i < trackPath.length; i += coarseStep) {
            let dx = x - trackPath[i].x;
            let dy = y - trackPath[i].y;
            let d = dx * dx + dy * dy;
            if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
        
        // 在最佳粗略结果周围进行精细搜索
        let fineStart = Math.max(0, bestIdx - coarseStep);
        let fineEnd = Math.min(trackPath.length - 1, bestIdx + coarseStep);
        for (let i = fineStart; i <= fineEnd; i++) {
            let dx = x - trackPath[i].x;
            let dy = y - trackPath[i].y;
            let d = dx * dx + dy * dy;
            if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
    }

    let finalDist = Math.sqrt(bestDist);
    trackCache.x = x;
    trackCache.y = y;
    trackCache.index = bestIdx;
    trackCache.dist = finalDist;
    trackCache.age = 0;
    lastClosestCache.x = x;
    lastClosestCache.y = y;
    lastClosestCache.index = bestIdx;
    lastClosestCache.dist = finalDist;
    trackPointResult.index = bestIdx;
    trackPointResult.dist = finalDist;
    return trackPointResult;
}

function getTrackDistance(x, y, idx) {
    let p = trackPath[idx];
    let dx = x - p.x;
    let dy = y - p.y;
    // 有符号距离：正数 = 左侧，负数 = 右侧
    return dx * p.nx + dy * p.ny;
}

// 检查汽车的物理碰撞框是否在道路表面上
function isCarOnRoadSurface(car) {
    // 定义汽车的道路检测碰撞框（较窄的宽度）
    // 使用实际宽度的70%进行更严格的道路边界检测
    const carHalfWidth = CAR_WIDTH * 0.15; // 半宽的30%
    const carHalfLength = CAR_LENGTH / 2;
    
    // 根据方向计算汽车的4个角点
    const cos = Math.cos(car.direction);
    const sin = Math.sin(car.direction);
    
    // 前左、前右、后左、后右角点
    const corners = [
        { x: car.x + (cos * carHalfLength - sin * carHalfWidth), y: car.y + (sin * carHalfLength + cos * carHalfWidth) },
        { x: car.x + (cos * carHalfLength + sin * carHalfWidth), y: car.y + (sin * carHalfLength - cos * carHalfWidth) },
        { x: car.x - (cos * carHalfLength + sin * carHalfWidth), y: car.y - (sin * carHalfLength - cos * carHalfWidth) },
        { x: car.x - (cos * carHalfLength - sin * carHalfWidth), y: car.y - (sin * carHalfLength + cos * carHalfWidth) },
        { x: car.x, y: car.y } // 中心点
    ];
    
    // 检查任何角点是否在道路上（主赛道或分支）
    const roadMargin = 2; // 小边距防止边缘闪烁
    for (let corner of corners) {
        // 使用赛道距离检查主道路
        let closest = findClosestTrackPoint(corner.x, corner.y);
        let trackDist = Math.abs(getTrackDistance(corner.x, corner.y, closest.index));
        if (trackDist < TRACK_WIDTH / 2 - roadMargin) {
            return true;
        }
        
        // 使用最近的分支点检查分支道路
        let branchClosest = getClosestBranchPoint(corner.x, corner.y);
        if (branchClosest.dist < BRANCH_WIDTH / 2 - roadMargin) {
            return true;
        }
    }
    
    return false;
}

function isOnTrack(x, y) {
    let closest = findClosestTrackPoint(x, y);
    let trackDist = Math.abs(getTrackDistance(x, y, closest.index));
    if (trackDist < TRACK_WIDTH / 2) return true;
    // 检查分支路径
    return isOnBranch(x, y);
}

function createCar(color, isPlayer) {

        isNPC: !isPlayer,

        acceleration: isPlayer ? 0.08 : 0.25,
        braking: 0.10,
        turnRate: isPlayer ? 0.05 : 0.05,
        friction: 0.995,
        offTrackFriction: 0.98,
        currentPathIdx: 0,
        lastCheckpoint: 0,
        finished: false,
        finishTime: 0,
        totalProgress: 0,
        lastTireScreech: 0,
        collisionCooldown: 0,
        collisionPenalty: 0,
        avoidPlayer: Math.random() < 0.3,
        npcSteerInput: 0,
        laneOffset: 0,
        targetLaneOffset: 0,
        skill: Math.random(),
        blockedTimer: 0,
        overtakeState: 'none',
        overtakeTargetLane: 0,
        overtakeTimer: 0,
        targetX: 0, targetY: 0,
        positionSmoothness: 0.7
    };
}

// ==================== 放置车辆（玩家 + NPC交通） ====================
let npcSpawnTimer = 0;
let npcSpawnStarted = false;

// 初始化NPC池 - 预先创建所有NPC车辆
function initNPCPool() {
    npcPool = [];
    activeNPCs = [];
    npcAudioNodes = [];
    for (let i = 0; i < NPC_MAX_COUNT; i++) {
        let color = COLORS.npcCars[Math.floor(Math.random() * COLORS.npcCars.length)];
        let npc = createCar(color, false);
        npc.active = false;
        npc.audioIndex = i;
        npcPool.push(npc);
        npcAudioNodes.push(null);
    }
}

function placeCars() {
    cars = [];
    let startIdx = 5;

    let pCar = createCar(COLORS.playerCar, true);
    let sp = trackPath[startIdx];
    pCar.x = sp.x; pCar.y = sp.y;
    pCar.targetX = sp.x; pCar.targetY = sp.y;
    pCar.direction = sp.dir; pCar.visualAngle = sp.dir;
    pCar.currentPathIdx = startIdx;
    player = pCar;
    cars.push(pCar);
    playerPrevX = pCar.x; playerPrevY = pCar.y;
    
    // 初始化NPC池
    initNPCPool();
    
    npcSpawnTimer = 0;
    npcSpawnStarted = false;
}

function spawnNPCNearPlayer() {
    if (!player) return;

    // 从池中获取非活动NPC而不是创建新的
    let npc = null;
    for (let i = 0; i < npcPool.length; i++) {
        if (!npcPool[i].active) {
            npc = npcPool[i];
            break;
        }
    }
    if (!npc) return; // 池已耗尽

    let forwardDist = randRange(NPC_SPAWN_DISTANCE * 0.5, NPC_SPAWN_DISTANCE);
    let backwardDist = randRange(NPC_SPAWN_DISTANCE * 0.3, NPC_SPAWN_DISTANCE * 0.7);

    let pathLength = trackPath.length;
    let playerIdx = player.currentPathIdx;
    let spawnIdx;

    // 尝试多个位置以找到与其他NPC足够远的位置
    let minNPCSeparation = 250; // NPC之间的最小距离
    let minSepSq = minNPCSeparation * minNPCSeparation;
    let placed = false;

    for (let attempt = 0; attempt < 6; attempt++) {
        let isBehind = !randBool(0.7); // 30%概率在玩家后方生成
        if (!isBehind) {
            let idxOffset = Math.floor(forwardDist / 10) + randInt(-20, 20);
            spawnIdx = Math.min(playerIdx + idxOffset, pathLength - 50);
        } else {
            let idxOffset = Math.floor(backwardDist / 10) + randInt(-20, 20);
            spawnIdx = Math.max(playerIdx - idxOffset, 20);
        }
        spawnIdx = clamp(spawnIdx, 20, pathLength - 50);

        // 避免在终点线附近生成
        if (Math.abs(spawnIdx - (pathLength - 1)) < 100) {
            continue; // 跳过终点线区域
        }

        let np = trackPath[spawnIdx];
        
        // 通过检查附近点的方向变化来检测弯道强度
        let curveIntensity = 0;
        let lookAhead = 15;
        let lookBehind = 15;
        if (spawnIdx > lookBehind && spawnIdx < pathLength - lookAhead) {
            let prevDir = trackPath[spawnIdx - lookBehind].dir;
            let nextDir = trackPath[spawnIdx + lookAhead].dir;
            curveIntensity = Math.abs(angleDiff(prevDir, nextDir));
        }
        
        // 在赛道上随机位置生成
        let candX = trackPath[spawnIdx].x;
        let candY = trackPath[spawnIdx].y;

        // 检查与所有活动NPC的距离
        let tooClose = false;
        for (let other of activeNPCs) {
            let ddx = candX - other.x;
            let ddy = candY - other.y;
            if (ddx * ddx + ddy * ddy < minSepSq) {
                tooClose = true;
                break;
            }
        }

        if (!tooClose) {
            // 如果生成位置在屏幕上可见则拒绝（防止闪烁出现）
            if (isInViewBounds(candX, candY, 100)) {
                // 下次尝试更远的位置
                forwardDist = randRange(NPC_SPAWN_DISTANCE * 0.8, NPC_SPAWN_DISTANCE * 1.3);
                backwardDist = randRange(NPC_SPAWN_DISTANCE * 0.6, NPC_SPAWN_DISTANCE * 1.0);
                continue;
            }

            npc.x = candX;
            npc.y = candY;
            npc.targetX = candX;
            npc.targetY = candY;
            npc.direction = np.dir;
            npc.visualAngle = np.dir;
            npc.currentPathIdx = spawnIdx;
            // 后方生成的NPC以高速开始以自然追赶
            if (isBehind) {
                npc.speed = npc.maxSpeed * randRange(0.85, 1.0);
            } else {
                npc.speed = npc.maxSpeed * randRange(0.5, 0.85);
            }
            npc.collisionPenalty = 0;
            npc.active = true;
            activeNPCs.push(npc);
            placed = true;
            break;
        }

        // 为下次尝试变化距离
        forwardDist = randRange(NPC_SPAWN_DISTANCE * 0.4, NPC_SPAWN_DISTANCE * 1.1);
        backwardDist = randRange(NPC_SPAWN_DISTANCE * 0.2, NPC_SPAWN_DISTANCE * 0.8);
    }
    // 如果所有尝试后仍未找到有效位置，跳过此生成周期
}

let npcDensityTimer = 0;

function updateNPCSpawning() {
    if (!player) return;
    
    // 玩家完成后停止生成NPC
    if (player.finished) return;
    
    // 如果NPC被禁用，清除所有现有NPC并不再生成新的
    if (!showNPCs) {
        // 清除所有活动NPC
        for (let i = activeNPCs.length - 1; i >= 0; i--) {
            let car = activeNPCs[i];
            car.active = false;
            car.finished = false;
            car.finishTime = 0;
        }
        activeNPCs.length = 0;
        // 更新车辆数组仅包含玩家
        cars.length = 1;
        cars[0] = player;
        return;
    }

    if (!npcSpawnStarted) {
        npcSpawnTimer++;
        if (npcSpawnTimer < NPC_START_DELAY) return;
        if (player.currentPathIdx < 30) return;
        npcSpawnStarted = true;
        npcTargetCount = NPC_COUNT_MIN + randInt(0, 1); // 从2-3开始
        let spawnCount = Math.min(npcTargetCount, npcPool.length);
        for (let i = 0; i < spawnCount; i++) {
            spawnNPCNearPlayer();
        }
        return;
    }

    // 定期调整目标NPC数量（60fps下约每5秒）
    npcDensityTimer++;
    if (npcDensityTimer > 300) {
        npcDensityTimer = 0;
        // 范围内的随机目标，偏向较低端
        let r = Math.random();
        // 60%概率低（2-3），30%概率中（3-4），10%概率高（4-5）
        if (r < 0.6) npcTargetCount = NPC_COUNT_MIN + randInt(0, 1);
        else if (r < 0.9) npcTargetCount = NPC_COUNT_MIN + randInt(1, 2);
        else npcTargetCount = NPC_COUNT_MAX;
    }

    // 清除距离过远的NPC - 使用交换移除实现O(1)移除
    for (let i = activeNPCs.length - 1; i >= 0; i--) {
        let car = activeNPCs[i];

        let dx = car.x - player.x;
        let dy = car.y - player.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > NPC_DESPAWN_DISTANCE) {
            car.active = false;
            car.finished = false; // 清除时重置完成状态
            car.finishTime = 0; // 重置完成时间
            let lastIdx = activeNPCs.length - 1;
            if (i !== lastIdx) {
                activeNPCs[i] = activeNPCs[lastIdx];
            }
            activeNPCs.pop();
        }
    }

    // 如果低于动态目标则生成新NPC
    if (activeNPCs.length < npcTargetCount) {
        spawnNPCNearPlayer();
    }

    // 原地更新车辆数组而不是创建新数组
    cars.length = 1;
    cars[0] = player;
    for (let npc of activeNPCs) {
        cars.push(npc);
    }
}

// ==================== 玩家更新 ====================
function updatePlayer(car, dt) {
    if (car.collisionCooldown > 0) car.collisionCooldown -= dt;
    if (car.collisionPenalty > 0) car.collisionPenalty -= dt;

    let inputUp = keys['ArrowUp'] || keys['KeyW'] || touchControls.up;
    let inputDown = keys['ArrowDown'] || keys['KeyS'] || touchControls.down;
    let inputLeft = keys['ArrowLeft'] || keys['KeyA'] || touchControls.left;
    let inputRight = keys['ArrowRight'] || keys['KeyD'] || touchControls.right;

    // 完成后：允许控制但逐渐减速停止
    let effectiveMaxSpeed = car.maxSpeed;
    let postFinishDeceleration = false;
    if (car.finished) {
        let elapsed = raceTime - car.finishTime;
        // 完成后立即强力减速
        if (elapsed > 0.5) {
            let brakeFactor = clamp((elapsed - 0.5) / 2, 0, 1);
            effectiveMaxSpeed = car.maxSpeed * (1 - brakeFactor * 0.95);
            if (!inputUp) {
                car.speed *= lerp(0.97, 0.70, brakeFactor); // 更强的减速
                postFinishDeceleration = true;
            }
        }
        if (elapsed > 2.5) {
            car.speed *= 0.65; // 更快的减速
            postFinishDeceleration = true;
            if (Math.abs(car.speed) < 0.05) car.speed = 0;
        }
    }

    // 碰撞惩罚的加速：碰撞后恢复较慢
    let accelMult = 1;
    if (car.collisionPenalty > 0) {
        accelMult = 0.5 + 0.5 * (1 - clamp(car.collisionPenalty / 1.0, 0, 1));
    }

    if (inputUp) {
        let accelFactor = 1 - (car.speed / effectiveMaxSpeed) * 0.5;
        
        // 速度超过160时线性减慢加速（对应游戏单位约7.11）
        let speed160 = 7.11;
        if (car.speed > speed160) {
            // 计算线性减速因子（速度接近最大时从0.6到0.1）
            let excessSpeed = car.speed - speed160;
            let maxExcess = car.maxSpeed - speed160;
            let slowdownFactor = 0.6 - (excessSpeed / maxExcess) * 0.5;
            accelFactor *= slowdownFactor;
        }
        
        car.speed += car.acceleration * accelFactor * accelMult;
    } else if (inputDown) {
        car.speed -= car.braking;
    } else if (!postFinishDeceleration) {
        car.speed *= car.friction;
    }
    car.speed = clamp(car.speed, -effectiveMaxSpeed * 0.175, effectiveMaxSpeed);

    // 转向：速度相关的转向，高速时有适度的惩罚
    let speedRatio = Math.abs(car.speed) / car.maxSpeed;
    // 更平滑的曲线：中速时良好，高速时更强的减少
    let turnFactor = speedRatio * Math.max(0.2, 1.0 - speedRatio * speedRatio * 0.85);

    // 目标转向输入：-1（左），0（中），+1（右）
    let targetSteer = 0;
    if (inputLeft) targetSteer = -1;
    if (inputRight) targetSteer = 1;

    // 线性延迟：平滑的转向斜坡
    let steerSmooth = 0.18;
    car.steeringInput += (targetSteer - car.steeringInput) * steerSmooth;
    // 接近中心时归零以避免漂移
    if (Math.abs(car.steeringInput) < 0.01 && targetSteer === 0) car.steeringInput = 0;

    let turnAmount = car.steeringInput * car.turnRate * turnFactor;

    car.direction += turnAmount;
    car.direction = normalizeAngle(car.direction);

    // 移动
    car.x += Math.cos(car.direction) * car.speed;
    car.y += Math.sin(car.direction) * car.speed;

    // 高速刹车时的刹车声
    if (inputDown && Math.abs(car.speed) > car.maxSpeed * 0.3) {
        let brakeIntensity = Math.abs(car.speed) / car.maxSpeed;
        playBrakeSound(brakeIntensity);
    } else {
        stopBrakeSound();
    }

    // 视觉角度插值（平滑）
    let angleDelta = angleDiff(car.visualAngle, car.direction);
    car.visualAngle += angleDelta * 0.2;

    // 更新引擎声音
    updateEngineSound(car.speed, car.maxSpeed);

    // 赛道索引 - 计算一次并重用
    let closest = findClosestTrackPoint(car.x, car.y);
    car.currentPathIdx = closest.index;

    // 离开赛道的摩擦 + 灰尘 - 检查汽车是否在道路表面上
    let onTrack = isCarOnRoadSurface(car);
    
    if (!onTrack) {
        car.speed *= car.offTrackFriction;
        if (Math.abs(car.speed) > 1 && Math.random() < 0.5) {
            spawnDust(car.x, car.y, car.speed, car.direction);
        }
    }

    // 记录行驶距离（完成后停止计数）
    let ddx = car.x - playerPrevX, ddy = car.y - playerPrevY;
    if (!car.finished) {
        totalDistance += Math.sqrt(ddx * ddx + ddy * ddy);
    }
    playerPrevX = car.x; playerPrevY = car.y;
}

// ==================== NPC更新 ====================
const NPC_ACTIVE_DISTANCE = 500;
const NPC_SIMPLE_DISTANCE = 800;

function updateNPC(car, dt, isPlayerNearby) {
    if (car.collisionCooldown > 0) car.collisionCooldown -= dt;
    
    if (car.finished) {
        let elapsed = raceTime - car.finishTime;
        
        if (elapsed < 1.5) {
            let brakeFactor = elapsed / 1.5;
            car.speed *= lerp(0.94, 0.70, brakeFactor);
        } else {
            car.speed *= 0.65;
        }
        
        if (Math.abs(car.speed) < 0.1) {
            car.speed = 0;
        } else {
            car.x += Math.cos(car.direction) * car.speed;
            car.y += Math.sin(car.direction) * car.speed;
        }
        
        let finishP = trackPath[trackPath.length - 1];
        let dx = car.x - finishP.x;
        let dy = car.y - finishP.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > 300) {
            let angle = Math.atan2(dy, dx);
            let targetX = finishP.x + Math.cos(angle) * 250;
            let targetY = finishP.y + Math.sin(angle) * 250;
            car.x += (targetX - car.x) * 0.05;
            car.y += (targetY - car.y) * 0.05;
        }
        
        if (car.speed === 0) {
            return;
        }
    }
    
    if (!isPlayerNearby) {
        updateClosestPath(car);
        
        let trackDir = trackPath[car.currentPathIdx].dir;
        let steerAngle = angleDiff(car.direction, trackDir);
        
        let lateralDist = getTrackDistance(car.x, car.y, car.currentPathIdx);
        let absLateralDist = Math.abs(lateralDist);
        let lateralCorrection = 0;
        if (absLateralDist > TRACK_WIDTH * 0.35) {
            lateralCorrection = -lateralDist / (TRACK_WIDTH * 0.5) * 0.3;
        }
        
        let maxTurn = car.turnRate * 0.7;
        let desiredTurn = steerAngle * 0.5 + lateralCorrection;
        let targetSteerInput = clamp(desiredTurn / maxTurn, -1, 1);
        let steerSmooth = 0.1;
        car.npcSteerInput += (targetSteerInput - car.npcSteerInput) * steerSmooth;
        car.direction += car.npcSteerInput * maxTurn;
        car.direction = normalizeAngle(car.direction);
        
        let targetSpeed = car.maxSpeed * 0.6;
        if (car.speed < targetSpeed) car.speed += car.acceleration * 0.3;
        else car.speed *= 0.995;
        car.speed = clamp(car.speed, 0, car.maxSpeed);
        
        car.targetX += Math.cos(car.direction) * car.speed;
        car.targetY += Math.sin(car.direction) * car.speed;
        
        car.x += (car.targetX - car.x) * car.positionSmoothness;
        car.y += (car.targetY - car.y) * car.positionSmoothness;
        
        let ad = angleDiff(car.visualAngle, car.direction);
        car.visualAngle += ad * 0.1;
        return;
    }

    updateClosestPath(car);
    let overtakeData = computeOvertaking(car, dt);
    updateLaneDecision(car, overtakeData, dt);
    let target = computeDrivingTarget(car);

    let dx = target.x - car.x;
    let dy = target.y - car.y;
    let targetAngle = Math.atan2(dy, dx);
    let steerAngle = angleDiff(car.direction, targetAngle);

    let speedRatio = Math.abs(car.speed) / car.maxSpeed;
    let currentCurvature = trackPath[car.currentPathIdx].curvature;
    
    let isOvertaking = Math.abs(car.laneOffset) > 0.1;
    
    let maxTurn;
    if (isOvertaking) {
        maxTurn = car.turnRate * Math.max(0.6, speedRatio * 1.0);
    } else {
        maxTurn = car.turnRate * Math.max(0.35, speedRatio * 0.8);
    }
    
    let steerInput = clamp(steerAngle / maxTurn, -1, 1);
    
    if (Math.abs(steerAngle) > 0.05) {
        let boost = isOvertaking ? 0.6 : 0.3;
        steerInput = Math.sign(steerInput) * Math.min(1, Math.abs(steerInput) + boost);
    }

    let steerSmooth = isOvertaking ? 0.25 : 0.15;
    car.npcSteerInput += (steerInput - car.npcSteerInput) * steerSmooth;
    car.direction += car.npcSteerInput * maxTurn;
    car.direction = normalizeAngle(car.direction);

    let targetSpeed = computeTargetSpeed(car, target.idx);
    
    if (overtakeData.blocked && !overtakeData.overtaking) {
        targetSpeed *= 0.6;
    }
    
    let speedDiff = targetSpeed - car.speed;
    if (speedDiff > 0) {
        car.speed += Math.min(car.acceleration * 0.5, speedDiff * 0.1);
    } else {
        car.speed *= 0.98;
    }
    car.speed = clamp(car.speed, 0, car.maxSpeed);

    car.targetX += Math.cos(car.direction) * car.speed;
    car.targetY += Math.sin(car.direction) * car.speed;

    let closestIdx = car.currentPathIdx;
    let trackDist = getTrackDistance(car.targetX, car.targetY, closestIdx);
    let absTrackDist = Math.abs(trackDist);
    let onTrack = absTrackDist < TRACK_WIDTH / 2;
    if (!onTrack) onTrack = isOnBranch(car.targetX, car.targetY);

    if (!onTrack) {
        car.speed *= car.offTrackFriction;
    }

    let halfW = TRACK_WIDTH / 2;
    if (absTrackDist > halfW + 20) {
        let p = trackPath[closestIdx];
        let pushDir = trackDist > 0 ? -1 : 1;
        let pushAmount = Math.min((absTrackDist - halfW) * 0.05, 3);
        car.targetX += p.nx * pushDir * pushAmount;
        car.targetY += p.ny * pushDir * pushAmount;
    }

    // 当远离赛道时渐进重置而不是瞬间传送
    if (absTrackDist > TRACK_WIDTH * 2) {
        let p = trackPath[closestIdx];
        let offset = (Math.random() - 0.5) * TRACK_WIDTH * 0.4;
        let resetX = p.x - Math.sin(p.dir) * offset;
        let resetY = p.y + Math.cos(p.dir) * offset;
        // 平滑插值到重置位置
        car.targetX += (resetX - car.targetX) * 0.3;
        car.targetY += (resetY - car.targetY) * 0.3;
        car.direction += angleDiff(car.direction, p.dir) * 0.3;
        car.direction = normalizeAngle(car.direction);
        car.speed = car.maxSpeed * 0.5;
    }

    car.x += (car.targetX - car.x) * car.positionSmoothness;
    car.y += (car.targetY - car.y) * car.positionSmoothness;

    let ad = angleDiff(car.visualAngle, car.direction);
    car.visualAngle += ad * 0.2;
}



// ==================== 赛道边界（软推回） ====================
function isOnBranch(x, y) {
    // 首先检查缓存
    let cdx = x - branchCache.x, cdy = y - branchCache.y;
    if (cdx * cdx + cdy * cdy < 2500 && branchCache.age < BRANCH_CACHE_MAX_AGE) {
        branchCache.age++;
        return branchCache.result;
    }

    let threshold = BRANCH_WIDTH / 2;
    let thresholdSq = threshold * threshold;
    let gx = Math.floor(x / BRANCH_GRID_SIZE);
    let gy = Math.floor(y / BRANCH_GRID_SIZE);

    for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
            let key = (gx + dx) + "_" + (gy + dy);
            let cell = branchGrid[key];
            if (!cell) continue;
            for (let pt of cell) {
                let ddx = x - pt.x, ddy = y - pt.y;
                if (ddx * ddx + ddy * ddy < thresholdSq) {
                    branchCache.x = x;
                    branchCache.y = y;
                    branchCache.result = true;
                    branchCache.age = 0;
                    return true;
                }
            }
        }
    }

    branchCache.x = x;
    branchCache.y = y;
    branchCache.result = false;
    branchCache.age = 0;
    return false;
}

// getClosestBranchPoint的预分配结果
let closestBranchResult = { point: null, path: null, dist: Infinity, px: 0, py: 0, pnx: 0, pny: 0, pindex: 0 };

function getClosestBranchPoint(x, y) {
    let bestDist = Infinity;
    let bestPt = null;
    let bestPath = null;
    let bestIdx = 0;
    
    for (let bp of branchPaths) {
        if (!bp.path) continue;
        
        for (let i = 0; i < bp.path.length; i++) {
            let pt = bp.path[i];
            let dx = x - pt.x;
            let dy = y - pt.y;
            let d = dx * dx + dy * dy;
            if (d < bestDist) {
                bestDist = d;
                bestPt = pt;
                bestPath = bp;
                bestIdx = i;
            }
        }
    }
    
    if (bestPt) {
        closestBranchResult.point = bestPt;
        closestBranchResult.path = bestPath;
        closestBranchResult.dist = Math.sqrt(bestDist);
        closestBranchResult.px = bestPt.x;
        closestBranchResult.py = bestPt.y;
        closestBranchResult.pnx = bestPt.nx;
        closestBranchResult.pny = bestPt.ny;
        closestBranchResult.pindex = bestIdx;
        return closestBranchResult;
    }
    
    closestBranchResult.point = null;
    closestBranchResult.path = null;
    closestBranchResult.dist = Infinity;
    return closestBranchResult;
}

function enforceTrackBoundary(car) {
    if (car.isPlayer) return;

    // 在当前路径索引周围使用局部搜索以避免缓存冲突
    let bestIdx = car.currentPathIdx;
    let bestDist = Infinity;
    for (let i = -5; i <= 5; i++) {
        let idx = clamp(car.currentPathIdx + i, 0, trackPath.length - 1);
        let dx = car.targetX - trackPath[idx].x;
        let dy = car.targetY - trackPath[idx].y;
        let d = dx * dx + dy * dy;
        if (d < bestDist) {
            bestDist = d;
            bestIdx = idx;
        }
    }
    car.currentPathIdx = bestIdx;
    
    let trackDist = getTrackDistance(car.targetX, car.targetY, bestIdx);
    let absDist = Math.abs(trackDist);
    let halfW = TRACK_WIDTH / 2;

    // NPC：如果离开道路则推回主赛道
    if (absDist > halfW + 30) {
        let p = trackPath[bestIdx];
        let pushDir = trackDist > 0 ? -1 : 1;
        let pushAmount = Math.min((absDist - halfW) * 0.08, 5);
        car.targetX += p.nx * pushDir * pushAmount;
        car.targetY += p.ny * pushDir * pushAmount;
        car.speed *= 0.97;
    }
    // 仅NPC的硬性限制：如果离赛道非常远，平滑重置位置
    let distToTrack = Math.sqrt(bestDist);
    if (distToTrack > TRACK_WIDTH * 3) {
        let p = trackPath[bestIdx];
        // 平滑插值而不是瞬间传送
        car.targetX += (p.x - car.targetX) * 0.4;
        car.targetY += (p.y - car.targetY) * 0.4;
        car.direction += angleDiff(car.direction, p.dir) * 0.4;
        car.direction = normalizeAngle(car.direction);
        car.speed *= 0.3;
    }
}

// ==================== 车对车碰撞（平滑弹跳） ====================
function resolveCarCollisions() {
    for (let i = 0; i < cars.length; i++) {
        for (let j = i + 1; j < cars.length; j++) {
            let a = cars[i], b = cars[j];
            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let d = Math.sqrt(dx * dx + dy * dy);
            let minDist = (CAR_WIDTH + CAR_LENGTH) / 2 * 0.7;

            if (d < minDist && d > 0.01) {
                // 碰撞法线
                let nx = dx / d;
                let ny = dy / d;

                // 计算相对于车辆A的碰撞方向
                let aCos = Math.cos(a.direction);
                let aSin = Math.sin(a.direction);
                // 前向分量：正数 = 前方碰撞，负数 = 后方碰撞
                let forwardDot = nx * aCos + ny * aSin;
                // 侧向分量：绝对值表示侧面碰撞
                let sideDot = Math.abs(-nx * aSin + ny * aCos);

                // 判断是否为侧面碰撞（侧向分量 > 前向分量）
                let isSideCollision = sideDot > Math.abs(forwardDot);

                // 侧面碰撞的推力效果是前/后方碰撞的1/4
                let overlap = minDist - d;
                
                // 位置推力强度（分离距离）
                let posPushStrength = Math.max(overlap * 0.6, 2);
                if (isSideCollision) {
                    posPushStrength *= 0.25; // 将侧面位置推力减少到1/4
                }
                
                if (a.isNPC) {
                    a.targetX -= nx * posPushStrength;
                    a.targetY -= ny * posPushStrength;
                } else {
                    a.x -= nx * posPushStrength;
                    a.y -= ny * posPushStrength;
                }
                if (b.isNPC) {
                    b.targetX += nx * posPushStrength;
                    b.targetY += ny * posPushStrength;
                } else {
                    b.x += nx * posPushStrength;
                    b.y += ny * posPushStrength;
                }

                // 沿法线的速度分量
                let avx = Math.cos(a.direction) * a.speed;
                let avy = Math.sin(a.direction) * a.speed;
                let bvx = Math.cos(b.direction) * b.speed;
                let bvy = Math.sin(b.direction) * b.speed;

                let aDotN = avx * nx + avy * ny;
                let bDotN = bvx * nx + bvy * ny;

                // 始终解决以脱离粘连
                let relVel = aDotN - bDotN;
                if (relVel > -0.5) {
                    let restitution = 0.6;
                    let impulse = (1 + restitution) * Math.max(relVel, 0.5) / 2;
                    impulse = clamp(impulse, 1.0, 4.0);
                    
                    // 减少侧面碰撞的速度冲量
                    if (isSideCollision) {
                        impulse *= 0.25;
                    }

                    avx -= impulse * nx;
                    avy -= impulse * ny;
                    bvx += impulse * nx;
                    bvy += impulse * ny;

                    let newDirA = Math.atan2(avy, avx);
                    let newDirB = Math.atan2(bvy, bvx);
                    let newSpeedA = Math.sqrt(avx * avx + avy * avy);
                    let newSpeedB = Math.sqrt(bvx * bvx + bvy * bvy);

                    let blendFactor = 0.7;
                    a.direction = a.direction + angleDiff(a.direction, newDirA) * blendFactor;
                    b.direction = b.direction + angleDiff(b.direction, newDirB) * blendFactor;
                    a.direction = normalizeAngle(a.direction);
                    b.direction = normalizeAngle(b.direction);

                    let minBounceSpeed = 2.0;
                    a.speed = lerp(Math.abs(a.speed), newSpeedA, 0.6) * (a.speed >= 0 ? 1 : -1);
                    b.speed = lerp(Math.abs(b.speed), newSpeedB, 0.6) * (b.speed >= 0 ? 1 : -1);
                    a.speed *= 0.85;
                    b.speed *= 0.85;
                    if (Math.abs(a.speed) < minBounceSpeed) a.speed = minBounceSpeed * (a.speed >= 0 ? 1 : -1);
                    if (Math.abs(b.speed) < minBounceSpeed) b.speed = minBounceSpeed * (b.speed >= 0 ? 1 : -1);
                    a.collisionPenalty = 0.4;
                    b.collisionPenalty = 0.4;

                    a.speed = clamp(a.speed, -a.maxSpeed, a.maxSpeed);
                    b.speed = clamp(b.speed, -b.maxSpeed, b.maxSpeed);

                    if (a.collisionCooldown <= 0 && b.collisionCooldown <= 0) {
                        // 仅在玩家附近播放碰撞声音（性能 + 沉浸感）
                        let playSound = false;
                        if (player) {
                            let collisionDist = player ? Math.sqrt((a.x - player.x) ** 2 + (a.y - player.y) ** 2) : 0;
                            playSound = collisionDist < 500;
                        } else {
                            playSound = true;
                        }
                        
                        if (playSound) {
                            playCollisionSound();
                        }
                        a.collisionCooldown = 0.1;
                        b.collisionCooldown = 0.1;
                    }

                    // 更少的火花带限制检查 - 使用计数器而不是过滤器
                    let cx = (a.x + b.x) / 2;
                    let cy = (a.y + b.y) / 2;
                    let maxSparks = Math.min(4, MAX_SPARKS - particleCounts.spark);
                    for (let s = 0; s < maxSparks; s++) {
                        spawnSpark(cx, cy);
                    }
                }
            }
        }
    }
}

// ==================== 场景碰撞 ====================
function checkSceneryCollision(car) {
    // 如果车辆在分支道路上则跳过场景碰撞
    if (isOnBranch(car.x, car.y)) return;

    let nearby = getSceneryNear(car.x, car.y, 80);
    for (let i = 0; i < nearby.length; i++) {
        let item = nearby[i];

        // 对所有树木使用固定的最小碰撞半径（大小20 * 0.45 = 9）
        let itemRadius = item.type === 'tree' ? 20 * 0.45 : 12;

        let collided = false;
        let collisionX = item.x;
        let collisionY = item.y;

        // 玩家使用双圆（胶囊）碰撞以获得更好的矩形近似
        if (car.isPlayer) {
            let result = checkTwoCircleCollision(car, item.x, item.y, itemRadius);
            collided = result.collided;
            if (collided) {
                collisionX = result.closestX;
                collisionY = result.closestY;
            }
        } else {
            // NPC使用简单的圆形碰撞
            let dx = car.x - item.x;
            let dy = car.y - item.y;
            let checkRadius = itemRadius + 10;
            if (Math.abs(dx) > checkRadius || Math.abs(dy) > checkRadius) continue;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < itemRadius + 8 && dist > 0.01) {
                collided = true;
                collisionX = car.x - dx;
                collisionY = car.y - dy;
            }
        }

        if (collided) {
            // 从碰撞点计算推动方向
            let dx = car.x - collisionX;
            let dy = car.y - collisionY;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let nx = dist > 0.01 ? dx / dist : 0;
            let ny = dist > 0.01 ? dy / dist : -1;
            
            // 将车辆推离碰撞点
            let pushStrength = Math.min(itemRadius * 0.4, 3);
            car.x += nx * pushStrength;
            car.y += ny * pushStrength;
            
            // 仅应用阻挡效果 - 无弹跳，只是减速
            car.speed *= 0.5;
            car.collisionPenalty = 0.5;
            
            // 每次碰撞仅播放一次声音和粒子（使用collisionCooldown）
            if (car.isPlayer && car.collisionCooldown <= 0) {
                playWallSound();
                car.collisionCooldown = 0.1;
                
                // 每次碰撞仅生成一次粒子
                let maxScenerySparks = Math.min(2, MAX_SPARKS - particleCounts.spark);
                for (let s = 0; s < maxScenerySparks; s++) {
                    spawnSpark(car.x - nx * 10, car.y - ny * 10);
                }
            }
        }
    }
}

// 玩家车辆的双圆（胶囊）碰撞 - 比矩形简单但形状近似更好
function checkTwoCircleCollision(car, cx, cy, itemRadius) {
    let cos = Math.cos(car.direction);
    let sin = Math.sin(car.direction);
    
    // 前后圆的位置（在车头和车尾）
    let frontOffset = CAR_LENGTH * 0.2;
    let backOffset = -CAR_LENGTH * 0.2;
    let circleRadius = CAR_WIDTH * 0.4;
    
    // 前圆中心
    let frontX = car.x + frontOffset * cos;
    let frontY = car.y + frontOffset * sin;
    
    // 后圆中心
    let backX = car.x + backOffset * cos;
    let backY = car.y + backOffset * sin;
    
    // 检查与前圆的碰撞
    let dx1 = cx - frontX;
    let dy1 = cy - frontY;
    let dist1Sq = dx1 * dx1 + dy1 * dy1;
    let combinedRadius1 = circleRadius + itemRadius;
    
    // 检查与后圆的碰撞
    let dx2 = cx - backX;
    let dy2 = cy - backY;
    let dist2Sq = dx2 * dx2 + dy2 * dy2;
    let combinedRadius2 = circleRadius + itemRadius;
    
    // 使用更近的圆
    if (dist1Sq < combinedRadius1 * combinedRadius1) {
        // 与前圆碰撞 - 找到圆上最近的点
        let dist1 = Math.sqrt(dist1Sq);
        let closestX = frontX + (dx1 / dist1) * circleRadius;
        let closestY = frontY + (dy1 / dist1) * circleRadius;
        return { collided: true, closestX: closestX, closestY: closestY };
    }
    
    if (dist2Sq < combinedRadius2 * combinedRadius2) {
        // 与后圆碰撞 - 找到圆上最近的点
        let dist2 = Math.sqrt(dist2Sq);
        let closestX = backX + (dx2 / dist2) * circleRadius;
        let closestY = backY + (dy2 / dist2) * circleRadius;
        return { collided: true, closestX: closestX, closestY: closestY };
    }
    
    return { collided: false, closestX: cx, closestY: cy };
}

// 使用双圆（胶囊）检查两车之间的碰撞
function checkCarToCarCollision(carA, carB) {
    let cosA = Math.cos(carA.direction);
    let sinA = Math.sin(carA.direction);
    let cosB = Math.cos(carB.direction);
    let sinB = Math.sin(carB.direction);
    
    let frontOffset = CAR_LENGTH * 0.2;
    let backOffset = -CAR_LENGTH * 0.2;
    let circleRadius = CAR_WIDTH * 0.4;
    
    // 获取车辆A的圆
    let aFrontX = carA.x + frontOffset * cosA;
    let aFrontY = carA.y + frontOffset * sinA;
    let aBackX = carA.x + backOffset * cosA;
    let aBackY = carA.y + backOffset * sinA;
    
    // 获取车辆B的圆
    let bFrontX = carB.x + frontOffset * cosB;
    let bFrontY = carB.y + frontOffset * sinB;
    let bBackX = carB.x + backOffset * cosB;
    let bBackY = carB.y + backOffset * sinB;
    
    let minDistSq = (circleRadius * 2) * (circleRadius * 2);
    let collisionInfo = null;
    
    // 检查所有4种组合：A前vs B前，A前vs B后，A后vs B前，A后vs B后
    let pairs = [
        [aFrontX, aFrontY, bFrontX, bFrontY],
        [aFrontX, aFrontY, bBackX, bBackY],
        [aBackX, aBackY, bFrontX, bFrontY],
        [aBackX, aBackY, bBackX, bBackY]
    ];
    
    for (let pair of pairs) {
        let dx = pair[2] - pair[0];
        let dy = pair[3] - pair[1];
        let distSq = dx * dx + dy * dy;
        
        if (distSq < minDistSq && distSq > 0.01) {
            minDistSq = distSq;
            let d = Math.sqrt(distSq);
            // A圆上最近的点
            let closestX = pair[0] - (dx / d) * circleRadius;
            let closestY = pair[1] - (dy / d) * circleRadius;
            collisionInfo = {
                dx: dx,
                dy: dy,
                d: d,
                nx: dx / d,
                ny: dy / d,
                closestX: closestX,
                closestY: closestY,
                overlap: circleRadius * 2 - d
            };
        }
    }
    
    return collisionInfo;
}

// ==================== 终点线碰撞（物理） ====================
let finishSoundsStopped = false;
let finishResultsShown = false;

function checkFinishLine() {
    let lastIdx = trackPath.length - 1;
    let fp = trackPath[lastIdx];
    let halfW = TRACK_WIDTH / 2;
    // 终点线段端点
    let flx1 = fp.x + fp.nx * halfW, fly1 = fp.y + fp.ny * halfW;
    let flx2 = fp.x - fp.nx * halfW, fly2 = fp.y - fp.ny * halfW;
    
    // 检查玩家
    if (player && !player.finished && !finishLineCrossed) {
        // 车头点
        let carFrontX = player.x + Math.cos(player.direction) * CAR_LENGTH * 0.4;
        let carFrontY = player.y + Math.sin(player.direction) * CAR_LENGTH * 0.4;
        if (segmentIntersect(playerPrevX, playerPrevY, carFrontX, carFrontY, flx1, fly1, flx2, fly2)) {
            if (player.currentPathIdx > trackPath.length * 0.7) {
                player.finished = true;
                player.finishTime = raceTime;
                finalRaceTime = raceTime;
                finalDistance = totalDistance;
                finishLineCrossed = true;
                finishSoundsStopped = false;
                finishResultsShown = false;
            }
        }
    }
    
    // 检查NPC
    for (let npc of activeNPCs) {
        if (!npc.finished) {
            let carFrontX = npc.x + Math.cos(npc.direction) * CAR_LENGTH * 0.4;
            let carFrontY = npc.y + Math.sin(npc.direction) * CAR_LENGTH * 0.4;
            // 存储前一个位置用于相交检查
            let npcPrevX = npc.x - Math.cos(npc.direction) * npc.speed;
            let npcPrevY = npc.y - Math.sin(npc.direction) * npc.speed;
            if (segmentIntersect(npcPrevX, npcPrevY, carFrontX, carFrontY, flx1, fly1, flx2, fly2)) {
                if (npc.currentPathIdx > trackPath.length * 0.7) {
                    npc.finished = true;
                    npc.finishTime = raceTime;
                }
            }
        }
    }
}

// 每帧在比赛中调用以处理完成后过渡
function updateFinishState() {
    if (!player || !player.finished) return;
    let elapsed = raceTime - player.finishTime;
    if (!finishSoundsStopped && elapsed > 3) {
        finishSoundsStopped = true;
        stopGameSounds();
    }
    // 在1秒时显示结果覆盖层但保持比赛状态以滑行
    if (!finishResultsShown && elapsed > 1) {
        finishResultsShown = true;
    }
}

// ==================== 排名（不用于结果，保留用于小地图） ====================
function getRankings() {
    return [player];
}

// ==================== 粒子 ====================
// 带空闲列表的粒子池系统，实现O(1)分配
// 活动集合跟踪哪些索引是活动的，避免扫描所有800个槽位
const MAX_PARTICLES = 800;
const MAX_SPARKS = 300;
const MAX_DUST = 200;
let particlePool = [];
let particleFreeList = []; // 空闲粒子的索引
let activeParticleSet = []; // 活动粒子的索引
let particleCounts = { spark: 0, dust: 0, total: 0 };

function initParticlePool() {
    particlePool = [];
    particleFreeList = [];
    activeParticleSet = [];
    for (let i = 0; i < MAX_PARTICLES; i++) {
        particlePool.push({
            active: false,
            x: 0, y: 0,
            vx: 0, vy: 0,
            life: 0,
            decay: 0,
            size: 0,
            color: '',
            type: 'spark'
        });
        particleFreeList.push(i);
    }
    particleCounts = { spark: 0, dust: 0, total: 0 };
}
initParticlePool();

function allocateParticle() {
    if (particleFreeList.length === 0) return null;
    let idx = particleFreeList.pop();
    activeParticleSet.push(idx);
    return particlePool[idx];
}

function spawnSpark(x, y) {
    if (particleCounts.spark >= MAX_SPARKS) return;
    let p = allocateParticle();
    if (!p) return;
    p.active = true;
    p.x = x;
    p.y = y;
    p.vx = randRange(-4, 4);
    p.vy = randRange(-4, 4);
    p.life = 1;
    p.decay = randRange(0.03, 0.08);
    p.size = randRange(2, 5);
    p.color = COLORS.spark[randInt(0, COLORS.spark.length - 1)];
    p.type = 'spark';
    particleCounts.spark++;
    particleCounts.total++;
}

function spawnDust(x, y, speed, dir) {
    if (particleCounts.dust >= MAX_DUST) return;
    let p = allocateParticle();
    if (!p) return;
    p.active = true;
    p.x = x - Math.cos(dir) * CAR_LENGTH * 0.3;
    p.y = y - Math.sin(dir) * CAR_LENGTH * 0.3;
    p.vx = randRange(-1.5, 1.5) - Math.cos(dir) * 1;
    p.vy = randRange(-1.5, 1.5) - Math.sin(dir) * 1;
    p.life = 1;
    p.decay = randRange(0.02, 0.04);
    p.size = randRange(4, 12);
    p.color = COLORS.dust[randInt(0, COLORS.dust.length - 1)];
    p.type = 'dust';
    particleCounts.dust++;
    particleCounts.total++;
}

function updateParticles() {
    particleCounts.spark = 0;
    particleCounts.dust = 0;
    let newActive = [];

    for (let j = 0; j < activeParticleSet.length; j++) {
        let i = activeParticleSet[j];
        let p = particlePool[i];
        if (!p.active) {
            particleFreeList.push(i);
            continue;
        }

        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.type === 'dust') {
            p.size *= 1.02;
            p.vx *= 0.96;
            p.vy *= 0.96;
        }

        if (p.life <= 0) {
            p.active = false;
            particleFreeList.push(i); // 返回空闲列表
        } else {
            newActive.push(i);
            if (p.type === 'spark') particleCounts.spark++;
            else if (p.type === 'dust') particleCounts.dust++;
        }
    }
    activeParticleSet = newActive;
    particleCounts.total = newActive.length;
}

// 菜单粒子
function initMenuParticles() {
    menuParticles = [];
    for (let i = 0; i < 60; i++) {
        menuParticles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: randRange(-0.3, 0.3),
            vy: randRange(-0.5, -0.1),
            size: randRange(1, 3),
            alpha: randRange(0.1, 0.5),
            pulse: Math.random() * Math.PI * 2
        });
    }
}
initMenuParticles();

function updateMenuParticles() {
    for (let p of menuParticles) {
        p.x += p.vx;
        p.y += p.vy;
        p.pulse += 0.02;
        if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
        if (p.x < -10) p.x = W + 10;
        if (p.x > W + 10) p.x = -10;
    }
}

// ==================== CAMERA ====================

function updateCamera() {
    if (!player) return;

    // 镜头角度只跟随玩家车辆方向，不再响应左右键旋转
    let targetAngle = -player.direction + Math.PI * 1.5;

    let angleDelta = angleDiff(camera.angle, targetAngle);
    camera.angle += angleDelta * 0.12;

    // 为worldToScreen预计算三角函数值
    cameraTransform.cos = Math.cos(camera.angle);
    cameraTransform.sin = Math.sin(camera.angle);

    // 清除旧的swayOffset（不再使用水平偏移）
    camera.swayOffset = 0;
    
    // 弹性镜头效果：根据转向和速度计算离心力
    let lateralAcceleration = player.steeringInput * player.speed * player.speed * CAMERA_SWAY_SENSITIVITY;
    camera.elasticSway += lateralAcceleration * CAMERA_ELASTICITY;
    camera.elasticSway *= CAMERA_DAMPING;
    camera.elasticSway = clamp(camera.elasticSway, -100, 100);

    camera.x = player.x;
    camera.y = player.y;

    let halfW = W / 2 / VIEW_SCALE + VIEW_MARGIN;
    let halfH = H / 2 / VIEW_SCALE + VIEW_MARGIN;
    camera.viewBounds.minX = camera.x - halfW;
    camera.viewBounds.maxX = camera.x + halfW;
    camera.viewBounds.minY = camera.y - halfH;
    camera.viewBounds.maxY = camera.y + halfH;

    // 根据玩家位置计算可见赛道索引范围
    if (player && trackPath.length > 0) {
        let playerIdx = player.currentPathIdx;
        let viewRadius = Math.max(W, H) + VIEW_MARGIN * 2;
        // 估算视野内能容纳多少赛道点（约每10-30世界单位1个点）
        let idxRange = Math.ceil(viewRadius / 8) + VISIBLE_RANGE_PADDING;
        visibleTrackRange.start = Math.max(0, playerIdx - idxRange);
        visibleTrackRange.end = Math.min(trackPath.length - 1, playerIdx + idxRange);
        
        // 查找因赛道折叠而额外可见的段落
        // 检查正常范围外可能可见的段落
        additionalVisibleSegments = [];
        let checkStep = 20; // 每20个点检查一次以提高效率
        let viewBounds = camera.viewBounds;
        let expandedMargin = VIEW_MARGIN + 100;
        
        // 检查可见范围之前的段落
        for (let i = 0; i < visibleTrackRange.start; i += checkStep) {
            let p = trackPath[i];
            if (p.x >= viewBounds.minX - expandedMargin && p.x <= viewBounds.maxX + expandedMargin &&
                p.y >= viewBounds.minY - expandedMargin && p.y <= viewBounds.maxY + expandedMargin) {
                // 找到可见段落，扩展以包含周围的点
                let segStart = Math.max(0, i - checkStep);
                let segEnd = Math.min(visibleTrackRange.start - 1, i + checkStep);
                additionalVisibleSegments.push({ start: segStart, end: segEnd });
            }
        }
        
        // 检查可见范围之后的段落
        for (let i = visibleTrackRange.end + checkStep; i < trackPath.length; i += checkStep) {
            let p = trackPath[i];
            if (p.x >= viewBounds.minX - expandedMargin && p.x <= viewBounds.maxX + expandedMargin &&
                p.y >= viewBounds.minY - expandedMargin && p.y <= viewBounds.maxY + expandedMargin) {
                let segStart = Math.max(visibleTrackRange.end + 1, i - checkStep);
                let segEnd = Math.min(trackPath.length - 1, i + checkStep);
                additionalVisibleSegments.push({ start: segStart, end: segEnd });
            }
        }
    }
}

// 优化的worldToScreen - 写入提供的对象以避免分配
function worldToScreenFast(wx, wy, out) {
    let dx = wx - camera.x;
    let dy = wy - camera.y;
    out.x = W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset + camera.elasticSway;
    out.y = H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE;
    return out;
}

// 可重用的屏幕点对象以避免分配
const screenPointCache = { x: 0, y: 0 };
const screenPointCache2 = { x: 0, y: 0 };

function worldToScreen(wx, wy) {
    return worldToScreenFast(wx, wy, screenPointCache);
}

function isInViewBounds(x, y, margin) {
    margin = margin || 0;
    return x >= camera.viewBounds.minX - margin && x <= camera.viewBounds.maxX + margin &&
           y >= camera.viewBounds.minY - margin && y <= camera.viewBounds.maxY + margin;
}

// drawStartFinishLine的预分配角点数组
let startLineCorners = [
    { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }
];

function drawStartFinishLine(pathIdx) {
    if (pathIdx < 0 || pathIdx >= trackPath.length) return;
    
    // 获取点
    let p = trackPath[pathIdx];
    
    // 使用点的法线作为垂直方向（横跨道路）
    // 这确保起点和终点线与道路边缘对齐
    let perpX = p.nx;
    let perpY = p.ny;
    
    // 沿道路的方向（切线）
    let dirX = -p.ny;
    let dirY = p.nx;
    
    let halfW = TRACK_WIDTH / 2;
    let checks = 8;
    let checkSize = TRACK_WIDTH / checks;
    let lineDepth = checkSize * 0.6;
    
    let camX = camera.x, camY = camera.y;
    let camCos = cameraTransform.cos, camSin = cameraTransform.sin;
    let sway = camera.swayOffset;

    for (let c = 0; c < checks; c++) {
        for (let row = 0; row < 2; row++) {
            let frac = (c + 0.5) / checks - 0.5;
            let lateral = frac * TRACK_WIDTH;
            let forward = (row - 0.5) * lineDepth;

            // 计算世界坐标位置
            let wx = p.x + perpX * lateral + dirX * forward;
            let wy = p.y + perpY * lateral + dirY * forward;

            let hw = checkSize * 0.5;
            let hd = lineDepth * 0.5;
            
            // 在世界空间计算角点
            let cx0 = wx - perpX * hw - dirX * hd;
            let cy0 = wy - perpY * hw - dirY * hd;
            let cx1 = wx + perpX * hw - dirX * hd;
            let cy1 = wy + perpY * hw - dirY * hd;
            let cx2 = wx + perpX * hw + dirX * hd;
            let cy2 = wy + perpY * hw + dirY * hd;
            let cx3 = wx - perpX * hw + dirX * hd;
            let cy3 = wy - perpY * hw + dirY * hd;
            
            // 转换到屏幕空间
            let dx0 = cx0 - camX, dy0 = cy0 - camY;
            let dx1 = cx1 - camX, dy1 = cy1 - camY;
            let dx2 = cx2 - camX, dy2 = cy2 - camY;
            let dx3 = cx3 - camX, dy3 = cy3 - camY;
            
            startLineCorners[0].x = W / 2 + (dx0 * camCos - dy0 * camSin) * VIEW_SCALE + sway;
            startLineCorners[0].y = H * 0.6 + (dx0 * camSin + dy0 * camCos) * VIEW_SCALE;
            startLineCorners[1].x = W / 2 + (dx1 * camCos - dy1 * camSin) * VIEW_SCALE + sway;
            startLineCorners[1].y = H * 0.6 + (dx1 * camSin + dy1 * camCos) * VIEW_SCALE;
            startLineCorners[2].x = W / 2 + (dx2 * camCos - dy2 * camSin) * VIEW_SCALE + sway;
            startLineCorners[2].y = H * 0.6 + (dx2 * camSin + dy2 * camCos) * VIEW_SCALE;
            startLineCorners[3].x = W / 2 + (dx3 * camCos - dy3 * camSin) * VIEW_SCALE + sway;
            startLineCorners[3].y = H * 0.6 + (dx3 * camSin + dy3 * camCos) * VIEW_SCALE;

            let minX = Math.min(startLineCorners[0].x, startLineCorners[1].x, startLineCorners[2].x, startLineCorners[3].x);
            let maxX = Math.max(startLineCorners[0].x, startLineCorners[1].x, startLineCorners[2].x, startLineCorners[3].x);
            let minY = Math.min(startLineCorners[0].y, startLineCorners[1].y, startLineCorners[2].y, startLineCorners[3].y);
            let maxY = Math.max(startLineCorners[0].y, startLineCorners[1].y, startLineCorners[2].y, startLineCorners[3].y);
            if (maxX < -50 || minX > W + 50 || maxY < -50 || minY > H + 50) continue;

            ctx.fillStyle = (c + row) % 2 === 0 ? COLORS.startLine1 : COLORS.startLine2;
            ctx.beginPath();
            ctx.moveTo(startLineCorners[0].x, startLineCorners[0].y);
            ctx.lineTo(startLineCorners[1].x, startLineCorners[1].y);
            ctx.lineTo(startLineCorners[2].x, startLineCorners[2].y);
            ctx.lineTo(startLineCorners[3].x, startLineCorners[3].y);
            ctx.closePath();
            ctx.fill();
        }
    }
}

function drawCar(car) {
    // 内联屏幕转换
    let dx = car.x - camera.x;
    let dy = car.y - camera.y;
    let sx = W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
    let sy = H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE;
    
    if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) return;

    let angle = car.visualAngle + camera.angle + Math.PI / 2;
    let w = car.width * VIEW_SCALE;
    let h = car.length * VIEW_SCALE;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);

    // Shadow - 根据光线照射角度连续计算阴影位置
    const SUN_ANGLE = Math.PI / 4; // 阳光从世界坐标系的45度方向照射
    const SHADOW_DISTANCE = 5; // 阴影距离
    
    // 计算车身相对于阳光的角度
    let angleDiff = car.visualAngle - SUN_ANGLE;
    
    // 归一化到 -PI 到 PI
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    
    // 连续计算阴影偏移 - 阴影始终出现在背光侧
    // 当车身旋转时，阴影平滑地绕车身移动
    let shadowOffsetX = Math.sin(angleDiff) * SHADOW_DISTANCE;
    let shadowOffsetY = Math.cos(angleDiff) * SHADOW_DISTANCE;
    
    ctx.fillStyle = COLORS.shadow;
    ctx.beginPath();
    roundRect(ctx, -w/2 + shadowOffsetX, -h/2 + shadowOffsetY, w, h, 4);
    ctx.fill();

    // 车身
    ctx.fillStyle = car.color;
    ctx.beginPath();
    roundRect(ctx, -w/2, -h/2, w, h, 4);
    ctx.fill();

    // 车身高光
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(-w/2 + 2, -h/2 + 2, w - 4, h * 0.35);

    // 挡风玻璃（前）
    ctx.fillStyle = COLORS.windshield;
    ctx.beginPath();
    roundRect(ctx, -w/2 + 3, -h/2 + h * 0.35, w - 6, h * 0.2, 2);
    ctx.fill();

    // 后窗
    ctx.fillStyle = COLORS.rearWindow;
    ctx.beginPath();
    roundRect(ctx, -w/2 + 4, h/2 - h * 0.22, w - 8, h * 0.1, 2);
    ctx.fill();

    // 前灯
    ctx.fillStyle = COLORS.headlight;
    ctx.fillRect(-w/2 + 2, -h/2, 5, 3);
    ctx.fillRect(w/2 - 7, -h/2, 5, 3);

    // 尾灯
    ctx.fillStyle = COLORS.taillight;
    ctx.fillRect(-w/2 + 2, h/2 - 3, 5, 3);
    ctx.fillRect(w/2 - 7, h/2 - 3, 5, 3);

    ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
}

function drawParticles() {
    for (let j = 0; j < activeParticleSet.length; j++) {
        let p = particlePool[activeParticleSet[j]];
        if (!p.active) continue;

        let dx = p.x - camera.x;
        let dy = p.y - camera.y;
        let px = W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let py = H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE;

        if (px < -20 || px > W + 20 || py < -20 || py > H + 20) continue;

        ctx.globalAlpha = p.life;
        if (p.type === 'spark') {
            ctx.fillStyle = p.color;
            ctx.fillRect(px - p.size/2, py - p.size/2, p.size, p.size);
        } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(px, py, p.size * VIEW_SCALE, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
}

// ==================== UI（中文） ====================
function drawHUD() {
    ctx.save();

    // --- 圆形速度表 ---
    let maxDisplay = 220;
    let speedVal = Math.abs(Math.round(player.speed / player.maxSpeed * maxDisplay));
    let speedPct = clamp(speedVal / maxDisplay, 0, 1);
    let gaugeR = 38;
    let gaugeCX = 16 + gaugeR + 4;
    let gaugeCY = 16 + gaugeR + 4;
    let arcStart = Math.PI * 0.75;
    let arcEnd = Math.PI * 2.25;
    let arcRange = arcEnd - arcStart;

    // 赛道环背景
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.arc(gaugeCX, gaugeCY, gaugeR, arcStart, arcEnd);
    ctx.stroke();

    // 填充弧形
    let fillEnd = arcStart + arcRange * speedPct;
    
    // 根据速度百分比从绿色渐变到红色
    let arcColor;
    if (speedPct < 0.5) {
        // 绿色到黄色渐变
        let t = speedPct * 2;
        arcColor = `rgb(${Math.floor(255 * (1 - t))}, ${255}, 0)`;
    } else {
        // 黄色到红色渐变
        let t = (speedPct - 0.5) * 2;
        arcColor = `rgb(255, ${Math.floor(255 * (1 - t))}, 0)`;
    }
    ctx.strokeStyle = arcColor;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(gaugeCX, gaugeCY, gaugeR, arcStart, fillEnd);
    ctx.stroke();
    ctx.lineCap = 'butt';

    // 速度文本居中
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(speedVal, gaugeCX, gaugeCY - 3);
    ctx.font = '9px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('km/h', gaugeCX, gaugeCY + 13);
    ctx.textBaseline = 'alphabetic';

    // --- 右下角主页按钮 ---
    let btnR = 22;
    let btnX = W - 40;
    let btnY = H - 40;
    homeButtonRect = { x: btnX - btnR, y: btnY - btnR, w: btnR * 2, h: btnR * 2 };
    
    // 检查悬停状态
    let mx = lastMouseX || 0;
    let my = lastMouseY || 0;
    let isHomeHover = (mx >= homeButtonRect.x && mx <= homeButtonRect.x + homeButtonRect.w &&
                       my >= homeButtonRect.y && my <= homeButtonRect.y + homeButtonRect.h);
    
    // 悬停时的按钮背景
    if (isHomeHover) {
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(btnX, btnY, btnR, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.strokeStyle = isHomeHover ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.6)';
    ctx.lineWidth = isHomeHover ? 2.5 : 2;
    ctx.beginPath();
    ctx.arc(btnX, btnY, btnR, 0, Math.PI * 2);
    ctx.stroke();
    
    // 主页图标（房屋形状）- 白色填充
    ctx.fillStyle = isHomeHover ? '#ffffff' : 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.moveTo(btnX, btnY - 9);
    ctx.lineTo(btnX - 10, btnY - 1);
    ctx.lineTo(btnX - 7, btnY - 1);
    ctx.lineTo(btnX - 7, btnY + 8);
    ctx.lineTo(btnX + 7, btnY + 8);
    ctx.lineTo(btnX + 7, btnY - 1);
    ctx.lineTo(btnX + 10, btnY - 1);
    ctx.closePath();
    ctx.fill();

    // --- Map Seed at bottom left ---
    let seedText = '种子: ' + getMapSeed();
    ctx.font = '11px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.textAlign = 'left';
    ctx.fillText(seedText, 16, H - 16);

    drawTouchControls();
    ctx.restore();
}

function drawTouchControls() {
    if (!('ontouchstart' in window)) return;
    setupTouchAreas();
    for (let a of touchAreas) {
        let isPressed = touchPressed[a.id];
        
        // 按钮背景 - 按下时更亮
        if (isPressed) {
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
        } else {
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
        }
        
        ctx.beginPath();
        roundRect(ctx, a.x, a.y, a.w, a.h, 10);
        ctx.fill();
        
        // 内边框（内凹描边效果）
        let borderWidth = isPressed ? 3 : 2;
        let borderColor = isPressed ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.6)';
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = borderWidth;
        
        ctx.beginPath();
        roundRect(ctx, a.x + borderWidth, a.y + borderWidth, a.w - borderWidth * 2, a.h - borderWidth * 2, 8);
        ctx.stroke();
        
        // 按下时的内发光效果
        if (isPressed) {
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            roundRect(ctx, a.x + 6, a.y + 6, a.w - 12, a.h - 12, 6);
            ctx.fill();
        }

        // 按钮标签
        ctx.fillStyle = isPressed ? '#fff' : 'rgba(255,255,255,0.9)';
        ctx.font = isPressed ? 'bold 22px sans-serif' : '20px sans-serif';
        ctx.textAlign = 'center';
        let labels = { up: '▲', down: '▼', left: '◀', right: '▶' };
        let labelY = a.y + a.h / 2 + 7;
        ctx.fillText(labels[a.id], a.x + a.w / 2, labelY);
    }
}

function formatTime(t) {
    let mins = Math.floor(t / 60);
    let secs = Math.floor(t % 60);
    let ms = Math.floor((t % 1) * 100);
    return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0') + '.' + String(ms).padStart(2, '0');
}

// ==================== 小地图 ====================
// 将静态赛道预渲染到离屏画布（每次赛道生成时绘制一次）
let minimapStaticCanvas = null;
let minimapStaticCtx = null;
const MINIMAP_SIZE = 140;

function prerenderMinimapTrack() {
    let dpr = dprEnabled ? (window.devicePixelRatio || 1) : 1;
    minimapStaticCanvas = document.createElement('canvas');
    minimapStaticCanvas.width = MINIMAP_SIZE * dpr;
    minimapStaticCanvas.height = MINIMAP_SIZE * dpr;
    minimapStaticCtx = minimapStaticCanvas.getContext('2d');
    minimapStaticCtx.scale(dpr, dpr);

    let mctx = minimapStaticCtx;
    let mb = minimapBounds;
    let scale = mb.scale;
    let cx = mb.cx, cy = mb.cy;
    let halfMap = MINIMAP_SIZE / 2;

    // 清除
    mctx.clearRect(0, 0, MINIMAP_SIZE, MINIMAP_SIZE);

    // 绘制主赛道 - 更粗的线条以清晰显示
    mctx.strokeStyle = 'rgba(255,255,255,0.45)';
    mctx.lineWidth = 3;
    mctx.beginPath();
    for (let i = 0; i < trackPath.length; i += 2) {
        let px = halfMap + (trackPath[i].x - cx) * scale;
        let py = halfMap + (trackPath[i].y - cy) * scale;
        if (i === 0) mctx.moveTo(px, py);
        else mctx.lineTo(px, py);
    }
    mctx.stroke();

    // 绘制分支 - 更粗
    mctx.strokeStyle = 'rgba(255,180,80,0.55)';
    mctx.lineWidth = 2.5;
    for (let bp of branchPaths) {
        mctx.beginPath();
        for (let i = 0; i < bp.path.length; i += 2) {
            let px = halfMap + (bp.path[i].x - cx) * scale;
            let py = halfMap + (bp.path[i].y - cy) * scale;
            if (i === 0) mctx.moveTo(px, py);
            else mctx.lineTo(px, py);
        }
        mctx.stroke();
    }

    // 起点标记（绿色）
    let spx = halfMap + (trackPath[0].x - cx) * scale;
    let spy = halfMap + (trackPath[0].y - cy) * scale;
    mctx.fillStyle = '#2ecc71';
    mctx.beginPath();
    mctx.arc(spx, spy, 5, 0, Math.PI * 2);
    mctx.fill();

    // 终点标记（棋盘格）
    let fpx = halfMap + (trackPath[trackPath.length - 1].x - cx) * scale;
    let fpy = halfMap + (trackPath[trackPath.length - 1].y - cy) * scale;
    mctx.fillStyle = '#ffffff';
    mctx.beginPath();
    mctx.arc(fpx, fpy, 5, 0, Math.PI * 2);
    mctx.fill();
    mctx.fillStyle = '#111';
    mctx.beginPath();
    mctx.arc(fpx, fpy, 2.5, 0, Math.PI * 2);
    mctx.fill();
}

function drawMinimap() {
    let mapSize = MINIMAP_SIZE;
    let mapX = W - mapSize - 16;
    let mapY = 16;

    // 背景（透明）
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    roundRect(ctx, mapX, mapY, mapSize, mapSize, 14);
    ctx.stroke();

    // 绘制预渲染的静态赛道（高分辨率）
    if (minimapStaticCanvas) {
        ctx.drawImage(minimapStaticCanvas, 0, 0, minimapStaticCanvas.width, minimapStaticCanvas.height, mapX, mapY, mapSize, mapSize);
    }

    let mb = minimapBounds;
    let scale = mb.scale;
    let cx = mb.cx, cy = mb.cy;
    let halfMap = mapSize / 2;

    // 仅玩家点
    if (player) {
        let mpx = mapX + halfMap + (player.x - cx) * scale;
        let mpy = mapY + halfMap + (player.y - cy) * scale;
        ctx.fillStyle = COLORS.minimapPlayer;
        ctx.beginPath();
        ctx.arc(mpx, mpy, 4, 0, Math.PI * 2);
        ctx.fill();

        // 方向指示器
        ctx.strokeStyle = COLORS.minimapPlayer;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(mpx, mpy);
        ctx.lineTo(mpx + Math.cos(player.direction) * 8, mpy + Math.sin(player.direction) * 8);
        ctx.stroke();
    }
}

// ==================== 倒计时 ====================
function drawCountdown() {
    if (countdownNumber > 0) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        let scale = 1 + (countdownTimer % 1) * 0.2;
        let alpha = 1 - (countdownTimer % 1) * 0.3;

        // 数字后的深色圆圈
        ctx.fillStyle = 'rgba(15,15,26,' + (alpha * 0.7) + ')';
        ctx.beginPath();
        ctx.arc(W / 2, H * 0.35, 60 * scale, 0, Math.PI * 2);
        ctx.fill();

        // 强调环
        ctx.strokeStyle = 'rgba(255,51,102,' + alpha + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(W / 2, H * 0.35, 60 * scale, 0, Math.PI * 2);
        ctx.stroke();

        ctx.font = 'bold ' + Math.round(72 * scale) + 'px sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
        ctx.fillText(countdownNumber, W / 2, H * 0.35);
        ctx.restore();
    } else {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let alpha = 1 - countdownTimer;
        if (alpha > 0) {
            ctx.fillStyle = 'rgba(15,15,26,' + (alpha * 0.5) + ')';
            ctx.beginPath();
            ctx.arc(W / 2, H * 0.35, 80, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = COLORS.accentGreen;
            ctx.shadowBlur = 20;
            ctx.font = 'bold 60px sans-serif';
            ctx.fillStyle = 'rgba(0,230,118,' + alpha + ')';
            ctx.fillText('出发!', W / 2, H * 0.35);
            ctx.shadowBlur = 0;
        }
        ctx.restore();
    }
}

    }, 300);
    
    setTimeout(function() {
