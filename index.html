        if (branchInfo.point) {
            let dx = car.x - branchInfo.px;
            let dy = car.y - branchInfo.py;
            let lateralDist = dx * branchInfo.pnx + dy * branchInfo.pny;
            let absDist = Math.abs(lateralDist);
            let halfW = BRANCH_WIDTH / 2;
            
            if (absDist > halfW + 20) {
                let pushDir = lateralDist > 0 ? -1 : 1;
                let pushAmount = Math.min((absDist - halfW) * 0.08, 4);
                car.x += branchInfo.pnx * pushDir * pushAmount;
                car.y += branchInfo.pny * pushDir * pushAmount;
                car.speed *= 0.98;
            }
        }
        return;
    }
    */

    let closest = findClosestTrackPoint(car.x, car.y);
    let trackDist = getTrackDistance(car.x, car.y, closest.index);
    let absDist = Math.abs(trackDist);
    let halfW = TRACK_WIDTH / 2;

    // NPC: push back onto main track if off-road
    if (absDist > halfW + 30) {
        let p = trackPath[closest.index];
        let pushDir = trackDist > 0 ? -1 : 1;
        let pushAmount = Math.min((absDist - halfW) * 0.08, 5);
        car.x += p.nx * pushDir * pushAmount;
        car.y += p.ny * pushDir * pushAmount;
        car.speed *= 0.97;
    }
    // Hard cap for NPCs only: if very far off track, teleport back
    if (closest.dist > TRACK_WIDTH * 3) {
        let p = trackPath[closest.index];
        car.x = p.x;
        car.y = p.y;
        car.direction = p.dir;
        car.speed *= 0.3;
    }
}

// ==================== CAR-TO-CAR COLLISION (SMOOTH BOUNCE) ====================
function resolveCarCollisions() {
    for (let i = 0; i < cars.length; i++) {
        for (let j = i + 1; j < cars.length; j++) {
            let a = cars[i], b = cars[j];
            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let d = Math.sqrt(dx * dx + dy * dy);
            let minDist = (CAR_WIDTH + CAR_LENGTH) / 2 * 0.7;

            if (d < minDist && d > 0.01) {
                // Collision normal
                let nx = dx / d;
                let ny = dy / d;

                // Calculate collision direction relative to car A
                let aCos = Math.cos(a.direction);
                let aSin = Math.sin(a.direction);
                // Forward component: positive = front collision, negative = rear collision
                let forwardDot = nx * aCos + ny * aSin;
                // Side component: absolute value indicates side collision
                let sideDot = Math.abs(-nx * aSin + ny * aCos);

                // Determine if this is a side collision (side component > forward component)
                let isSideCollision = sideDot > Math.abs(forwardDot);

                // Side collision has 1/4 the push effect of front/rear collision
                let overlap = minDist - d;
                
                // Position push strength (separation distance)
                let posPushStrength = Math.max(overlap * 0.6, 2);
                if (isSideCollision) {
                    posPushStrength *= 0.25; // Reduce side position push to 1/4
                }
                
                a.x -= nx * posPushStrength;
                a.y -= ny * posPushStrength;
                b.x += nx * posPushStrength;
                b.y += ny * posPushStrength;

                // Velocity components along normal
                let avx = Math.cos(a.direction) * a.speed;
                let avy = Math.sin(a.direction) * a.speed;
                let bvx = Math.cos(b.direction) * b.speed;
                let bvy = Math.sin(b.direction) * b.speed;

                let aDotN = avx * nx + avy * ny;
                let bDotN = bvx * nx + bvy * ny;

                // Always resolve to unstick
                let relVel = aDotN - bDotN;
                if (relVel > -0.5) {
                    let restitution = 0.6;
                    let impulse = (1 + restitution) * Math.max(relVel, 0.5) / 2;
                    impulse = clamp(impulse, 1.0, 4.0);
                    
                    // Reduce velocity impulse for side collisions
                    if (isSideCollision) {
                        impulse *= 0.25;
                    }

                    avx -= impulse * nx;
                    avy -= impulse * ny;
                    bvx += impulse * nx;
                    bvy += impulse * ny;

                    let newDirA = Math.atan2(avy, avx);
                    let newDirB = Math.atan2(bvy, bvx);
                    let newSpeedA = Math.sqrt(avx * avx + avy * avy);
                    let newSpeedB = Math.sqrt(bvx * bvx + bvy * bvy);

                    let blendFactor = 0.7;
                    a.direction = a.direction + angleDiff(a.direction, newDirA) * blendFactor;
                    b.direction = b.direction + angleDiff(b.direction, newDirB) * blendFactor;
                    a.direction = normalizeAngle(a.direction);
                    b.direction = normalizeAngle(b.direction);

                    let minBounceSpeed = 2.0;
                    a.speed = lerp(Math.abs(a.speed), newSpeedA, 0.6) * (a.speed >= 0 ? 1 : -1);
                    b.speed = lerp(Math.abs(b.speed), newSpeedB, 0.6) * (b.speed >= 0 ? 1 : -1);
                    a.speed *= 0.85;
                    b.speed *= 0.85;
                    if (Math.abs(a.speed) < minBounceSpeed) a.speed = minBounceSpeed * (a.speed >= 0 ? 1 : -1);
                    if (Math.abs(b.speed) < minBounceSpeed) b.speed = minBounceSpeed * (b.speed >= 0 ? 1 : -1);
                    a.collisionPenalty = 0.4;
                    b.collisionPenalty = 0.4;

                    a.speed = clamp(a.speed, -a.maxSpeed, a.maxSpeed);
                    b.speed = clamp(b.speed, -b.maxSpeed, b.maxSpeed);

                    if (a.collisionCooldown <= 0 && b.collisionCooldown <= 0) {
                        // Only play collision sound if near player (performance + immersion)
                        let playSound = false;
                        if (player) {
                            let collisionDist = player ? Math.sqrt((a.x - player.x) ** 2 + (a.y - player.y) ** 2) : 0;
                            playSound = collisionDist < 500;
                        } else {
                            playSound = true;
                        }
                        
                        if (playSound) {
                            playCollisionSound();
                        }
                        a.collisionCooldown = 0.1;
                        b.collisionCooldown = 0.1;
                    }

                    // Fewer sparks with limit check - use counter instead of filter
                    let cx = (a.x + b.x) / 2;
                    let cy = (a.y + b.y) / 2;
                    let maxSparks = Math.min(4, MAX_SPARKS - particleCounts.spark);
                    for (let s = 0; s < maxSparks; s++) {
                        spawnSpark(cx, cy);
                    }
                }
            }
        }
    }
}

// ==================== SCENERY COLLISION ====================
function checkSceneryCollision(car) {
    // Skip scenery collision if car is on a branch road
    if (isOnBranch(car.x, car.y)) return;

    let nearby = getSceneryNear(car.x, car.y, 80);
    for (let i = 0; i < nearby.length; i++) {
        let item = nearby[i];

        // Use fixed minimum collision radius for all trees (size 20 * 0.45 = 9)
        let itemRadius = item.type === 'tree' ? 20 * 0.45 : 12;

        let collided = false;
        let collisionX = item.x;
        let collisionY = item.y;

        // Player uses two-circle (capsule) collision for better rectangular approximation
        if (car.isPlayer) {
            let result = checkTwoCircleCollision(car, item.x, item.y, itemRadius);
            collided = result.collided;
            if (collided) {
                collisionX = result.closestX;
                collisionY = result.closestY;
            }
        } else {
            // NPC uses simple circular collision
            let dx = car.x - item.x;
            let dy = car.y - item.y;
            let checkRadius = itemRadius + 10;
            if (Math.abs(dx) > checkRadius || Math.abs(dy) > checkRadius) continue;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < itemRadius + 8 && dist > 0.01) {
                collided = true;
                collisionX = car.x - dx;
                collisionY = car.y - dy;
            }
        }

        if (collided) {
            // Calculate push direction from collision point
            let dx = car.x - collisionX;
            let dy = car.y - collisionY;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let nx = dist > 0.01 ? dx / dist : 0;
            let ny = dist > 0.01 ? dy / dist : -1;
            
            // Push car away from collision point
            let pushStrength = Math.min(itemRadius * 0.4, 3);
            car.x += nx * pushStrength;
            car.y += ny * pushStrength;
            
            // Only apply blocking effect - no bounce, just slow down
            car.speed *= 0.5;
            car.collisionPenalty = 0.5;
            
            // Only play sound and particles once per collision (using collisionCooldown)
            if (car.isPlayer && car.collisionCooldown <= 0) {
                playWallSound();
                car.collisionCooldown = 0.1;
                
                // Spawn particles only once per collision
                let maxScenerySparks = Math.min(2, MAX_SPARKS - particleCounts.spark);
                for (let s = 0; s < maxScenerySparks; s++) {
                    spawnSpark(car.x - nx * 10, car.y - ny * 10);
                }
            }
        }
    }
}

// Two-circle (capsule) collision for player car - simpler than rectangle but better shape approximation
function checkTwoCircleCollision(car, cx, cy, itemRadius) {
    let cos = Math.cos(car.direction);
    let sin = Math.sin(car.direction);
    
    // Position of front and back circles (at car nose and tail)
    let frontOffset = CAR_LENGTH * 0.2;
    let backOffset = -CAR_LENGTH * 0.2;
    let circleRadius = CAR_WIDTH * 0.4;
    
    // Front circle center
    let frontX = car.x + frontOffset * cos;
    let frontY = car.y + frontOffset * sin;
    
    // Back circle center
    let backX = car.x + backOffset * cos;
    let backY = car.y + backOffset * sin;
    
    // Check collision with front circle
    let dx1 = cx - frontX;
    let dy1 = cy - frontY;
    let dist1Sq = dx1 * dx1 + dy1 * dy1;
    let combinedRadius1 = circleRadius + itemRadius;
    
    // Check collision with back circle
    let dx2 = cx - backX;
    let dy2 = cy - backY;
    let dist2Sq = dx2 * dx2 + dy2 * dy2;
    let combinedRadius2 = circleRadius + itemRadius;
    
    // Use whichever circle is closer
    if (dist1Sq < combinedRadius1 * combinedRadius1) {
        // Collision with front circle - find closest point on circle
        let dist1 = Math.sqrt(dist1Sq);
        let closestX = frontX + (dx1 / dist1) * circleRadius;
        let closestY = frontY + (dy1 / dist1) * circleRadius;
        return { collided: true, closestX: closestX, closestY: closestY };
    }
    
    if (dist2Sq < combinedRadius2 * combinedRadius2) {
        // Collision with back circle - find closest point on circle
        let dist2 = Math.sqrt(dist2Sq);
        let closestX = backX + (dx2 / dist2) * circleRadius;
        let closestY = backY + (dy2 / dist2) * circleRadius;
        return { collided: true, closestX: closestX, closestY: closestY };
    }
    
    return { collided: false, closestX: cx, closestY: cy };
}

// Check collision between two cars using two-circle (capsule) for each
function checkCarToCarCollision(carA, carB) {
    let cosA = Math.cos(carA.direction);
    let sinA = Math.sin(carA.direction);
    let cosB = Math.cos(carB.direction);
    let sinB = Math.sin(carB.direction);
    
    let frontOffset = CAR_LENGTH * 0.2;
    let backOffset = -CAR_LENGTH * 0.2;
    let circleRadius = CAR_WIDTH * 0.4;
    
    // Get circles for car A
    let aFrontX = carA.x + frontOffset * cosA;
    let aFrontY = carA.y + frontOffset * sinA;
    let aBackX = carA.x + backOffset * cosA;
    let aBackY = carA.y + backOffset * sinA;
    
    // Get circles for car B
    let bFrontX = carB.x + frontOffset * cosB;
    let bFrontY = carB.y + frontOffset * sinB;
    let bBackX = carB.x + backOffset * cosB;
    let bBackY = carB.y + backOffset * sinB;
    
    let minDistSq = (circleRadius * 2) * (circleRadius * 2);
    let collisionInfo = null;
    
    // Check all 4 combinations: A.front vs B.front, A.front vs B.back, A.back vs B.front, A.back vs B.back
    let pairs = [
        [aFrontX, aFrontY, bFrontX, bFrontY],
        [aFrontX, aFrontY, bBackX, bBackY],
        [aBackX, aBackY, bFrontX, bFrontY],
        [aBackX, aBackY, bBackX, bBackY]
    ];
    
    for (let pair of pairs) {
        let dx = pair[2] - pair[0];
        let dy = pair[3] - pair[1];
        let distSq = dx * dx + dy * dy;
        
        if (distSq < minDistSq && distSq > 0.01) {
            minDistSq = distSq;
            let d = Math.sqrt(distSq);
            // Closest point on A's circle
            let closestX = pair[0] - (dx / d) * circleRadius;
            let closestY = pair[1] - (dy / d) * circleRadius;
            collisionInfo = {
                dx: dx,
                dy: dy,
                d: d,
                nx: dx / d,
                ny: dy / d,
                closestX: closestX,
                closestY: closestY,
                overlap: circleRadius * 2 - d
            };
        }
    }
    
    return collisionInfo;
}

// ==================== FINISH LINE COLLISION (PHYSICAL) ====================
let finishSoundsStopped = false;
let finishResultsShown = false;

function checkFinishLine() {
    let lastIdx = trackPath.length - 1;
    let fp = trackPath[lastIdx];
    let halfW = TRACK_WIDTH / 2;
    // Finish line segment endpoints
    let flx1 = fp.x + fp.nx * halfW, fly1 = fp.y + fp.ny * halfW;
    let flx2 = fp.x - fp.nx * halfW, fly2 = fp.y - fp.ny * halfW;
    
    // Check player
    if (player && !player.finished && !finishLineCrossed) {
        // Car front point
        let carFrontX = player.x + Math.cos(player.direction) * CAR_LENGTH * 0.4;
        let carFrontY = player.y + Math.sin(player.direction) * CAR_LENGTH * 0.4;
        if (segmentIntersect(playerPrevX, playerPrevY, carFrontX, carFrontY, flx1, fly1, flx2, fly2)) {
            if (player.currentPathIdx > trackPath.length * 0.7) {
                player.finished = true;
                player.finishTime = raceTime;
                finalRaceTime = raceTime;
                finalDistance = totalDistance;
                finishLineCrossed = true;
                finishSoundsStopped = false;
                finishResultsShown = false;
            }
        }
    }
    
    // Check NPCs
    for (let npc of activeNPCs) {
        if (!npc.finished) {
            let carFrontX = npc.x + Math.cos(npc.direction) * CAR_LENGTH * 0.4;
            let carFrontY = npc.y + Math.sin(npc.direction) * CAR_LENGTH * 0.4;
            // Store previous position for intersection check
            let npcPrevX = npc.x - Math.cos(npc.direction) * npc.speed;
            let npcPrevY = npc.y - Math.sin(npc.direction) * npc.speed;
            if (segmentIntersect(npcPrevX, npcPrevY, carFrontX, carFrontY, flx1, fly1, flx2, fly2)) {
                if (npc.currentPathIdx > trackPath.length * 0.7) {
                    npc.finished = true;
                    npc.finishTime = raceTime;
                }
            }
        }
    }
}

// Called each frame during racing to handle post-finish transitions
function updateFinishState() {
    if (!player || !player.finished) return;
    let elapsed = raceTime - player.finishTime;
    if (!finishSoundsStopped && elapsed > 3) {
        finishSoundsStopped = true;
        stopGameSounds();
    }
    // Show results overlay at 1s but keep racing state for coasting
    if (!finishResultsShown && elapsed > 1) {
        finishResultsShown = true;
    }
}

// ==================== PARTICLES ====================
// Particle pool system with free list for O(1) allocation
// Active set tracks which indices are active to avoid scanning all 800 slots
const MAX_PARTICLES = 800;
const MAX_SPARKS = 300;
const MAX_DUST = 200;
let particlePool = [];
let particleFreeList = []; // indices of free particles
let activeParticleSet = []; // indices of active particles
let particleCounts = { spark: 0, dust: 0, total: 0 };

function initParticlePool() {
    particlePool = [];
    particleFreeList = [];
    activeParticleSet = [];
    for (let i = 0; i < MAX_PARTICLES; i++) {
        particlePool.push({
            active: false,
            x: 0, y: 0,
            vx: 0, vy: 0,
            life: 0,
            decay: 0,
            size: 0,
            color: '',
            type: 'spark'
        });
        particleFreeList.push(i);
    }
    particleCounts = { spark: 0, dust: 0, total: 0 };
}
initParticlePool();

function allocateParticle() {
    if (particleFreeList.length === 0) return null;
    let idx = particleFreeList.pop();
    activeParticleSet.push(idx);
    return particlePool[idx];
}

function spawnSpark(x, y) {
    if (particleCounts.spark >= MAX_SPARKS) return;
    let p = allocateParticle();
    if (!p) return;
    p.active = true;
    p.x = x;
    p.y = y;
    p.vx = randRange(-4, 4);
    p.vy = randRange(-4, 4);
    p.life = 1;
    p.decay = randRange(0.03, 0.08);
    p.size = randRange(2, 5);
    p.color = COLORS.spark[randInt(0, COLORS.spark.length - 1)];
    p.type = 'spark';
    particleCounts.spark++;
    particleCounts.total++;
}

function spawnDust(x, y, speed, dir) {
    if (particleCounts.dust >= MAX_DUST) return;
    let p = allocateParticle();
    if (!p) return;
    p.active = true;
    p.x = x - Math.cos(dir) * CAR_LENGTH * 0.3;
    p.y = y - Math.sin(dir) * CAR_LENGTH * 0.3;
    p.vx = randRange(-1.5, 1.5) - Math.cos(dir) * 1;
    p.vy = randRange(-1.5, 1.5) - Math.sin(dir) * 1;
    p.life = 1;
    p.decay = randRange(0.02, 0.04);
    p.size = randRange(4, 12);
    p.color = COLORS.dust[randInt(0, COLORS.dust.length - 1)];
    p.type = 'dust';
    particleCounts.dust++;
    particleCounts.total++;
}

function updateParticles() {
    particleCounts.spark = 0;
    particleCounts.dust = 0;
    let newActive = [];

    for (let j = 0; j < activeParticleSet.length; j++) {
        let i = activeParticleSet[j];
        let p = particlePool[i];
        if (!p.active) {
            particleFreeList.push(i);
            continue;
        }

        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.type === 'dust') {
            p.size *= 1.02;
            p.vx *= 0.96;
            p.vy *= 0.96;
        }

        if (p.life <= 0) {
            p.active = false;
            particleFreeList.push(i); // Return to free list
        } else {
            newActive.push(i);
            if (p.type === 'spark') particleCounts.spark++;
            else if (p.type === 'dust') particleCounts.dust++;
        }
    }
    activeParticleSet = newActive;
    particleCounts.total = newActive.length;
}

// Menu particles
function initMenuParticles() {

}

// ==================== CAMERA ====================
function updateCamera() {
    if (!player) return;

    let targetAngle = -player.direction + Math.PI * 1.5;

    let angleDelta = angleDiff(camera.angle, targetAngle);
    camera.angle += angleDelta * 0.12;

    // Precompute trig values for worldToScreen
    cameraTransform.cos = Math.cos(camera.angle);
    cameraTransform.sin = Math.sin(camera.angle);

    let inputLeft = keys['ArrowLeft'] || keys['KeyA'] || touchControls.left;
    let inputRight = keys['ArrowRight'] || keys['KeyD'] || touchControls.right;
    let targetSway = 0;
    if (inputLeft) targetSway = 35;
    if (inputRight) targetSway = -35;
    camera.swayOffset += (targetSway - camera.swayOffset) * 0.06;
    
    // 弹性镜头效果：根据转向和速度计算离心力
    let lateralAcceleration = player.steeringInput * player.speed * player.speed * CAMERA_SWAY_SENSITIVITY;
    camera.elasticSway += lateralAcceleration * CAMERA_ELASTICITY;
    camera.elasticSway *= CAMERA_DAMPING;
    camera.elasticSway = clamp(camera.elasticSway, -100, 100);

    camera.x = player.x;
    camera.y = player.y;

    let halfW = W / 2 / VIEW_SCALE + VIEW_MARGIN;
    let halfH = H / 2 / VIEW_SCALE + VIEW_MARGIN;
    camera.viewBounds.minX = camera.x - halfW;
    camera.viewBounds.maxX = camera.x + halfW;
    camera.viewBounds.minY = camera.y - halfH;
    camera.viewBounds.maxY = camera.y + halfH;

    // Compute visible track index range based on player position
    if (player && trackPath.length > 0) {
        let playerIdx = player.currentPathIdx;
        let viewRadius = Math.max(W, H) + VIEW_MARGIN * 2;
        // Estimate how many track points fit in the view (~1 point per 10-30 world units)
        let idxRange = Math.ceil(viewRadius / 8) + VISIBLE_RANGE_PADDING;
        visibleTrackRange.start = Math.max(0, playerIdx - idxRange);
        visibleTrackRange.end = Math.min(trackPath.length - 1, playerIdx + idxRange);
        
        // Find additional visible segments due to track folding back
        // Check segments outside the normal range that might be visible
        additionalVisibleSegments = [];
        let checkStep = 20; // Check every 20 points for efficiency
        let viewBounds = camera.viewBounds;
        let expandedMargin = VIEW_MARGIN + 100;
        
        // Check segments before visible range
        for (let i = 0; i < visibleTrackRange.start; i += checkStep) {
            let p = trackPath[i];
            if (p.x >= viewBounds.minX - expandedMargin && p.x <= viewBounds.maxX + expandedMargin &&
                p.y >= viewBounds.minY - expandedMargin && p.y <= viewBounds.maxY + expandedMargin) {
                // Found a visible segment, expand to include surrounding points
                let segStart = Math.max(0, i - checkStep);
                let segEnd = Math.min(visibleTrackRange.start - 1, i + checkStep);
                additionalVisibleSegments.push({ start: segStart, end: segEnd });
            }
        }
        
        // Check segments after visible range
        for (let i = visibleTrackRange.end + checkStep; i < trackPath.length; i += checkStep) {
            let p = trackPath[i];
            if (p.x >= viewBounds.minX - expandedMargin && p.x <= viewBounds.maxX + expandedMargin &&
                p.y >= viewBounds.minY - expandedMargin && p.y <= viewBounds.maxY + expandedMargin) {
                let segStart = Math.max(visibleTrackRange.end + 1, i - checkStep);
                let segEnd = Math.min(trackPath.length - 1, i + checkStep);
                additionalVisibleSegments.push({ start: segStart, end: segEnd });
            }
        }
    }
}

// Optimized worldToScreen - writes to provided object to avoid allocation
function worldToScreenFast(wx, wy, out) {
    let dx = wx - camera.x;
    let dy = wy - camera.y;
    out.x = W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset + camera.elasticSway;
    out.y = H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE;
    return out;
}

// Reusable screen point objects to avoid allocation
const screenPointCache = { x: 0, y: 0 };
const screenPointCache2 = { x: 0, y: 0 };

function worldToScreen(wx, wy) {
    return worldToScreenFast(wx, wy, screenPointCache);
}

function isInViewBounds(x, y, margin) {
    margin = margin || 0;
    return x >= camera.viewBounds.minX - margin && x <= camera.viewBounds.maxX + margin &&
           y >= camera.viewBounds.minY - margin && y <= camera.viewBounds.maxY + margin;
}

// Pre-allocated corners array for drawStartFinishLine
let startLineCorners = [
    { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }
];

function drawStartFinishLine(pathIdx) {
    if (pathIdx < 0 || pathIdx >= trackPath.length) return;
    
    // Get the point
    let p = trackPath[pathIdx];
    
    // Use the point's normal for perpendicular direction (across the road)
    // This ensures both start and finish lines align with road edges
    let perpX = p.nx;
    let perpY = p.ny;
    
    // Direction along the road (tangent)
    let dirX = -p.ny;
    let dirY = p.nx;
    
    let halfW = TRACK_WIDTH / 2;
    let checks = 8;
    let checkSize = TRACK_WIDTH / checks;
    let lineDepth = checkSize * 0.6;
    
    let camX = camera.x, camY = camera.y;
    let camCos = cameraTransform.cos, camSin = cameraTransform.sin;
    let sway = camera.swayOffset;

    for (let c = 0; c < checks; c++) {
        for (let row = 0; row < 2; row++) {
            let frac = (c + 0.5) / checks - 0.5;
            let lateral = frac * TRACK_WIDTH;
            let forward = (row - 0.5) * lineDepth;

            // Calculate world position
            let wx = p.x + perpX * lateral + dirX * forward;
            let wy = p.y + perpY * lateral + dirY * forward;

            let hw = checkSize * 0.5;
            let hd = lineDepth * 0.5;
            
            // Calculate corners in world space
            let cx0 = wx - perpX * hw - dirX * hd;
            let cy0 = wy - perpY * hw - dirY * hd;
            let cx1 = wx + perpX * hw - dirX * hd;
            let cy1 = wy + perpY * hw - dirY * hd;
            let cx2 = wx + perpX * hw + dirX * hd;
            let cy2 = wy + perpY * hw + dirY * hd;
            let cx3 = wx - perpX * hw + dirX * hd;
            let cy3 = wy - perpY * hw + dirY * hd;
            
            // Transform to screen space
            let dx0 = cx0 - camX, dy0 = cy0 - camY;
            let dx1 = cx1 - camX, dy1 = cy1 - camY;
            let dx2 = cx2 - camX, dy2 = cy2 - camY;
            let dx3 = cx3 - camX, dy3 = cy3 - camY;
            
            startLineCorners[0].x = W / 2 + (dx0 * camCos - dy0 * camSin) * VIEW_SCALE + sway;
            startLineCorners[0].y = H * 0.6 + (dx0 * camSin + dy0 * camCos) * VIEW_SCALE;
            startLineCorners[1].x = W / 2 + (dx1 * camCos - dy1 * camSin) * VIEW_SCALE + sway;
            startLineCorners[1].y = H * 0.6 + (dx1 * camSin + dy1 * camCos) * VIEW_SCALE;
            startLineCorners[2].x = W / 2 + (dx2 * camCos - dy2 * camSin) * VIEW_SCALE + sway;
            startLineCorners[2].y = H * 0.6 + (dx2 * camSin + dy2 * camCos) * VIEW_SCALE;
            startLineCorners[3].x = W / 2 + (dx3 * camCos - dy3 * camSin) * VIEW_SCALE + sway;
            startLineCorners[3].y = H * 0.6 + (dx3 * camSin + dy3 * camCos) * VIEW_SCALE;

            let minX = Math.min(startLineCorners[0].x, startLineCorners[1].x, startLineCorners[2].x, startLineCorners[3].x);
            let maxX = Math.max(startLineCorners[0].x, startLineCorners[1].x, startLineCorners[2].x, startLineCorners[3].x);
            let minY = Math.min(startLineCorners[0].y, startLineCorners[1].y, startLineCorners[2].y, startLineCorners[3].y);
            let maxY = Math.max(startLineCorners[0].y, startLineCorners[1].y, startLineCorners[2].y, startLineCorners[3].y);
            if (maxX < -50 || minX > W + 50 || maxY < -50 || minY > H + 50) continue;

            ctx.fillStyle = (c + row) % 2 === 0 ? COLORS.startLine1 : COLORS.startLine2;
            ctx.beginPath();
            ctx.moveTo(startLineCorners[0].x, startLineCorners[0].y);
            ctx.lineTo(startLineCorners[1].x, startLineCorners[1].y);
            ctx.lineTo(startLineCorners[2].x, startLineCorners[2].y);
            ctx.lineTo(startLineCorners[3].x, startLineCorners[3].y);
            ctx.closePath();
            ctx.fill();
        }
    }
}

function drawCar(car) {
    // Inline screen transform
    let dx = car.x - camera.x;
    let dy = car.y - camera.y;
    let sx = W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
    let sy = H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE;
    
    if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) return;

    let angle = car.visualAngle + camera.angle + Math.PI / 2;
    let w = car.width * VIEW_SCALE;
    let h = car.length * VIEW_SCALE;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);

    // Shadow
    ctx.fillStyle = COLORS.shadow;
    ctx.beginPath();
    roundRect(ctx, -w/2 + 3, -h/2 + 3, w, h, 4);
    ctx.fill();

    // Body
    ctx.fillStyle = car.color;
    ctx.beginPath();
    roundRect(ctx, -w/2, -h/2, w, h, 4);
    ctx.fill();

    // Body highlight
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(-w/2 + 2, -h/2 + 2, w - 4, h * 0.35);

    // Windshield (front)
    ctx.fillStyle = COLORS.windshield;
    ctx.beginPath();
    roundRect(ctx, -w/2 + 3, -h/2 + h * 0.35, w - 6, h * 0.2, 2);
    ctx.fill();

    // Rear window
    ctx.fillStyle = COLORS.rearWindow;
    ctx.beginPath();
    roundRect(ctx, -w/2 + 4, h/2 - h * 0.22, w - 8, h * 0.1, 2);
    ctx.fill();

    // Headlights
    ctx.fillStyle = COLORS.headlight;
    ctx.fillRect(-w/2 + 2, -h/2, 5, 3);
    ctx.fillRect(w/2 - 7, -h/2, 5, 3);

    // Taillights
    ctx.fillStyle = COLORS.taillight;
    ctx.fillRect(-w/2 + 2, h/2 - 3, 5, 3);
    ctx.fillRect(w/2 - 7, h/2 - 3, 5, 3);

    ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
}

function drawParticles() {
    for (let j = 0; j < activeParticleSet.length; j++) {
        let p = particlePool[activeParticleSet[j]];
        if (!p.active) continue;

        let dx = p.x - camera.x;
        let dy = p.y - camera.y;
        let px = W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let py = H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE;

        if (px < -20 || px > W + 20 || py < -20 || py > H + 20) continue;

        ctx.globalAlpha = p.life;
        if (p.type === 'spark') {
            ctx.fillStyle = p.color;
            ctx.fillRect(px - p.size/2, py - p.size/2, p.size, p.size);
        } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(px, py, p.size * VIEW_SCALE, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
}

// ==================== UI (CHINESE) ====================
function drawHUD() {
    ctx.save();

    // --- Circular speed gauge ---
    let maxDisplay = 220;
    let speedVal = Math.abs(Math.round(player.speed / player.maxSpeed * maxDisplay));
    let speedPct = clamp(speedVal / maxDisplay, 0, 1);
    let gaugeR = 38;
    let gaugeCX = 16 + gaugeR + 4;
    let gaugeCY = 16 + gaugeR + 4;
    let arcStart = Math.PI * 0.75;
    let arcEnd = Math.PI * 2.25;
    let arcRange = arcEnd - arcStart;

    // Track ring background
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.arc(gaugeCX, gaugeCY, gaugeR, arcStart, arcEnd);
    ctx.stroke();

    // Filled arc
    let fillEnd = arcStart + arcRange * speedPct;
    
    // Gradient color from green to red based on speed percentage
    let arcColor;
    if (speedPct < 0.5) {
        // Green to yellow gradient
        let t = speedPct * 2;
        arcColor = `rgb(${Math.floor(255 * (1 - t))}, ${255}, 0)`;
    } else {
        // Yellow to red gradient
        let t = (speedPct - 0.5) * 2;
        arcColor = `rgb(255, ${Math.floor(255 * (1 - t))}, 0)`;
    }
    ctx.strokeStyle = arcColor;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(gaugeCX, gaugeCY, gaugeR, arcStart, fillEnd);
    ctx.stroke();
    ctx.lineCap = 'butt';

    // Speed text centered
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(speedVal, gaugeCX, gaugeCY - 3);
    ctx.font = '9px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('km/h', gaugeCX, gaugeCY + 13);
    ctx.textBaseline = 'alphabetic';

    // --- Home button at bottom right ---
    let btnR = 22;
    let btnX = W - 40;
    let btnY = H - 40;
    homeButtonRect = { x: btnX - btnR, y: btnY - btnR, w: btnR * 2, h: btnR * 2 };
    
    // Check hover state
    let mx = lastMouseX || 0;
    let my = lastMouseY || 0;
    let isHomeHover = (mx >= homeButtonRect.x && mx <= homeButtonRect.x + homeButtonRect.w &&
                       my >= homeButtonRect.y && my <= homeButtonRect.y + homeButtonRect.h);
    
    // Button background on hover
    if (isHomeHover) {
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(btnX, btnY, btnR, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.strokeStyle = isHomeHover ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.6)';
    ctx.lineWidth = isHomeHover ? 2.5 : 2;
    ctx.beginPath();
    ctx.arc(btnX, btnY, btnR, 0, Math.PI * 2);
    ctx.stroke();
    
    // Home icon (house shape) - filled white
    ctx.fillStyle = isHomeHover ? '#ffffff' : 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.moveTo(btnX, btnY - 9);
    ctx.lineTo(btnX - 10, btnY - 1);
    ctx.lineTo(btnX - 7, btnY - 1);
    ctx.lineTo(btnX - 7, btnY + 8);
    ctx.lineTo(btnX + 7, btnY + 8);
    ctx.lineTo(btnX + 7, btnY - 1);
    ctx.lineTo(btnX + 10, btnY - 1);
    ctx.closePath();
    ctx.fill();

    // --- Map Seed at bottom left ---
    let seedText = '种子: ' + getMapSeed();
    ctx.font = '11px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.textAlign = 'left';
    ctx.fillText(seedText, 16, H - 16);

    drawTouchControls();
    ctx.restore();
}

function drawTouchControls() {
    if (!('ontouchstart' in window)) return;
    setupTouchAreas();
    for (let a of touchAreas) {
        let isPressed = touchPressed[a.id];
        
        // Button background - brighter when pressed
        if (isPressed) {
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
        } else {
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
        }
        
        ctx.beginPath();
        roundRect(ctx, a.x, a.y, a.w, a.h, 10);
        ctx.fill();
        
        // Inner border (inset stroke effect)
        let borderWidth = isPressed ? 3 : 2;
        let borderColor = isPressed ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.6)';
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = borderWidth;
        
        ctx.beginPath();
        roundRect(ctx, a.x + borderWidth, a.y + borderWidth, a.w - borderWidth * 2, a.h - borderWidth * 2, 8);
        ctx.stroke();
        
        // Inner glow effect when pressed
        if (isPressed) {
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            roundRect(ctx, a.x + 6, a.y + 6, a.w - 12, a.h - 12, 6);
            ctx.fill();
        }

        // Button label
        ctx.fillStyle = isPressed ? '#fff' : 'rgba(255,255,255,0.9)';
        ctx.font = isPressed ? 'bold 22px sans-serif' : '20px sans-serif';
        ctx.textAlign = 'center';
        let labels = { up: '▲', down: '▼', left: '◀', right: '▶' };
        let labelY = a.y + a.h / 2 + 7;
        ctx.fillText(labels[a.id], a.x + a.w / 2, labelY);
    }
}

function formatTime(t) {
    let mins = Math.floor(t / 60);
    let secs = Math.floor(t % 60);
    let ms = Math.floor((t % 1) * 100);
    return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0') + '.' + String(ms).padStart(2, '0');
}

// ==================== MINIMAP ====================
// Pre-render static track onto offscreen canvas (drawn once per track generation)
let minimapStaticCanvas = null;
let minimapStaticCtx = null;
const MINIMAP_SIZE = 140;

function prerenderMinimapTrack() {
    let dpr = window.devicePixelRatio || 1;
    minimapStaticCanvas = document.createElement('canvas');
    minimapStaticCanvas.width = MINIMAP_SIZE * dpr;
    minimapStaticCanvas.height = MINIMAP_SIZE * dpr;
    minimapStaticCtx = minimapStaticCanvas.getContext('2d');
    minimapStaticCtx.scale(dpr, dpr);

    let mctx = minimapStaticCtx;
    let mb = minimapBounds;
    let scale = mb.scale;
    let cx = mb.cx, cy = mb.cy;
    let halfMap = MINIMAP_SIZE / 2;

    // Clear
    mctx.clearRect(0, 0, MINIMAP_SIZE, MINIMAP_SIZE);

    // Draw main track - thicker lines for clarity
    mctx.strokeStyle = 'rgba(255,255,255,0.45)';
    mctx.lineWidth = 3;
    mctx.beginPath();
    for (let i = 0; i < trackPath.length; i += 2) {
        let px = halfMap + (trackPath[i].x - cx) * scale;
        let py = halfMap + (trackPath[i].y - cy) * scale;
        if (i === 0) mctx.moveTo(px, py);
        else mctx.lineTo(px, py);
    }
    mctx.stroke();

    // Draw branches - thicker
    mctx.strokeStyle = 'rgba(255,180,80,0.55)';
    mctx.lineWidth = 2.5;
    for (let bp of branchPaths) {
        mctx.beginPath();
        for (let i = 0; i < bp.path.length; i += 2) {
            let px = halfMap + (bp.path[i].x - cx) * scale;
            let py = halfMap + (bp.path[i].y - cy) * scale;
            if (i === 0) mctx.moveTo(px, py);
            else mctx.lineTo(px, py);
        }
        mctx.stroke();
    }

    // Start marker (green)
    let spx = halfMap + (trackPath[0].x - cx) * scale;
    let spy = halfMap + (trackPath[0].y - cy) * scale;
    mctx.fillStyle = '#2ecc71';
    mctx.beginPath();
    mctx.arc(spx, spy, 5, 0, Math.PI * 2);
    mctx.fill();

    // Finish marker (checkered)
    let fpx = halfMap + (trackPath[trackPath.length - 1].x - cx) * scale;
    let fpy = halfMap + (trackPath[trackPath.length - 1].y - cy) * scale;
    mctx.fillStyle = '#ffffff';
    mctx.beginPath();
    mctx.arc(fpx, fpy, 5, 0, Math.PI * 2);
    mctx.fill();
    mctx.fillStyle = '#111';
    mctx.beginPath();
    mctx.arc(fpx, fpy, 2.5, 0, Math.PI * 2);
    mctx.fill();
}

function drawMinimap() {
    let mapSize = MINIMAP_SIZE;
    let mapX = W - mapSize - 16;
    let mapY = 16;

    // Background (transparent)
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    roundRect(ctx, mapX, mapY, mapSize, mapSize, 14);
    ctx.stroke();

    // Blit pre-rendered static track (hi-res)
    if (minimapStaticCanvas) {
        ctx.drawImage(minimapStaticCanvas, 0, 0, minimapStaticCanvas.width, minimapStaticCanvas.height, mapX, mapY, mapSize, mapSize);
    }

    let mb = minimapBounds;
    let scale = mb.scale;
    let cx = mb.cx, cy = mb.cy;
    let halfMap = mapSize / 2;

    // Player dot only
    if (player) {
        let mpx = mapX + halfMap + (player.x - cx) * scale;
        let mpy = mapY + halfMap + (player.y - cy) * scale;
        ctx.fillStyle = COLORS.minimapPlayer;
        ctx.beginPath();
        ctx.arc(mpx, mpy, 4, 0, Math.PI * 2);
        ctx.fill();

        // Direction indicator
        ctx.strokeStyle = COLORS.minimapPlayer;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(mpx, mpy);
        ctx.lineTo(mpx + Math.cos(player.direction) * 8, mpy + Math.sin(player.direction) * 8);
        ctx.stroke();
    }
}

// ==================== MAIN UPDATE ====================
function update(dt) {
    if (gameState === 'countdown') {
        countdownTimer += dt;
        // Play beep on each new number
        if (countdownNumber >= 1 && countdownNumber !== lastCountdownBeep) {
            lastCountdownBeep = countdownNumber;
            playCountdownBeep(false);
        }
        if (countdownNumber === 0 && lastCountdownBeep !== 0) {
            lastCountdownBeep = 0;
            playCountdownBeep(true); // GO sound
        }
        if (countdownTimer >= 1) {
            countdownTimer -= 1;
            countdownNumber--;
            if (countdownNumber < -1) {
                gameState = 'racing';
            }
        }
        updateCamera();
        
        // Update visibility manager for scenery during countdown
        visibilityManager.update(camera, performance.now());
        
        return;
    }

    if (gameState !== 'racing') return;

    raceTime += dt;

    // Dynamic NPC spawning/despawning - MUST be before NPC updates
    // so newly spawned NPCs are included in collision detection
    updateNPCSpawning();

    // Update player
    if (player) {
        updatePlayer(player, dt);
    }

    // Single pass through cars for all NPC updates and collision checks
    let playerX = player ? player.x : 0;
    let playerY = player ? player.y : 0;
    let activeDist = NPC_ACTIVE_DISTANCE;
    let activeDistSq = activeDist * activeDist;

    for (let car of cars) {
        if (car.isPlayer) {
            // Player collision checks

            checkSceneryCollision(car);
            continue;
        }

        // NPC: compute distance to player once
        let dx = car.x - playerX;
        let dy = car.y - playerY;
        let distSq = dx * dx + dy * dy;
        let isPlayerNearby = distSq < activeDistSq;

        // Update NPC
        updateNPC(car, dt, isPlayerNearby);



        // Track boundary for all NPCs
        enforceTrackBoundary(car);

        // Update NPC engine sounds
        if (NPC_AUDIO_ENABLED && car.active !== false) {
            updateNPCEngineSound(car, player);
        }
    }

    // NPC-to-NPC elastic push - helps create overtaking space
    // Only between NPCs (not player), using car dimensions as detection range
    for (let i = 0; i < cars.length; i++) {
        let a = cars[i];
        if (a.isPlayer) continue;
        
        for (let j = i + 1; j < cars.length; j++) {
            let b = cars[j];
            if (b.isPlayer) continue;
            
            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let distSq = dx * dx + dy * dy;
            
            // Detection range: car length + width (approximate car size)
            let detectionRange = (CAR_LENGTH + CAR_WIDTH) * 0.6;
            let detectionRangeSq = detectionRange * detectionRange;
            
            if (distSq < detectionRangeSq && distSq > 0.01) {
                let d = Math.sqrt(distSq);
                let nx = dx / d;
                let ny = dy / d;
                
                // Simple elastic push - push both cars apart linearly
                let pushDistance = (detectionRange - d) * 0.5;
                pushDistance = Math.min(pushDistance, 3); // Max push per frame
                
                a.x -= nx * pushDistance;
                a.y -= ny * pushDistance;
                b.x += nx * pushDistance;
                b.y += ny * pushDistance;
            }
        }
    }

    // Car-to-car collisions
    if (cars.length > 1 && player) {
        for (let i = 0; i < cars.length; i++) {
            let a = cars[i];
            let aIsNear = a.isPlayer || ((a.x - playerX) ** 2 + (a.y - playerY) ** 2 < activeDistSq);
            if (!aIsNear) continue;
            
            for (let j = i + 1; j < cars.length; j++) {
                let b = cars[j];
                let bIsNear = b.isPlayer || ((b.x - playerX) ** 2 + (b.y - playerY) ** 2 < activeDistSq);
                if (!bIsNear) continue;
                
                // Use simple circle collision for NPC-to-NPC, capsule collision for player involved
                let useCapsule = a.isPlayer || b.isPlayer;
                
                let nx, ny, overlap;
                
                if (useCapsule) {
                    // Capsule collision for player involved
                    let collision = checkCarToCarCollision(a, b);
                    if (!collision || collision.overlap <= 0) continue;
                    nx = collision.nx;
                    ny = collision.ny;
                    overlap = collision.overlap;
                } else {
                    // Simple circle collision for NPC-to-NPC
                    let dx = b.x - a.x;
                    let dy = b.y - a.y;
                    let d = Math.sqrt(dx * dx + dy * dy);
                    let minDist = (CAR_WIDTH + CAR_LENGTH) / 2 * 0.7;
                    if (d >= minDist || d <= 0.01) continue;
                    nx = dx / d;
                    ny = dy / d;
                    overlap = minDist - d;
                }

                // Calculate collision direction relative to car A
                let aCos = Math.cos(a.direction);
                let aSin = Math.sin(a.direction);
                // Forward component: positive = front collision, negative = rear collision
                let forwardDot = nx * aCos + ny * aSin;
                // Side component: absolute value indicates side collision
                let sideDot = Math.abs(-nx * aSin + ny * aCos);

                // Determine if this is a side collision (side component > forward component)
                let isSideCollision = sideDot > Math.abs(forwardDot);

                // Strong separation - always push apart enough to prevent sticking
                let posPushStrength = Math.max(overlap * 0.6, 2);
                if (isSideCollision) {
                    posPushStrength *= 0.25; // Reduce side position push to 1/4
                }
                
                a.x -= nx * posPushStrength;
                a.y -= ny * posPushStrength;
                b.x += nx * posPushStrength;
                b.y += ny * posPushStrength;

                let avx = Math.cos(a.direction) * a.speed;
                let avy = Math.sin(a.direction) * a.speed;
                let bvx = Math.cos(b.direction) * b.speed;
                let bvy = Math.sin(b.direction) * b.speed;

                let aDotN = avx * nx + avy * ny;
                let bDotN = bvx * nx + bvy * ny;

                // Always resolve - even if not approaching, push apart to unstick
                let relVel = aDotN - bDotN;
                if (relVel > -0.5) { // resolve if approaching OR nearly stationary
                    let restitution = 0.6; // bouncier
                    let impulse = (1 + restitution) * Math.max(relVel, 0.5) / 2;
                    impulse = clamp(impulse, 1.0, 4.0); // minimum bounce impulse
                    
                    // Reduce velocity impulse for side collisions
                    if (isSideCollision) {
                        impulse *= 0.25;
                    }

                    avx -= impulse * nx;
                    avy -= impulse * ny;
                    bvx += impulse * nx;
                    bvy += impulse * ny;

                    let newDirA = Math.atan2(avy, avx);
                    let newDirB = Math.atan2(bvy, bvx);
                    let newSpeedA = Math.sqrt(avx * avx + avy * avy);
                    let newSpeedB = Math.sqrt(bvx * bvx + bvy * bvy);

                    // Blend direction more aggressively for visible bounce
                    let blendFactor = 0.7;
                    a.direction = a.direction + angleDiff(a.direction, newDirA) * blendFactor;
                    b.direction = b.direction + angleDiff(b.direction, newDirB) * blendFactor;
                    a.direction = normalizeAngle(a.direction);
                    b.direction = normalizeAngle(b.direction);

                    // Ensure minimum speed after collision so cars don't stop
                    let minBounceSpeed = 2.0;
                    a.speed = lerp(Math.abs(a.speed), newSpeedA, 0.6) * (a.speed >= 0 ? 1 : -1);
                    b.speed = lerp(Math.abs(b.speed), newSpeedB, 0.6) * (b.speed >= 0 ? 1 : -1);
                    a.speed *= 0.92;
                    b.speed *= 0.92;
                    if (Math.abs(a.speed) < minBounceSpeed) a.speed = minBounceSpeed * (a.speed >= 0 ? 1 : -1);
                    if (Math.abs(b.speed) < minBounceSpeed) b.speed = minBounceSpeed * (b.speed >= 0 ? 1 : -1);
                    a.collisionPenalty = 0.25;
                    b.collisionPenalty = 0.25;

                    a.speed = clamp(a.speed, -a.maxSpeed, a.maxSpeed);
                    b.speed = clamp(b.speed, -b.maxSpeed, b.maxSpeed);

                    if (a.collisionCooldown <= 0 && b.collisionCooldown <= 0) {
                        let collisionDist = Math.sqrt((a.x - playerX) ** 2 + (a.y - playerY) ** 2);
                        if (collisionDist < 500) {
                            playCollisionSound();
                        }
                        a.collisionCooldown = 0.1;
                        b.collisionCooldown = 0.1;
                    }

                    let cx = (a.x + b.x) / 2;
                    let cy = (a.y + b.y) / 2;
                    let maxSparks = Math.min(4, MAX_SPARKS - particleCounts.spark);
                    for (let s = 0; s < maxSparks; s++) {
                        spawnSpark(cx, cy);
                    }
                }
            }
        }
    }

    // Finish line
    checkFinishLine();
    updateFinishState();
    checkRaceEnd();

    // Particles
    updateParticles();

    // Camera
    updateCamera();

    // Update visibility manager for scenery
    visibilityManager.update(camera, performance.now());
}

// ==================== RENDER ====================
function render() {
    ctx.clearRect(0, 0, W, H);

    if (gameState === 'menu') {
        drawMenu();
        return;
    }
    
    if (gameState === 'loading') {
        drawLoading();
        return;
    }

    // Game rendering - Canvas map system
    drawGrass();
    // Draw all road edges first (under the road surface) for proper layering
    drawAllRoadEdges();
    // Then draw road surfaces (they will cover the inner parts of the edges)
    drawBranchSurfaces();
    drawTrackSurface();
    drawCenterLine();

    // Start/finish lines
    drawStartFinishLine(0);
    drawStartFinishLine(trackPath.length - 1);

    // Draw scenery (trees, people) on top of roads
    drawScenery();

    // Draw particles behind cars
    drawParticles();

    // Sort cars by screen Y for depth - use in-place sort with pre-allocated array
    // Only sort if cars array changed (optimization)
    if (!window.sortedCars || window.sortedCars.length !== cars.length) {
        window.sortedCars = [...cars];
    }
    // Update references in case cars array changed
    for (let i = 0; i < cars.length; i++) {
        window.sortedCars[i] = cars[i];
    }
    window.sortedCars.sort((a, b) => {
        let dax = a.x - camera.x, day = a.y - camera.y;
        let dbx = b.x - camera.x, dby = b.y - camera.y;
        let say = H * 0.6 + (dax * cameraTransform.sin + day * cameraTransform.cos) * VIEW_SCALE;
        let sby = H * 0.6 + (dbx * cameraTransform.sin + dby * cameraTransform.cos) * VIEW_SCALE;
        return say - sby;
    });
    for (let car of window.sortedCars) {
        // Only draw NPC cars if showNPCs is true, always draw player
        if (car.isPlayer || showNPCs) {
            drawCar(car);
        }
    }

    // HUD
    drawHUD();
    drawMinimap();

    if (gameState === 'countdown') {
        drawCountdown();
    }

    if (gameState === 'results' || finishResultsShown) {
        drawResults();
    }



    if (showExitConfirm) {
        drawExitConfirm();
    }
}

function drawExitConfirm() {
    // Dark overlay
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    // Dialog box
    let boxW = 280;
    let boxH = 140;
    let boxX = W / 2 - boxW / 2;
    let boxY = H / 2 - boxH / 2;

    ctx.fillStyle = COLORS.menuBg;
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    roundRect(ctx, boxX, boxY, boxW, boxH, 12);
    ctx.fill();
    ctx.stroke();

    // Title
    ctx.fillStyle = COLORS.textPrimary;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('结束当前比赛?', W / 2, boxY + 35);

    // Buttons
    let btnW = 100, btnH = 40;
    let btnY = boxY + boxH - 55;
    let btn1X = W / 2 - btnW - 15;
    let btn2X = W / 2 + 15;

    // Check hover state for buttons (using menuSelection for simplicity)
    let isCancelHover = menuSelection === 0;
    let isConfirmHover = menuSelection === 1;

    // Cancel button
    ctx.fillStyle = isCancelHover ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.1)';
    ctx.strokeStyle = isCancelHover ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = isCancelHover ? 2 : 1;
    ctx.beginPath();
    roundRect(ctx, btn1X, btnY, btnW, btnH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = COLORS.textPrimary;
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('取消', btn1X + btnW / 2, btnY + btnH / 2);

    // Confirm button
    ctx.fillStyle = isConfirmHover ? 'rgba(255,51,102,0.2)' : 'rgba(255,51,102,0.1)';
    ctx.strokeStyle = isConfirmHover ? COLORS.accent : 'rgba(255,51,102,0.6)';
    ctx.lineWidth = isConfirmHover ? 2 : 1;
    ctx.beginPath();
    roundRect(ctx, btn2X, btnY, btnW, btnH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = isConfirmHover ? COLORS.accent : COLORS.textPrimary;
    ctx.fillText('结束', btn2X + btnW / 2, btnY + btnH / 2);
    
    ctx.textBaseline = 'alphabetic';
}

// ==================== GAME LOOP ====================
let lastTime = 0;
let accumulator = 0;
const FIXED_DT = 1 / 60;

function gameLoop(timestamp) {
    if (lastTime === 0) lastTime = timestamp;
    let elapsed = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    // Cap delta to prevent spiral of death
    if (elapsed > 0.1) elapsed = 0.1;

    let updateStart = performance.now();
    if (!gamePaused) {
        accumulator += elapsed;
        while (accumulator >= FIXED_DT) {
            update(FIXED_DT);
            accumulator -= FIXED_DT;
        }
    }
    let updateTime = performance.now() - updateStart;

    let renderStart = performance.now();
    render();
    let renderTime = performance.now() - renderStart;

    requestAnimationFrame(gameLoop);
}

// ==================== INIT ====================
function init() {
    resize();
    initMenuParticles();
    requestAnimationFrame(gameLoop);
}

init();

</script>
