<script>
// roundRect 兼容性补丁
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        if (!Array.isArray(r)) r = [r, r, r, r];
        const [tl, tr, br, bl] = r;
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + tr);
        this.lineTo(x + w, y + h - br);
        this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
        this.lineTo(x + bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - bl);
        this.lineTo(x, y + tl);
        this.quadraticCurveTo(x, y, x + tl, y);
        this.closePath();
    };
}
// ==================== 常量 ====================

const BRANCH_WIDTH = 70;

// ==================== 颜色（高对比度调色板） ====================

// ==================== 画布设置 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: true, desynchronized: false });

// 画质设置 - '1'键切换DPR，'2'键切换平滑
let dprEnabled = true;
let smoothingEnabled = true;

function applySmoothing() {

}

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

// ==================== 游戏状态 ====================
let gameState = 'menu'; // 菜单、加载中、倒计时、比赛中、结果
let loadingProgress = 0;
let loadingStartTime = 0;

let trackNodes = [];
let trackPath = [];
let trackLeftEdge = [];
let trackRightEdge = [];
let branchPaths = []; // {path, leftEdge, rightEdge}
let totalDistance = 0;

let cars = [];
let player = null;
let menuParticles = [];

let countdownNumber = 3;

let menuButtonRects = [];
let resultButtonRects = [];

// 相机
let camera = { x: 0, y: 0, angle: 0, targetAngle: 0, rotationOffset: 0, swayOffset: 0, elasticSway: 0, viewBounds: { minX: 0, maxX: 0, minY: 0, maxY: 0 } };

// 预计算的相机变换缓存
let cameraTransform = { cos: 1, sin: 1, VIEW_SCALE: VIEW_SCALE };

// 相机弹性摇摆参数
const CAMERA_ELASTICITY = 0.25;  // 弹性系数（加大）
const CAMERA_DAMPING = 0.88;     // 阻尼系数（更持久）
const CAMERA_SWAY_SENSITIVITY = 0.015;  // 离心力灵敏度（加大）

const VIEW_MARGIN = 200;

// 可见赛道范围 - 每帧更新以避免绘制整个赛道
let visibleTrackRange = { start: 0, end: 0 };
const VISIBLE_RANGE_PADDING = 120; // 屏幕边缘外的额外点数
let additionalVisibleSegments = []; // 由于赛道折叠而可见的段落

// 输入

function limitSeedInput(input) {
    // 仅限字母数字字符
    input.value = input.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    // 强制最大长度
    if (input.value.length > 12) {
        input.value = input.value.substring(0, 12);
    }
}

// 音频
let audioCtx = null;
let audioInitialized = false;
let engineOsc = null;
let engineGain = null;
let windNode = null;
let windGain = null;
let brakeNoiseNode = null;
let brakeGain = null;

let lastWallSoundTime = 0;

function suspendAudio() {
    if (!audioCtx || audioSuspended) return;
    audioSuspended = true;
    if (audioCtx.state === 'running') {
        audioCtx.suspend();
    }
}

function resumeAudio() {
    if (!audioCtx || !audioSuspended) return;
    audioSuspended = false;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
        suspendAudio();
    } else {
        if (!gamePaused) {
            resumeAudio();
        }
    }
});

// 树木和人物的对象池系统
class ObjectPool {
    constructor(createFn, initialSize = 50) {
        this.createFn = createFn;
        this.pool = [];
        this.activeObjects = [];
        
        for (let i = 0; i < initialSize; i++) {
            this.pool.push(this.createFn());
        }
    }
    
    get() {
        if (this.pool.length > 0) {
            const obj = this.pool.pop();
            this.activeObjects.push(obj);
            return obj;
        }
        const obj = this.createFn();
        this.activeObjects.push(obj);
        return obj;
    }
    
    release(obj) {
        const index = this.activeObjects.indexOf(obj);
        if (index > -1) {
            this.activeObjects.splice(index, 1);
            this.pool.push(obj);
        }
    }
    
    releaseAll() {
        while (this.activeObjects.length > 0) {
            this.pool.push(this.activeObjects.pop());
        }
    }
    
    getActiveCount() {
        return this.activeObjects.length;
    }
    
    getPoolSize() {
        return this.pool.length;
    }
}

// 树木对象池
const treePool = new ObjectPool(() => ({
    type: 'tree',
    x: 0,
    y: 0,
    size: 0,
    shade: 0,
    cachedColor: '',
    visible: false,
    lastVisibleTime: 0
}), 100);

// 人群对象池
const peoplePool = new ObjectPool(() => ({
    type: 'people',
    x: 0,
    y: 0,
    people: [],
    visible: false,
    lastVisibleTime: 0
}), 50);

// 可见性管理系统
class VisibilityManager {
    constructor() {
        this.visibleRange = 1200;
        this.updateInterval = 100;
        this.lastUpdateTime = 0;
        this.visibleItems = [];
    }
    
    update(camera, currentTime) {
        if (currentTime - this.lastUpdateTime < this.updateInterval) {
            return;
        }
        
        this.lastUpdateTime = currentTime;
        this.visibleItems = [];
        
        const camX = camera.x;
        const camY = camera.y;
        const rangeSq = this.visibleRange * this.visibleRange;
        
        for (const item of sceneryItems) {
            const dx = item.x - camX;
            const dy = item.y - camY;
            const distSq = dx * dx + dy * dy;
            
            if (distSq < rangeSq) {
                item.visible = true;
                item.lastVisibleTime = currentTime;
                this.visibleItems.push(item);
            } else {
                item.visible = false;
            }
        }
    }
    
    getVisibleItems() {
        return this.visibleItems;
    }
    
    isVisible(item) {
        return item.visible;
    }
}

const visibilityManager = new VisibilityManager();

// 使用对象池的优化场景渲染
function drawSceneryOptimized() {
    const visibleItems = visibilityManager.getVisibleItems();
    
    for (const item of visibleItems) {
        let dx = item.x - camera.x;
        let dy = item.y - camera.y;
        let sx = W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let sy = H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE;
        
        if (sx < -200 || sx > W + 200 || sy < -200 || sy > H + 200) continue;
        
        if (item.type === 'tree') {
            let sz = item.size * VIEW_SCALE * 1.3;
            ctx.fillStyle = '#5D4037';
            ctx.fillRect(sx - sz*0.15, sy - sz*0.1, sz*0.3, sz*0.6);
            ctx.fillStyle = item.cachedColor || 'rgba(46,100,56,0.9)';
            ctx.beginPath(); ctx.arc(sx, sy - sz*0.3, sz*0.6, 0, Math.PI*2); ctx.fill();
        } else if (item.type === 'people') {
            for (const p of item.people) {
                let px = sx + p.dx * VIEW_SCALE * 1.3, py = sy + p.dy * VIEW_SCALE * 1.3;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(px, py, 4*VIEW_SCALE, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fdbcb4';
                ctx.beginPath(); ctx.arc(px, py - 5*VIEW_SCALE, 2.5*VIEW_SCALE, 0, Math.PI*2); ctx.fill();
            }
        }
    }
}

// ==================== 画布地图渲染 ====================
function drawGrass() {
    ctx.fillStyle = COLORS.grass;
    ctx.fillRect(0, 0, W, H);
}

function drawTrackSurface() {
    ctx.fillStyle = COLORS.trackSurface;
    
    // 使用平滑曲线绘制主可见范围
    let vStart = visibleTrackRange.start;
    let vEnd = Math.min(visibleTrackRange.end, trackLeftEdge.length - 1);
    if (vEnd > vStart) {
        ctx.beginPath();
        
        // 使用二次曲线向前绘制左边缘
        let firstWp = trackLeftEdge[vStart];
        let firstDx = firstWp.x - camera.x;
        let firstDy = firstWp.y - camera.y;
        let firstPx = W / 2 + (firstDx * cameraTransform.cos - firstDy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let firstPy = H * 0.6 + (firstDx * cameraTransform.sin + firstDy * cameraTransform.cos) * VIEW_SCALE;
        ctx.moveTo(firstPx, firstPy);
        
        for (let i = vStart; i < vEnd; i++) {
            let wp1 = trackLeftEdge[i];
            let wp2 = trackLeftEdge[i + 1];
            
            let dx1 = wp1.x - camera.x, dy1 = wp1.y - camera.y;
            let px1 = W / 2 + (dx1 * cameraTransform.cos - dy1 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py1 = H * 0.6 + (dx1 * cameraTransform.sin + dy1 * cameraTransform.cos) * VIEW_SCALE;
            
            let dx2 = wp2.x - camera.x, dy2 = wp2.y - camera.y;
            let px2 = W / 2 + (dx2 * cameraTransform.cos - dy2 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py2 = H * 0.6 + (dx2 * cameraTransform.sin + dy2 * cameraTransform.cos) * VIEW_SCALE;
            
            let cx = (px1 + px2) / 2;
            let cy = (py1 + py2) / 2;
            ctx.quadraticCurveTo(px1, py1, cx, cy);
        }
        
        // 左边缘的最后一个点
        let lastLeft = trackLeftEdge[vEnd];
        let lastLeftDx = lastLeft.x - camera.x;
        let lastLeftDy = lastLeft.y - camera.y;
        let lastLeftPx = W / 2 + (lastLeftDx * cameraTransform.cos - lastLeftDy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let lastLeftPy = H * 0.6 + (lastLeftDx * cameraTransform.sin + lastLeftDy * cameraTransform.cos) * VIEW_SCALE;
        ctx.lineTo(lastLeftPx, lastLeftPy);
        
        // 连接到右边缘终点
        let lastRight = trackRightEdge[vEnd];
        let lastRightDx = lastRight.x - camera.x;
        let lastRightDy = lastRight.y - camera.y;
        let lastRightPx = W / 2 + (lastRightDx * cameraTransform.cos - lastRightDy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let lastRightPy = H * 0.6 + (lastRightDx * cameraTransform.sin + lastRightDy * cameraTransform.cos) * VIEW_SCALE;
        ctx.lineTo(lastRightPx, lastRightPy);
        
        // 使用二次曲线向后绘制右边缘
        for (let i = vEnd; i > vStart; i--) {
            let wp1 = trackRightEdge[i];
            let wp2 = trackRightEdge[i - 1];
            
            let dx1 = wp1.x - camera.x, dy1 = wp1.y - camera.y;
            let px1 = W / 2 + (dx1 * cameraTransform.cos - dy1 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py1 = H * 0.6 + (dx1 * cameraTransform.sin + dy1 * cameraTransform.cos) * VIEW_SCALE;
            
            let dx2 = wp2.x - camera.x, dy2 = wp2.y - camera.y;
            let px2 = W / 2 + (dx2 * cameraTransform.cos - dy2 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py2 = H * 0.6 + (dx2 * cameraTransform.sin + dy2 * cameraTransform.cos) * VIEW_SCALE;
            
            let cx = (px1 + px2) / 2;
            let cy = (py1 + py2) / 2;
            ctx.quadraticCurveTo(px1, py1, cx, cy);
        }
        
        // 连接回左边缘的起点
        let firstRight = trackRightEdge[vStart];
        let firstRightDx = firstRight.x - camera.x;
        let firstRightDy = firstRight.y - camera.y;
        let firstRightPx = W / 2 + (firstRightDx * cameraTransform.cos - firstRightDy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let firstRightPy = H * 0.6 + (firstRightDx * cameraTransform.sin + firstRightDy * cameraTransform.cos) * VIEW_SCALE;
        ctx.lineTo(firstRightPx, firstRightPy);
        
        ctx.closePath();
        ctx.fill();
    }
    
    // 绘制额外的可见段落（赛道折叠回来的部分）
    for (let seg of additionalVisibleSegments) {
        let segStart = Math.max(0, seg.start);
        let segEnd = Math.min(trackLeftEdge.length - 1, seg.end);
        if (segEnd <= segStart) continue;
        
        ctx.beginPath();
        
        // 使用二次曲线向前绘制左边缘
        let segFirstWp = trackLeftEdge[segStart];
        let segFirstDx = segFirstWp.x - camera.x;
        let segFirstDy = segFirstWp.y - camera.y;
        let segFirstPx = W / 2 + (segFirstDx * cameraTransform.cos - segFirstDy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let segFirstPy = H * 0.6 + (segFirstDx * cameraTransform.sin + segFirstDy * cameraTransform.cos) * VIEW_SCALE;
        ctx.moveTo(segFirstPx, segFirstPy);
        
        for (let i = segStart; i < segEnd; i++) {
            let wp1 = trackLeftEdge[i];
            let wp2 = trackLeftEdge[i + 1];
            
            let dx1 = wp1.x - camera.x, dy1 = wp1.y - camera.y;
            let px1 = W / 2 + (dx1 * cameraTransform.cos - dy1 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py1 = H * 0.6 + (dx1 * cameraTransform.sin + dy1 * cameraTransform.cos) * VIEW_SCALE;
            
            let dx2 = wp2.x - camera.x, dy2 = wp2.y - camera.y;
            let px2 = W / 2 + (dx2 * cameraTransform.cos - dy2 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py2 = H * 0.6 + (dx2 * cameraTransform.sin + dy2 * cameraTransform.cos) * VIEW_SCALE;
            
            let cx = (px1 + px2) / 2;
            let cy = (py1 + py2) / 2;
            ctx.quadraticCurveTo(px1, py1, cx, cy);
        }
        
        // 段落的最后一个点
        let segLastLeft = trackLeftEdge[segEnd];
        let segLastLeftDx = segLastLeft.x - camera.x;
        let segLastLeftDy = segLastLeft.y - camera.y;
        let segLastLeftPx = W / 2 + (segLastLeftDx * cameraTransform.cos - segLastLeftDy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let segLastLeftPy = H * 0.6 + (segLastLeftDx * cameraTransform.sin + segLastLeftDy * cameraTransform.cos) * VIEW_SCALE;
        ctx.lineTo(segLastLeftPx, segLastLeftPy);
        
        // 连接到段落的右边缘终点
        let segLastRight = trackRightEdge[segEnd];
        let segLastRightDx = segLastRight.x - camera.x;
        let segLastRightDy = segLastRight.y - camera.y;
        let segLastRightPx = W / 2 + (segLastRightDx * cameraTransform.cos - segLastRightDy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let segLastRightPy = H * 0.6 + (segLastRightDx * cameraTransform.sin + segLastRightDy * cameraTransform.cos) * VIEW_SCALE;
        ctx.lineTo(segLastRightPx, segLastRightPy);
        
        // 使用二次曲线向后绘制右边缘
        for (let i = segEnd; i > segStart; i--) {
            let wp1 = trackRightEdge[i];
            let wp2 = trackRightEdge[i - 1];
            
            let dx1 = wp1.x - camera.x, dy1 = wp1.y - camera.y;
            let px1 = W / 2 + (dx1 * cameraTransform.cos - dy1 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py1 = H * 0.6 + (dx1 * cameraTransform.sin + dy1 * cameraTransform.cos) * VIEW_SCALE;
            
            let dx2 = wp2.x - camera.x, dy2 = wp2.y - camera.y;
            let px2 = W / 2 + (dx2 * cameraTransform.cos - dy2 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py2 = H * 0.6 + (dx2 * cameraTransform.sin + dy2 * cameraTransform.cos) * VIEW_SCALE;
            
            let cx = (px1 + px2) / 2;
            let cy = (py1 + py2) / 2;
            ctx.quadraticCurveTo(px1, py1, cx, cy);
        }
        
        // 连接回段落的左边缘起点
        let segFirstRight = trackRightEdge[segStart];
        let segFirstRightDx = segFirstRight.x - camera.x;
        let segFirstRightDy = segFirstRight.y - camera.y;
        let segFirstRightPx = W / 2 + (segFirstRightDx * cameraTransform.cos - segFirstRightDy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let segFirstRightPy = H * 0.6 + (segFirstRightDx * cameraTransform.sin + segFirstRightDy * cameraTransform.cos) * VIEW_SCALE;
        ctx.lineTo(segFirstRightPx, segFirstRightPy);
        
        ctx.closePath();
        ctx.fill();
    }
}

// 使用二次曲线绘制平滑曲线路径的辅助函数
function drawSmoothPath(edgePoints, startIdx, endIdx, movingForward) {
    // 确保索引在边界内
    startIdx = Math.max(0, Math.min(startIdx, edgePoints.length - 1));
    endIdx = Math.max(0, Math.min(endIdx, edgePoints.length - 1));
    
    if (movingForward) {
        // 向前：startIdx -> endIdx
        if (endIdx <= startIdx) return;
        
        // 第一个点
        let wp = edgePoints[startIdx];
        let dx = wp.x - camera.x;
        let dy = wp.y - camera.y;
        let px = W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let py = H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE;
        ctx.moveTo(px, py);
        
        // 使用二次曲线通过中点绘制
        for (let i = startIdx; i < endIdx; i++) {
            let p1 = edgePoints[i];
            let p2 = edgePoints[i + 1];
            
            // 转换到屏幕空间
            let dx1 = p1.x - camera.x, dy1 = p1.y - camera.y;
            let px1 = W / 2 + (dx1 * cameraTransform.cos - dy1 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py1 = H * 0.6 + (dx1 * cameraTransform.sin + dy1 * cameraTransform.cos) * VIEW_SCALE;
            
            let dx2 = p2.x - camera.x, dy2 = p2.y - camera.y;
            let px2 = W / 2 + (dx2 * cameraTransform.cos - dy2 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py2 = H * 0.6 + (dx2 * cameraTransform.sin + dy2 * cameraTransform.cos) * VIEW_SCALE;
            
            // 使用中点作为控制点以获得平滑曲线
            let cx = (px1 + px2) / 2;
            let cy = (py1 + py2) / 2;
            
            ctx.quadraticCurveTo(cx, cy, px2, py2);
        }
    } else {
        // 向后：startIdx -> endIdx (startIdx > endIdx)
        if (startIdx <= endIdx) return;
        
        // 第一个点
        let wp = edgePoints[startIdx];
        let dx = wp.x - camera.x;
        let dy = wp.y - camera.y;
        let px = W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let py = H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE;
        ctx.moveTo(px, py);
        
        // 使用二次曲线通过中点绘制（向后）
        for (let i = startIdx; i > endIdx; i--) {
            let p1 = edgePoints[i];
            let p2 = edgePoints[i - 1];
            
            // 转换到屏幕空间
            let dx1 = p1.x - camera.x, dy1 = p1.y - camera.y;
            let px1 = W / 2 + (dx1 * cameraTransform.cos - dy1 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py1 = H * 0.6 + (dx1 * cameraTransform.sin + dy1 * cameraTransform.cos) * VIEW_SCALE;
            
            let dx2 = p2.x - camera.x, dy2 = p2.y - camera.y;
            let px2 = W / 2 + (dx2 * cameraTransform.cos - dy2 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py2 = H * 0.6 + (dx2 * cameraTransform.sin + dy2 * cameraTransform.cos) * VIEW_SCALE;
            
            // 使用中点作为控制点以获得平滑曲线
            let cx = (px1 + px2) / 2;
            let cy = (py1 + py2) / 2;
            
            ctx.quadraticCurveTo(cx, cy, px2, py2);
        }
    }
}

function drawBranchSurfaces() {
    ctx.fillStyle = COLORS.branchSurface;
    for (let bi = 0; bi < branchPaths.length; bi++) {
        let bp = branchPaths[bi];
        // 使用边界框跳过视野外的分支
        let bb = branchBounds[bi];
        if (bb && (bb.maxX < camera.viewBounds.minX || bb.minX > camera.viewBounds.maxX ||
                   bb.maxY < camera.viewBounds.minY || bb.minY > camera.viewBounds.maxY)) continue;

        // 由于分支现在延伸到主赛道，跳过较少的点
        let skipStart = Math.min(3, Math.floor(bp.path.length * 0.05));
        let skipEnd = Math.min(3, Math.floor(bp.path.length * 0.05));
        if (bp.leftEdge.length - skipStart - skipEnd < 2) continue;
        
        let leftStart = skipStart;
        let leftEnd = bp.leftEdge.length - 1 - skipEnd;
        let rightStart = skipStart;
        let rightEnd = bp.rightEdge.length - 1 - skipEnd;
        
        ctx.beginPath();
        
        // 使用二次曲线向前绘制左边缘
        let firstWp = bp.leftEdge[leftStart];
        let firstDx = firstWp.x - camera.x;
        let firstDy = firstWp.y - camera.y;
        let firstPx = W / 2 + (firstDx * cameraTransform.cos - firstDy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let firstPy = H * 0.6 + (firstDx * cameraTransform.sin + firstDy * cameraTransform.cos) * VIEW_SCALE;
        ctx.moveTo(firstPx, firstPy);
        
        for (let i = leftStart; i < leftEnd; i++) {
            let wp1 = bp.leftEdge[i];
            let wp2 = bp.leftEdge[i + 1];
            
            let dx1 = wp1.x - camera.x, dy1 = wp1.y - camera.y;
            let px1 = W / 2 + (dx1 * cameraTransform.cos - dy1 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py1 = H * 0.6 + (dx1 * cameraTransform.sin + dy1 * cameraTransform.cos) * VIEW_SCALE;
            
            let dx2 = wp2.x - camera.x, dy2 = wp2.y - camera.y;
            let px2 = W / 2 + (dx2 * cameraTransform.cos - dy2 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py2 = H * 0.6 + (dx2 * cameraTransform.sin + dy2 * cameraTransform.cos) * VIEW_SCALE;
            
            let cx = (px1 + px2) / 2;
            let cy = (py1 + py2) / 2;
            ctx.quadraticCurveTo(px1, py1, cx, cy);
        }
        
        // 左边缘的最后一个点
        let lastLeft = bp.leftEdge[leftEnd];
        let lastLeftDx = lastLeft.x - camera.x;
        let lastLeftDy = lastLeft.y - camera.y;
        let lastLeftPx = W / 2 + (lastLeftDx * cameraTransform.cos - lastLeftDy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let lastLeftPy = H * 0.6 + (lastLeftDx * cameraTransform.sin + lastLeftDy * cameraTransform.cos) * VIEW_SCALE;
        ctx.lineTo(lastLeftPx, lastLeftPy);
        
        // 使用二次曲线向后绘制右边缘
        for (let i = rightEnd; i > rightStart; i--) {
            let wp1 = bp.rightEdge[i];
            let wp2 = bp.rightEdge[i - 1];
            
            let dx1 = wp1.x - camera.x, dy1 = wp1.y - camera.y;
            let px1 = W / 2 + (dx1 * cameraTransform.cos - dy1 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py1 = H * 0.6 + (dx1 * cameraTransform.sin + dy1 * cameraTransform.cos) * VIEW_SCALE;
            
            let dx2 = wp2.x - camera.x, dy2 = wp2.y - camera.y;
            let px2 = W / 2 + (dx2 * cameraTransform.cos - dy2 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
            let py2 = H * 0.6 + (dx2 * cameraTransform.sin + dy2 * cameraTransform.cos) * VIEW_SCALE;
            
            let cx = (px1 + px2) / 2;
            let cy = (py1 + py2) / 2;
            ctx.quadraticCurveTo(px1, py1, cx, cy);
        }
        
        ctx.closePath();
        ctx.fill();
    }
}

function drawAllRoadEdges() {
    ctx.strokeStyle = COLORS.trackEdge;
    ctx.lineWidth = TRACK_EDGE_THICKNESS;
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'round';

    // 绘制主赛道边缘 - 使用完整赛道长度确保边缘覆盖整个道路
    let vStart = 0;
    let vEnd = trackLeftEdge.length;
    drawEdgePath(trackLeftEdge, vStart, vEnd);
    drawEdgePath(trackRightEdge, vStart, vEnd);

    // 绘制分支边缘
    for (let bp of branchPaths) {
        let skipStart = Math.min(3, Math.floor(bp.path.length * 0.05));
        let skipEnd = Math.min(3, Math.floor(bp.path.length * 0.05));
        drawEdgePath(bp.leftEdge, skipStart, bp.leftEdge.length);
        drawEdgePath(bp.rightEdge, 0, bp.rightEdge.length - skipEnd);
    }
}

function drawEdgePath(edgePoints, startIdx, endIdx) {
    if (endIdx - startIdx < 2) return;
    
    ctx.beginPath();
    let started = false;
    
    for (let i = startIdx; i < endIdx; i++) {
        let wp = edgePoints[i];
        let dx = wp.x - camera.x;
        let dy = wp.y - camera.y;
        let px = W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let py = H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE;
        
        if (px < -100 || px > W + 100 || py < -100 || py > H + 100) {
            if (started) {
                ctx.stroke();
                ctx.beginPath();
                started = false;
            }
            continue;
        }
        
        if (!started) {
            ctx.moveTo(px, py);
            started = true;
        } else {
            ctx.lineTo(px, py);
        }
    }
    
    if (started) ctx.stroke();
}

function drawCenterLine() {
    // 主赛道两侧的两条白色半透明实线（从边缘向内缩进）
    ctx.strokeStyle = 'rgba(255,255,255)';
    ctx.lineWidth = 1.5;

    let vStart = visibleTrackRange.start;
    let vEnd = Math.min(visibleTrackRange.end, trackPath.length - 1);
    let inset = TRACK_WIDTH * 0.38; // distance from center to each shoulder line

    // 左侧路肩线 - 主范围
    ctx.beginPath();
    drawSmoothCenterLine(vStart, vEnd, inset, true);
    ctx.stroke();

    // 右侧路肩线 - 主范围
    ctx.beginPath();
    drawSmoothCenterLine(vStart, vEnd, inset, false);
    ctx.stroke();
    
    // 绘制额外可见段落的路肩线
    for (let seg of additionalVisibleSegments) {
        let segStart = Math.max(0, seg.start);
        let segEnd = Math.min(trackPath.length - 1, seg.end);
        
        // 左侧路肩线
        ctx.beginPath();
        drawSmoothCenterLine(segStart, segEnd, inset, true);
        ctx.stroke();

        // 右侧路肩线
        ctx.beginPath();
        drawSmoothCenterLine(segStart, segEnd, inset, false);
        ctx.stroke();
    }
}

// 使用Catmull-Rom转Bezier绘制平滑中心线的辅助函数
function drawSmoothCenterLine(startIdx, endIdx, inset, isLeft) {
    if (endIdx <= startIdx) return;
    
    let sign = isLeft ? 1 : -1;
    
    // 第一个点
    let wp0 = trackPath[startIdx];
    let lx0 = wp0.x + wp0.nx * inset * sign;
    let ly0 = wp0.y + wp0.ny * inset * sign;
    let dx0 = lx0 - camera.x;
    let dy0 = ly0 - camera.y;
    let px0 = W / 2 + (dx0 * cameraTransform.cos - dy0 * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
    let py0 = H * 0.6 + (dx0 * cameraTransform.sin + dy0 * cameraTransform.cos) * VIEW_SCALE;
    ctx.moveTo(px0, py0);
    
    for (let i = startIdx; i < endIdx; i++) {
        let p0 = trackPath[Math.max(startIdx, i - 1)];
        let p1 = trackPath[i];
        let p2 = trackPath[i + 1];
        let p3 = trackPath[Math.min(endIdx, i + 2)];
        
        // 计算偏移点
        let pts = [p0, p1, p2, p3].map(p => {
            let lx = p.x + p.nx * inset * sign;
            let ly = p.y + p.ny * inset * sign;
            let dx = lx - camera.x;
            let dy = ly - camera.y;
            return {
                x: W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset,
                y: H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE
            };
        });
        
        // Catmull-Rom转Bezier控制点
        let tension = 0.5;
        let cp1x = pts[1].x + (pts[2].x - pts[0].x) * tension / 3;
        let cp1y = pts[1].y + (pts[2].y - pts[0].y) * tension / 3;
        let cp2x = pts[2].x - (pts[3].x - pts[1].x) * tension / 3;
        let cp2y = pts[2].y - (pts[3].y - pts[1].y) * tension / 3;
        
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, pts[2].x, pts[2].y);
    }
}

function drawScenery() {
    let camX = camera.x, camY = camera.y;
    let viewDist = Math.max(W, H) / 2 + VIEW_MARGIN + 200;
    let nearby = getSceneryNear(camX, camY, viewDist);
    let viewDistSq = viewDist * viewDist;
    for (let i = 0; i < nearby.length; i++) {
        let item = nearby[i];
        let ddx = item.x - camX, ddy = item.y - camY;
        // 跳过视野距离外的场景（使用平方比较）
        if (ddx * ddx + ddy * ddy > viewDistSq) continue;
        
        // 内联屏幕坐标转换
        let dx = item.x - camera.x;
        let dy = item.y - camera.y;
        let sx = W / 2 + (dx * cameraTransform.cos - dy * cameraTransform.sin) * VIEW_SCALE + camera.swayOffset;
        let sy = H * 0.6 + (dx * cameraTransform.sin + dy * cameraTransform.cos) * VIEW_SCALE;
        
        if (sx < -200 || sx > W + 200 || sy < -200 || sy > H + 200) continue;
        if (item.type === 'tree') {
            let sz = item.size * VIEW_SCALE * 1.3;
            ctx.fillStyle = '#5D4037';
            ctx.fillRect(sx - sz*0.15, sy - sz*0.1, sz*0.3, sz*0.6);
            ctx.fillStyle = item.cachedColor || 'rgba(46,100,56,0.9)';
            ctx.beginPath(); ctx.arc(sx, sy - sz*0.3, sz*0.6, 0, Math.PI*2); ctx.fill();
        } else if (item.type === 'people') {
            for (let p of item.people) {
                let px = sx + p.dx * VIEW_SCALE * 1.3, py = sy + p.dy * VIEW_SCALE * 1.3;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(px, py, 4*VIEW_SCALE, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fdbcb4';
                ctx.beginPath(); ctx.arc(px, py - 5*VIEW_SCALE, 2.5*VIEW_SCALE, 0, Math.PI*2); ctx.fill();
            }
        }
    }
}

// NPC音频池 - 性能优化
const NPC_AUDIO_ENABLED = true;

const NPC_AUDIO_FADE_DISTANCE = 80;

// ==================== 窗口调整 ====================
function resize() {
    let dpr = dprEnabled ? (window.devicePixelRatio || 1) : 1;
    W = window.innerWidth;
    H = window.innerHeight;

// 触摸控制
let touchAreas = [];
let touchPressed = { left: false, right: false, up: false, down: false };
let activeTouches = {}; // Track active touches by identifier
function setupTouchAreas() {
    const bw = 70, bh = 65;
    const margin = 32;
    const bottomOffset = 100;
    const btnGap = 5;
    // 左侧：左/右（转向），右侧：上/下（油门/刹车）
    touchAreas = [
        { id: 'up', x: W - bw - margin, y: H - bh * 2 - margin - bottomOffset, w: bw, h: bh },
        { id: 'down', x: W - bw - margin, y: H - bh - margin - bottomOffset + btnGap, w: bw, h: bh },
        { id: 'left', x: margin, y: H - bh - margin - bottomOffset + btnGap, w: bw, h: bh },
        { id: 'right', x: margin + bw + btnGap, y: H - bh - margin - bottomOffset + btnGap, w: bw, h: bh }
    ];
}
setupTouchAreas();

canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    initAudio();
    // 将新触摸添加到activeTouches并记录位置
    for (let t = 0; t < e.changedTouches.length; t++) {
        let touch = e.changedTouches[t];
        activeTouches[touch.identifier] = {
            x: touch.clientX,
            y: touch.clientY
        };
    }
    recalculateTouchState();
    
    // 退出确认对话框 - 始终优先检查
    if (showExitConfirm) {
        for (let t = 0; t < e.touches.length; t++) {
            let tx = e.touches[t].clientX, ty = e.touches[t].clientY;
            let boxW = 280;
            let boxH = 140;
            let boxX = W / 2 - boxW / 2;
            let boxY = H / 2 - boxH / 2;
            let btnW = 100, btnH = 40;
            let btnY = boxY + boxH - 55;
            let btn1X = W / 2 - btnW - 15;
            let btn2X = W / 2 + 15;
            // 取消按钮
            if (tx >= btn1X && tx <= btn1X + btnW && ty >= btnY && ty <= btnY + btnH) {
                showExitConfirm = false;
                gamePaused = false;
                resumeAudio();
            }
            // 确认按钮
            if (tx >= btn2X && tx <= btn2X + btnW && ty >= btnY && ty <= btnY + btnH) {
                showExitConfirm = false;
                gamePaused = false;
                destroyAudio();
                gameState = 'menu';
                clearSeedInput();
            }
        }
        return;
    }
    
    // 菜单点击
    if (gameState === 'menu') {
        for (let t = 0; t < e.touches.length; t++) {
            let tx = e.touches[t].clientX, ty = e.touches[t].clientY;
            
            // 检查触摸是否在种子输入框上
            let seedInput = document.getElementById('seedInput');
            let seedInputRect = seedInput ? seedInput.getBoundingClientRect() : null;
            let touchedOnSeedInput = seedInputRect && 
                tx >= seedInputRect.left && tx <= seedInputRect.right &&
                ty >= seedInputRect.top && ty <= seedInputRect.bottom;
            
            // 如果触摸在种子输入框外，让输入框失去焦点
            if (!touchedOnSeedInput && seedInput && document.activeElement === seedInput) {
                seedInput.blur();
            }
            
            for (let i = 0; i < menuButtonRects.length; i++) {
                let b = menuButtonRects[i];
                if (tx >= b.x && tx <= b.x + b.w && ty >= b.y && ty <= b.y + b.h) {
                    if (b.type === 'npcSwitch') {
                        showNPCs = !showNPCs;
                    } else {
                        startGame();
                    }
                }
            }
        }
    }
    // 比赛中的主页按钮（包括倒计时）
    if ((gameState === 'racing' || gameState === 'countdown') && !finishResultsShown && homeButtonRect) {
        for (let t = 0; t < e.touches.length; t++) {
            let tx = e.touches[t].clientX, ty = e.touches[t].clientY;
            if (tx >= homeButtonRect.x && tx <= homeButtonRect.x + homeButtonRect.w &&
                ty >= homeButtonRect.y && ty <= homeButtonRect.y + homeButtonRect.h) {
                gamePaused = true;
                suspendAudio();
                showExitConfirm = true;
                return;
            }
        }
    }
    if (gameState === 'results' || finishResultsShown) {
        for (let t = 0; t < e.touches.length; t++) {
            let tx = e.touches[t].clientX, ty = e.touches[t].clientY;
            for (let i = 0; i < resultButtonRects.length; i++) {
                let b = resultButtonRects[i];
                if (tx >= b.x && tx <= b.x + b.w && ty >= b.y && ty <= b.y + b.h) {
                    if (i === 0) { stopGameSounds(); gameState = 'menu'; finishResultsShown = false; clearSeedInput(); }
                    else if (i === 1) continueDriving();
                }
            }
        }
    }
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    // 更新活动触摸的位置
    for (let t = 0; t < e.changedTouches.length; t++) {
        let touch = e.changedTouches[t];
        if (activeTouches[touch.identifier] !== undefined) {
            activeTouches[touch.identifier].x = touch.clientX;
            activeTouches[touch.identifier].y = touch.clientY;
        }
    }
    recalculateTouchState();
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    // 从activeTouches中移除结束的触摸
    for (let t = 0; t < e.changedTouches.length; t++) {
        delete activeTouches[e.changedTouches[t].identifier];
    }
    // 根据剩余的活动触摸重新计算触摸状态
    recalculateTouchState();
}, { passive: false });

canvas.addEventListener('touchcancel', function(e) {
    e.preventDefault();
    // 取消所有触摸
    activeTouches = {};
    recalculateTouchState();
}, { passive: false });

function recalculateTouchState() {
    touchControls.left = false;
    touchControls.right = false;
    touchControls.up = false;
    touchControls.down = false;
    touchPressed = { left: false, right: false, up: false, down: false };
    
    // 重新设置触摸区域以适应可能的窗口调整
    setupTouchAreas();
    
    // 检查每个活动触摸
    for (let id in activeTouches) {
        let touch = activeTouches[id];
        let tx = touch.x, ty = touch.y;
        for (let a of touchAreas) {
            if (tx >= a.x && tx <= a.x + a.w && ty >= a.y && ty <= a.y + a.h) {
                touchControls[a.id] = true;
                touchPressed[a.id] = true;
            }
        }
    }
}

function handleTouches(touches) {
    touchControls.left = false;
    touchControls.right = false;
    touchControls.up = false;
    touchControls.down = false;
    touchPressed = { left: false, right: false, up: false, down: false };
    for (let t = 0; t < touches.length; t++) {
        let tx = touches[t].clientX, ty = touches[t].clientY;
        for (let a of touchAreas) {
            if (tx >= a.x && tx <= a.x + a.w && ty >= a.y && ty <= a.y + a.h) {
                touchControls[a.id] = true;
                touchPressed[a.id] = true;
            }
        }
    }
}

// 鼠标菜单控制
canvas.addEventListener('click', function(e) {
    initAudio();
    
    // 退出确认对话框 - 始终优先检查
    if (showExitConfirm) {
        let mx = e.clientX, my = e.clientY;

// ==================== 音频 ====================
function initAudio() {
    if (audioInitialized) return;
    audioInitialized = true;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // 主压缩器防止削波
        masterCompressor = audioCtx.createDynamicsCompressor();
        masterCompressor.threshold.value = -20;
        masterCompressor.knee.value = 20;
        masterCompressor.ratio.value = 8;
        masterCompressor.attack.value = 0.003;
        masterCompressor.release.value = 0.15;
        masterCompressor.connect(audioCtx.destination);

        // 引擎：三角波（比锯齿波更平滑）
        engineOsc = audioCtx.createOscillator();
        engineOsc.type = 'triangle';
        engineOsc.frequency.value = 100;
        engineGain = audioCtx.createGain();
        engineGain.gain.value = 0;
        let engineFilter = audioCtx.createBiquadFilter();
        engineFilter.type = 'lowpass';
        engineFilter.frequency.value = 600;
        engineFilter.Q.value = 1;
        engineOsc.connect(engineFilter);
        engineFilter.connect(engineGain);
        engineGain.connect(masterCompressor);
        engineOsc.start();

        // 风噪声
        let bufferSize = audioCtx.sampleRate * 2;
        let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
        }
        windNode = audioCtx.createBufferSource();
        windNode.buffer = noiseBuffer;
        windNode.loop = true;
        windGain = audioCtx.createGain();
        windGain.gain.value = 0;
        let windFilter = audioCtx.createBiquadFilter();
        windFilter.type = 'bandpass';
        windFilter.frequency.value = 500;
        windFilter.Q.value = 0.5;
        windNode.connect(windFilter);
        windFilter.connect(windGain);
        windGain.connect(masterCompressor);
        windNode.start();

        // 刹车噪声（类似风的摩擦声）
        let brakeBufferSize = audioCtx.sampleRate * 2;
        let brakeNoiseBuffer = audioCtx.createBuffer(1, brakeBufferSize, audioCtx.sampleRate);
        let brakeOutput = brakeNoiseBuffer.getChannelData(0);
        for (let i = 0; i < brakeBufferSize; i++) {
            brakeOutput[i] = Math.random() * 2 - 1;
        }
        brakeNoiseNode = audioCtx.createBufferSource();
        brakeNoiseNode.buffer = brakeNoiseBuffer;
        brakeNoiseNode.loop = true;
        brakeGain = audioCtx.createGain();
        brakeGain.gain.value = 0;
        let brakeFilter = audioCtx.createBiquadFilter();
        brakeFilter.type = 'highpass';
        brakeFilter.frequency.value = 800;
        let brakeFilter2 = audioCtx.createBiquadFilter();
        brakeFilter2.type = 'lowpass';
        brakeFilter2.frequency.value = 3000;
        brakeNoiseNode.connect(brakeFilter);
        brakeFilter.connect(brakeFilter2);
        brakeFilter2.connect(brakeGain);
        brakeGain.connect(masterCompressor);
        brakeNoiseNode.start();
    } catch (e) {
        audioInitialized = false;
    }
}

function updateEngineSound(speed, maxSpeed) {
    if (!audioCtx || !engineOsc) return;
    let ratio = Math.abs(speed) / maxSpeed;
    let t = audioCtx.currentTime;
    engineOsc.frequency.setTargetAtTime(90 + ratio * 180, t, 0.05);
    engineGain.gain.setTargetAtTime(Math.min(0.20, ratio * 0.22), t, 0.05); // Increased max volume for 220 max speed
    if (windGain) {
        windGain.gain.setTargetAtTime(Math.min(0.012, ratio * ratio * 0.015), t, 0.05);
    }
}

function createNPCEngineSound(npc) {
    if (!audioCtx || !NPC_AUDIO_ENABLED) return null;
    try {
        let osc = audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = 100;
        
        let gain = audioCtx.createGain();
        gain.gain.value = 0;
        
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 550;
        filter.Q.value = 0.8;
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterCompressor);
        osc.start();
        
        return { oscillator: osc, gain: gain, currentGain: 0 };
    } catch(e) {
        return null;
    }
}

function destroyNPCEngineSound(audioNode) {
    if (!audioNode) return;
    try {
        let t = audioCtx.currentTime;
        audioNode.gain.gain.setTargetAtTime(0, t, 0.03);
        audioNode.oscillator.stop(t + 0.05);
        audioNode.oscillator.disconnect();
        audioNode.gain.disconnect();
    } catch(e) {}
}

function updateNPCEngineSound(npc, player) {
    if (!NPC_AUDIO_ENABLED || !audioCtx) return;
    
    let audioIdx = npc.audioIndex;
    if (audioIdx === undefined || audioIdx < 0 || audioIdx >= npcAudioNodes.length) return;
    
    let dx = npc.x - player.x;
    let dy = npc.y - player.y;
    let distance = Math.sqrt(dx * dx + dy * dy);
    
    let shouldBeActive = distance < NPC_AUDIO_MAX_DISTANCE;
    let audioNode = npcAudioNodes[audioIdx];
    
    if (shouldBeActive && !audioNode) {
        audioNode = createNPCEngineSound(npc);
        npcAudioNodes[audioIdx] = audioNode;
    } else if (!shouldBeActive && audioNode) {
        destroyNPCEngineSound(audioNode);
        npcAudioNodes[audioIdx] = null;
        return;
    }
    
    if (!audioNode) return;
    
    let t = audioCtx.currentTime;
    let ratio = Math.abs(npc.speed) / npc.maxSpeed;
    
    let distanceFactor = 1 - Math.min(1, distance / NPC_AUDIO_MAX_DISTANCE);
    distanceFactor = distanceFactor * distanceFactor;
    
    if (distance < NPC_AUDIO_FADE_DISTANCE) {
        distanceFactor = 1;
    }
    
    let baseGain = 0.20;
    let targetGain = baseGain * ratio * distanceFactor;
    targetGain = Math.min(targetGain, 0.20);
    
    audioNode.currentGain = lerp(audioNode.currentGain, targetGain, 0.1);
    audioNode.gain.gain.setTargetAtTime(audioNode.currentGain, t, 0.05);
    
    let baseFreq = 100;
    let targetFreq = baseFreq + ratio * 160;
    audioNode.oscillator.frequency.setTargetAtTime(targetFreq, t, 0.05);
}

function playCollisionSound() {
    if (!audioCtx) return;
    let now = audioCtx.currentTime;
    if (now - lastCollisionSoundTime < 0.1) return;
    lastCollisionSoundTime = now;
    try {
        let bufSize = Math.floor(audioCtx.sampleRate * 0.12);
        let buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        let data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) {
            let env = 1 - i / bufSize;
            data[i] = (Math.random() * 2 - 1) * env * 0.5;
        }
        let src = audioCtx.createBufferSource();
        src.buffer = buf;
        let filt = audioCtx.createBiquadFilter();
        filt.type = 'lowpass';
        filt.frequency.value = 600;
        let g = audioCtx.createGain();
        g.gain.value = 0.4;
        g.gain.setTargetAtTime(0, now + 0.05, 0.03);
        src.connect(filt);
        filt.connect(g);
        g.connect(masterCompressor);
        src.start();
        src.stop(now + 0.15);
    } catch(e) {}
}

function playWallSound() {
    if (!audioCtx) return;
    let now = audioCtx.currentTime;
    if (now - lastWallSoundTime < 0.15) return;
    lastWallSoundTime = now;
    try {
        let osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 180;
        osc.frequency.setTargetAtTime(100, now + 0.05, 0.04);
        let g = audioCtx.createGain();
        g.gain.value = 0.2;
        g.gain.setTargetAtTime(0.001, now + 0.05, 0.04);
        osc.connect(g);
        g.connect(masterCompressor);
        osc.start(now);
        osc.stop(now + 0.15);
    } catch(e) {}
}

function playBrakeSound(intensity) {
    if (!audioCtx || !brakeGain) return;
    let now = audioCtx.currentTime;
    let targetGain = Math.min(0.01, intensity * 0.02); // Reduced brake sound volume
    brakeGain.gain.setTargetAtTime(targetGain, now, 0.05);
}

function stopBrakeSound() {
    if (!audioCtx || !brakeGain) return;
    let now = audioCtx.currentTime;
    brakeGain.gain.setTargetAtTime(0, now, 0.08);
}

function stopGameSounds() {
    if (!audioCtx) return;
    let t = audioCtx.currentTime;
    if (engineGain) engineGain.gain.setTargetAtTime(0, t, 0.05);
    if (windGain) windGain.gain.setTargetAtTime(0, t, 0.05);
    if (brakeGain) brakeGain.gain.setTargetAtTime(0, t, 0.05);
    
    // 停止所有NPC引擎声音
    if (NPC_AUDIO_ENABLED) {
        for (let i = 0; i < npcAudioNodes.length; i++) {
            if (npcAudioNodes[i]) {
                destroyNPCEngineSound(npcAudioNodes[i]);
                npcAudioNodes[i] = null;
            }
        }
    }
}

function destroyAudio() {
    if (!audioCtx) return;
    
    // 关闭音频上下文 - 这会自动清理所有节点
    try {
        audioCtx.close();
    } catch(e) {}
    
    // 重置音频状态
    audioCtx = null;
    audioInitialized = false;
    audioSuspended = false;
    
    // 清空NPC音频节点数组
    npcAudioNodes = [];
}

function playTireScreech(intensity) {
    if (!audioCtx) return;
    try {
        let now = audioCtx.currentTime;
        let bufSize = Math.floor(audioCtx.sampleRate * 0.1);
        let buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        let data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
        let src = audioCtx.createBufferSource();
        src.buffer = buf;
        let filt = audioCtx.createBiquadFilter();
        filt.type = 'highpass';
        filt.frequency.value = 2500;
        let g = audioCtx.createGain();
        g.gain.value = Math.min(0.06, intensity * 0.08);
        g.gain.setTargetAtTime(0.001, now + 0.04, 0.03);
        src.connect(filt);
        filt.connect(g);
        g.connect(masterCompressor);
        src.start();
        src.stop(now + 0.12);
    } catch(e) {}
}

function playCountdownBeep(isGo) {
    if (!audioCtx) return;
    try {
        let now = audioCtx.currentTime;
        let osc = audioCtx.createOscillator();
        osc.type = 'sine';
        let g = audioCtx.createGain();
        if (isGo) {
            // 更高音调、更长，用于"GO!"
            osc.frequency.setValueAtTime(523, now);
            osc.frequency.setTargetAtTime(659, now + 0.05, 0.03);
            g.gain.setValueAtTime(0.12, now);
            g.gain.setTargetAtTime(0.001, now + 0.35, 0.1);
            osc.connect(g); g.connect(masterCompressor);
            osc.start(now); osc.stop(now + 0.5);
        } else {
            // Short tick for 3-2-1
            osc.frequency.setValueAtTime(440, now);
            g.gain.setValueAtTime(0.1, now);
            g.gain.setTargetAtTime(0.001, now + 0.12, 0.04);
            osc.connect(g); g.connect(masterCompressor);
            osc.start(now); osc.stop(now + 0.2);
        }
    } catch(e) {}
}

// ==================== 数学辅助函数 ====================
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
function dist(x1, y1, x2, y2) { return Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1)); }
function angleDiff(a, b) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
}
function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
}

// ==================== 种子随机数生成器 ====================
let currentSeed = null;
let seedRandomState = 0;
let useSeededRandom = false;

// 字符串种子的简单哈希函数
function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & 0xFFFFFFFF; // 保持在32位内
    }
    return Math.abs(hash >>> 0); // 转换为无符号32位
}

// 设置地图生成的种子
function setMapSeed(seed) {
    // 首先重置种子状态
    useSeededRandom = false;
    seedRandomState = 0;
    
    if (seed === null || seed === undefined || seed === '') {
        // 生成随机种子
        seed = Math.floor(Math.random() * 1000000).toString(36).toUpperCase();
    }
    currentSeed = seed.toString().toUpperCase();
    // 从种子初始化随机状态
    let numericSeed = hashString(currentSeed);
    seedRandomState = numericSeed % 2147483647;
    if (seedRandomState <= 0) seedRandomState += 2147483646;
    useSeededRandom = true;
}

// Set a derived seed for a specific generation step
function setDerivedSeed(stepName) {
    if (!currentSeed) return;
    let combined = currentSeed + stepName;
    let numericSeed = hashString(combined);
    seedRandomState = numericSeed % 2147483647;
    if (seedRandomState <= 0) seedRandomState += 2147483646;
    console.log('Derived seed for', stepName, ':', seedRandomState);
}

// 获取当前地图种子
function getMapSeed() {
    return currentSeed || 'RANDOM';
}

// Enable/disable seeded random
function enableSeededRandom(enable) {
    useSeededRandom = enable;
}

// 种子随机数生成器（0到1）
function seededRandom() {
    seedRandomState = (seedRandomState * 16807) % 2147483647;
    return (seedRandomState - 1) / 2147483646;
}

// 种子随机范围 [a, b)
function randRange(a, b) {
    if (useSeededRandom) {
        return a + seededRandom() * (b - a);
    }
    return a + Math.random() * (b - a);
}

// 种子随机整数 [a, b]
function randInt(a, b) {
    return Math.floor(randRange(a, b + 1));
}

// 种子随机布尔值（给定概率）
function randBool(prob) {
    if (useSeededRandom) {
        return seededRandom() < prob;
    }
    return Math.random() < prob;
}

// 种子随机选择：-1或1
function randSign() {
    return randBool(0.5) ? 1 : -1;
}

function segmentIntersect(ax,ay,bx,by,cx,cy,dx,dy) {
    let denom = (bx-ax)*(dy-cy) - (by-ay)*(dx-cx);
    if (Math.abs(denom) < 1e-10) return false;
    let t = ((cx-ax)*(dy-cy) - (cy-ay)*(dx-cx)) / denom;
    let u = ((cx-ax)*(by-ay) - (cy-ay)*(bx-ax)) / denom;
    return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}

// ==================== CATMULL-ROM样条曲线 ====================
function catmullRom(p0, p1, p2, p3, t) {
    let t2 = t * t, t3 = t2 * t;
    return {
        x: 0.5 * ((2*p1.x) + (-p0.x + p2.x)*t + (2*p0.x - 5*p1.x + 4*p2.x - p3.x)*t2 + (-p0.x + 3*p1.x - 3*p2.x + p3.x)*t3),
        y: 0.5 * ((2*p1.y) + (-p0.y + p2.y)*t + (2*p0.y - 5*p1.y + 4*p2.y - p3.y)*t2 + (-p0.y + 3*p1.y - 3*p2.y + p3.y)*t3)
    };
}

function catmullRomDerivative(p0, p1, p2, p3, t) {
    let t2 = t * t;
    return {
        x: 0.5 * ((-p0.x + p2.x) + (4*p0.x - 10*p1.x + 8*p2.x - 2*p3.x)*t + (-3*p0.x + 9*p1.x - 9*p2.x + 3*p3.x)*t2),
        y: 0.5 * ((-p0.y + p2.y) + (4*p0.y - 10*p1.y + 8*p2.y - 2*p3.y)*t + (-3*p0.y + 9*p1.y - 9*p2.y + 3*p3.y)*t2)
    };
}

// ==================== 赛道生成 ====================
function segmentsIntersect(a, b, c, d) {
    let denom = (b.x - a.x) * (d.y - c.y) - (b.y - a.y) * (d.x - c.x);
    if (Math.abs(denom) < 1e-10) return false;
    let t = ((c.x - a.x) * (d.y - c.y) - (c.y - a.y) * (d.x - c.x)) / denom;
    let u = ((c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x)) / denom;
    return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}

// 计算点到线段的距离
function pointToSegmentDistance(point, segStart, segEnd) {
    let dx = segEnd.x - segStart.x;
    let dy = segEnd.y - segStart.y;
    let lenSq = dx * dx + dy * dy;
    
    if (lenSq === 0) {
        let px = point.x - segStart.x;
        let py = point.y - segStart.y;
        return Math.sqrt(px * px + py * py);
    }
    
    let t = ((point.x - segStart.x) * dx + (point.y - segStart.y) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    
    let projX = segStart.x + t * dx;
    let projY = segStart.y + t * dy;
    
    let px = point.x - projX;
    let py = point.y - projY;
    
    return Math.sqrt(px * px + py * py);
}

// 检查路径点是否有自相交
function pathHasIntersection(path, skipNearby) {
    let len = path.length;
    for (let i = 0; i < len - 1; i++) {
        for (let j = i + skipNearby; j < len - 1; j++) {
            if (segmentsIntersect(path[i], path[i + 1], path[j], path[j + 1])) {
                return true;
            }
        }
    }
    return false;
}

function generateSprintTrack() {
    // 为新赛道重置所有延续状态
    window.arcContinuation = { count: 0, amount: 0 };
    window.hairpinContinuation = { count: 0, amount: 0 };
    window.bigTurnContinuation = { count: 0, amount: 0 };
    window.sCurveContinuation = { count: 0, amount: 0, phase: 0 };
    
    // 为赛道生成设置派生种子
    setDerivedSeed('TRACK');
    
    let maxAttempts = 30;
    
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
        let nodeCount = randInt(100, 130);
        let nodes = [];
        let baseAngle = randRange(-Math.PI / 2, Math.PI / 2);
        let x = 0, y = 0;
        let valid = true;
        
        // 跟踪上一个段落是否为弯道，以在弯道后强制更长的直道
        let lastWasCurve = false;
        let straightAfterCurveCount = 0;
        
        for (let i = 0; i < nodeCount && valid; i++) {
            nodes.push({ x: x, y: y });
            
            let segLen = randRange(600, 1000);
            let r = randRange(0, 1);
            let turnAmount;
            let isCurve = false;

            // 如果刚过弯道，25%概率强制更长的直道段落
            if (lastWasCurve && straightAfterCurveCount < 2 && randBool(0.25)) {
                // 强制弯道后的直道段落（最少2段）
                turnAmount = 0;
                segLen = randRange(700, 1100);
                straightAfterCurveCount++;
                lastWasCurve = false;
            }
            // Hairpin turn (发卡弯) - 12% chance
            if (r < 0.12) {
                let hairpinDir = randSign();
                turnAmount = randRange(0.6, 0.9) * hairpinDir;
                segLen = randRange(400, 600);
                isCurve = true;
                // 标记发卡弯延续 - 下一个方向相反
                if (!window.hairpinContinuation) window.hairpinContinuation = { count: 0, amount: 0 };
                window.hairpinContinuation.count = randInt(2, 3);
                window.hairpinContinuation.amount = -turnAmount * 0.7; // Opposite direction, slightly less
            }
            // 继续发卡弯（U形的第二部分）
            else if (window.hairpinContinuation && window.hairpinContinuation.count > 0) {
                turnAmount = window.hairpinContinuation.amount;
                segLen = randRange(400, 600);
                isCurve = true;
                window.hairpinContinuation.count--;
            }
            // 大90度转弯，形成方形赛道（25%概率）
            else if (r < 0.37) {
                let turnDir = randSign();
                turnAmount = randRange(0.8, 1.2) * turnDir; // Large turn angle
                segLen = randRange(600, 900);
                isCurve = true;
                if (!window.bigTurnContinuation) window.bigTurnContinuation = { count: 0, amount: 0 };
                window.bigTurnContinuation.count = 1;
                window.bigTurnContinuation.amount = turnAmount;
            }
            // 继续大转弯 - 直道段落完成90度
            else if (window.bigTurnContinuation && window.bigTurnContinuation.count > 0) {
                turnAmount = 0;
                segLen = randRange(600, 900); // Increased from 500-700
                window.bigTurnContinuation.count = 0;
            }
            // 大弧形/近圆形弯道（5%概率）
            else if (r < 0.42) {
                // 通过设置一致的小转弯生成连续弧形
                // 这会创建近乎圆形的大半径弯道
                let arcDir = randSign();
                turnAmount = randRange(0.08, 0.15) * arcDir;
                segLen = randRange(500, 800);
                isCurve = true;
                // 标记后续段落继续
                if (!window.arcContinuation) window.arcContinuation = { count: 0, amount: 0 };
                window.arcContinuation.count = randInt(3, 6);
                window.arcContinuation.amount = turnAmount;
            }
            // 继续之前的弧形
            else if (window.arcContinuation && window.arcContinuation.count > 0) {
                turnAmount = window.arcContinuation.amount;
                segLen = randRange(500, 800);
                isCurve = true;
                window.arcContinuation.count--;
            }
            // S形弯道模式 - 逼真的S弯（第一个转弯）- 13%概率
            else if (r < 0.55) {
                turnAmount = randRange(0.7, 1.0) * randSign();
                if (!window.sCurveContinuation) window.sCurveContinuation = { count: 0, amount: 0, phase: 0 };
                window.sCurveContinuation.count = 1;
                window.sCurveContinuation.amount = turnAmount > 0 ? 1 : -1;
                window.sCurveContinuation.phase = 'turn1';
                segLen = randRange(500, 700);
                isCurve = true;
            }
            // S弯 - 中间直道段落
            else if (window.sCurveContinuation && window.sCurveContinuation.count > 0 && window.sCurveContinuation.phase === 'turn1') {
                turnAmount = 0;
                segLen = randRange(500, 700); // Increased from 400-600
                window.sCurveContinuation.count = 1;
                window.sCurveContinuation.phase = 'straight';
            }
            // S弯 - 第二个反向转弯
            else if (window.sCurveContinuation && window.sCurveContinuation.count > 0 && window.sCurveContinuation.phase === 'straight') {
                turnAmount = randRange(0.7, 1.0) * (window.sCurveContinuation.amount > 0 ? -1 : 1);
                segLen = randRange(500, 700);
                window.sCurveContinuation.count = 0;
                window.sCurveContinuation.phase = 0;
                isCurve = true;
            }
            // 长直道（10%概率）
            else if (r < 0.65) {
                turnAmount = 0;
                segLen = randRange(800, 1200);
            }
            // 缓和弯道（15%概率）
            else if (r < 0.80) {
                turnAmount = randRange(-0.35, 0.35);
                isCurve = Math.abs(turnAmount) > 0.15;
            }
            // 较急转弯（剩余概率）
            else {
                turnAmount = randRange(-0.5, 0.5);
                isCurve = Math.abs(turnAmount) > 0.15;
            }
            
            // 更新弯道跟踪
            if (isCurve) {
                lastWasCurve = true;
                straightAfterCurveCount = 0;
            }
            
            let newAngle = baseAngle + turnAmount;
            let nx = x + Math.cos(newAngle) * segLen;
            let ny = y + Math.sin(newAngle) * segLen;
            
            // 节点自相交检查（跳过最后8个段落以获得更好的检测）
            let hasIntersection = false;
            if (nodes.length > 10) {
                let newSegStart = { x: x, y: y };
                let newSegEnd = { x: nx, y: ny };
                
                for (let j = 0; j < nodes.length - 8; j++) {
                    if (segmentsIntersect(nodes[j], nodes[j + 1], newSegStart, newSegEnd)) {
                        hasIntersection = true;
                        break;
                    }
                }
                
                // 同时检查新段落是否太接近现有节点（邻近检查）
                if (!hasIntersection) {
                    for (let j = 0; j < nodes.length - 8; j++) {
                        let node = nodes[j];
                        let dist = pointToSegmentDistance(node, newSegStart, newSegEnd);
                        if (dist < TRACK_WIDTH * 0.6) {
                            hasIntersection = true;
                            break;
                        }
                    }
                }
            }
            
            if (hasIntersection) {
                // 尝试更多重试来找到有效方向
                let found = false;
                for (let retry = 0; retry < 15; retry++) {
                    turnAmount = randRange(-0.4, 0.4);
                    newAngle = baseAngle + turnAmount;
                    nx = x + Math.cos(newAngle) * segLen;
                    ny = y + Math.sin(newAngle) * segLen;
                    
                    hasIntersection = false;
                    let newSegStart = { x: x, y: y };
                    let newSegEnd = { x: nx, y: ny };
                    
                    for (let j = 0; j < nodes.length - 8; j++) {
                        if (segmentsIntersect(nodes[j], nodes[j + 1], newSegStart, newSegEnd)) {
                            hasIntersection = true;
                            break;
                        }
                    }
                    
                    // 重试时也检查邻近
                    if (!hasIntersection) {
                        for (let j = 0; j < nodes.length - 8; j++) {
                            let node = nodes[j];
                            let dist = pointToSegmentDistance(node, newSegStart, newSegEnd);
                            if (dist < TRACK_WIDTH * 0.6) {
                                hasIntersection = true;
                                break;
                            }
                        }
                    }
                    
                    if (!hasIntersection) {
                        found = true;
                        break;
                    }
                }
                
                if (!found) {
                    // 继续同一方向
                    nx = x + Math.cos(baseAngle) * segLen;
                    ny = y + Math.sin(baseAngle) * segLen;
                    newAngle = baseAngle;
                }
            }
            
            x = nx;
            y = ny;
            baseAngle = newAngle;
        }
        
        // 构建路径并验证无相交
        let testPath = buildTrackPath(nodes, false);
        
        // 检查路径相交（跳过邻近段落 - 间隔50点进行更严格的检查）
        if (!pathHasIntersection(testPath, 50)) {
            return nodes;
        }
    }
    
    // 备用：返回带有弯道的赛道
    let nodes = [];
    let x = 0, y = 0, angle = 0;
    let curvePhase = 0;
    for (let i = 0; i < 80; i++) {
        nodes.push({ x: x, y: y });

        // 为备用赛道添加一些弯道
        if (i % 15 === 5) {
            // S形弯道
            angle += randRange(0.6, 0.9) * randSign();
        } else if (i % 15 === 10) {
            // 反向转弯
            angle += randRange(0.6, 0.9) * randSign();
        } else {
            // 缓和变化
            angle += randRange(-0.15, 0.15);
        }

        x += Math.cos(angle) * 500;
        y += Math.sin(angle) * 500;
    }
    return nodes;
}

function buildTrackPath(nodes, closed) {
    let path = [];
    let n = nodes.length;
    let segCount = closed ? n : n - 1;
    for (let i = 0; i < segCount; i++) {
        let p0, p1, p2, p3;
        if (closed) {
            p0 = nodes[((i - 1) % n + n) % n];
            p1 = nodes[i % n];
            p2 = nodes[(i + 1) % n];
            p3 = nodes[(i + 2) % n];
        } else {
            p0 = nodes[Math.max(0, i - 1)];
            p1 = nodes[i];
            p2 = nodes[Math.min(n - 1, i + 1)];
            p3 = nodes[Math.min(n - 1, i + 2)];
        }
        for (let j = 0; j < SPLINE_SEGMENTS; j++) {
            let t = j / SPLINE_SEGMENTS;
            let pt = catmullRom(p0, p1, p2, p3, t);
            let dv = catmullRomDerivative(p0, p1, p2, p3, t);
            let len = Math.sqrt(dv.x * dv.x + dv.y * dv.y);
            if (len < 0.001) len = 0.001;
            let nx = -dv.y / len;
            let ny = dv.x / len;
            let dir = Math.atan2(dv.y, dv.x);
            path.push({ x: pt.x, y: pt.y, nx: nx, ny: ny, dir: dir });
        }
    }
    if (!closed) {
        let lastNode = nodes[n - 1];
        let prevPt = path[path.length - 1];
        let dx = lastNode.x - prevPt.x;
        let dy = lastNode.y - prevPt.y;
        let len = Math.sqrt(dx*dx + dy*dy);
        if (len < 0.001) len = 0.001;
        path.push({ x: lastNode.x, y: lastNode.y, nx: -dy / len, ny: dx / len, dir: Math.atan2(dy, dx) });
    }
    return path;
}

function buildEdges(path) {
    let left = [], right = [];
    let halfWidth = TRACK_WIDTH / 2;
    for (let i = 0; i < path.length; i++) {
        let p = path[i];
        left.push({ x: p.x + p.nx * halfWidth, y: p.y + p.ny * halfWidth });
        right.push({ x: p.x - p.nx * halfWidth, y: p.y - p.ny * halfWidth });
    }
    return { left, right };
}



// 检测主赛道的自相交并返回排除区域
function detectSelfIntersections(pathLength) {
    let zones = [];
    let checkInterval = Math.max(50, Math.floor(pathLength / 20)); // 每50点检查一次
    let searchRadius = 150; // 在此范围内搜索相交
    
    for (let i = 0; i < pathLength; i += checkInterval) {
        let p1 = trackPath[i];
        if (!p1) continue;
        
        // 寻找距离近但索引相距较远的其他点（非相邻）
        for (let j = i + searchRadius; j < Math.min(pathLength, i + searchRadius * 3); j++) {
            let p2 = trackPath[j];
            if (!p2) continue;
            
            let dx = p1.x - p2.x;
            let dy = p1.y - p2.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            
            // 如果点距离近但索引相距远，则为自相交
            if (dist < TRACK_WIDTH * 2.5) {
                // 在两个点周围创建排除区域
                let zoneSize = 50;
                zones.push({
                    start: Math.max(0, i - zoneSize),
                    end: Math.min(pathLength, i + zoneSize)
                });
                zones.push({
                    start: Math.max(0, j - zoneSize),
                    end: Math.min(pathLength, j + zoneSize)
                });
            }
        }
    }
    
    // 合并重叠区域
    if (zones.length === 0) return [];
    
    zones.sort((a, b) => a.start - b.start);
    let merged = [zones[0]];
    for (let i = 1; i < zones.length; i++) {
        let last = merged[merged.length - 1];
        let curr = zones[i];
        if (curr.start <= last.end) {
            last.end = Math.max(last.end, curr.end);
        } else {
            merged.push(curr);
        }
    }
    
    return merged;
}

// 存储自相交区域的全局变量
let selfIntersectionZones = [];

function generateTrack() {
    trackNodes = generateSprintTrack();
    trackPath = buildTrackPath(trackNodes, false);
    let edges = buildEdges(trackPath);
    trackLeftEdge = edges.left;
    trackRightEdge = edges.right;
    buildTrackGrid();
    generateBranches();
    buildBranchGrid();
    selfIntersectionZones = detectSelfIntersections(trackPath.length);
    generateScenery();
    computeMinimapBounds();
    preprocessTrack(trackPath);
}

function preprocessTrack(trackPath) {
    for (let i = 0; i < trackPath.length; i++) {
        let p = trackPath[i];
        let next = trackPath[Math.min(i + 1, trackPath.length - 1)];
        let dx = next.x - p.x;
        let dy = next.y - p.y;
        p.dir = Math.atan2(dy, dx);
        let look = trackPath[Math.min(i + 6, trackPath.length - 1)];
        let d = angleDiff(p.dir, look.dir);
        p.curvature = Math.abs(d);
    }
}

function updateClosestPath(car) {
    let bestIdx = car.currentPathIdx;
    let bestDist = Infinity;
    for (let i = -5; i <= 5; i++) {
        let idx = clamp(car.currentPathIdx + i, 0, trackPath.length - 1);
        let dx = car.x - trackPath[idx].x;
        let dy = car.y - trackPath[idx].y;
        let d = dx * dx + dy * dy;
        if (d < bestDist) {
            bestDist = d;
            bestIdx = idx;
        }
    }
    car.currentPathIdx = bestIdx;
}

function computeDrivingTarget(car) {
    let speedRatio = car.speed / car.maxSpeed;
    let currentIdx = car.currentPathIdx;
    
    let lookAheadDist = 3 + Math.floor(speedRatio * 3);
    let targetIdx = Math.min(currentIdx + lookAheadDist, trackPath.length - 1);
    
    let offset = car.laneOffset * TRACK_WIDTH * 0.2;
    let target = trackPath[targetIdx];
    let tx = target.x - Math.sin(target.dir) * offset;
    let ty = target.y + Math.cos(target.dir) * offset;
    return { x: tx, y: ty, idx: targetIdx };
}

function computeTargetSpeed(car, targetIdx) {
    let curve = trackPath[targetIdx].curvature;
    let curveFactor = clamp(1 - curve * 1.2, 0.6, 1);
    let skillFactor = lerp(0.9, 1.05, car.skill);
    return car.maxSpeed * curveFactor * skillFactor;
}

function checkCollisionBox(car, other, boxLength, boxWidth, offsetX, offsetY) {
    let cosDir = Math.cos(car.direction);
    let sinDir = Math.sin(car.direction);
    
    let boxCenterX = car.x + cosDir * offsetX - sinDir * offsetY;
    let boxCenterY = car.y + sinDir * offsetX + cosDir * offsetY;
    
    let dx = other.x - boxCenterX;
    let dy = other.y - boxCenterY;
    
    let localX = dx * cosDir + dy * sinDir;
    let localY = -dx * sinDir + dy * cosDir;
    
    return Math.abs(localX) < boxLength / 2 + other.length / 2 &&
           Math.abs(localY) < boxWidth / 2 + other.width / 2;
}

function computeOvertaking(car, dt) {
    if (!car.overtakeState) {
        car.overtakeState = 'none';
        car.overtakeTargetLane = 0;
        car.overtakeTimer = 0;
    }
    
    car.overtakeTimer += dt;
    
    if (car.overtakeState === 'changing') {
        if (Math.abs(car.laneOffset - car.overtakeTargetLane) < 0.2) {
            car.overtakeState = 'overtaking';
        }
        return { overtaking: true, targetLane: car.overtakeTargetLane, blocked: true };
    }
    
    if (car.overtakeState === 'overtaking') {
        let frontCar = null;
        for (let other of cars) {
            if (other === car) continue;
            if (checkCollisionBox(car, other, 120, 60, 60, 0)) {
                frontCar = other;
                break;
            }
        }
        
        if (!frontCar && car.overtakeTimer > 2.0) {
            car.overtakeState = 'returning';
        } else if (car.overtakeTimer > 4.0) {
            car.overtakeState = 'returning';
        }
        return { overtaking: true, targetLane: car.overtakeTargetLane, blocked: true };
    }
    
    if (car.overtakeState === 'returning') {
        if (Math.abs(car.laneOffset) < 0.2) {
            car.overtakeState = 'none';
            car.overtakeTargetLane = 0;
        }
        return { overtaking: false, targetLane: 0, blocked: false };
    }
    
    let frontCar = null;
    for (let other of cars) {
        if (other === car) continue;
        if (checkCollisionBox(car, other, 250, 60, 125, 0)) {
            if (car.speed > other.speed) {
                frontCar = other;
                break;
            }
        }
    }
    
    if (!frontCar) {
        return { overtaking: false, targetLane: 0, blocked: false };
    }
    
    let leftClear = true;
    let rightClear = true;
    
    for (let other of cars) {
        if (other === car || other === frontCar) continue;
        if (checkCollisionBox(car, other, 150, 100, 75, 50)) {
            leftClear = false;
        }
        if (checkCollisionBox(car, other, 150, 100, 75, -50)) {
            rightClear = false;
        }
    }
    
    let targetLane = 0;
    if (leftClear) {
        targetLane = 1;
    } else if (rightClear) {
        targetLane = -1;
    } else {
        return { overtaking: false, targetLane: 0, blocked: true };
    }
    
    car.overtakeState = 'changing';
    car.overtakeTargetLane = targetLane;
    car.overtakeTimer = 0;
    return { overtaking: true, targetLane: targetLane, blocked: true };
}

function updateLaneDecision(car, overtakeData, dt) {
    let maxLaneOffset = 1.0;
    
    if (overtakeData.overtaking || car.overtakeState === 'returning') {
        car.targetLaneOffset = clamp(overtakeData.targetLane, -maxLaneOffset, maxLaneOffset);
    } else if (!overtakeData.blocked) {
        car.targetLaneOffset = 0;
    }
    
    let lerpSpeed = (overtakeData.overtaking || car.overtakeState === 'returning') ? 0.15 : 0.08;
    car.laneOffset += (car.targetLaneOffset - car.laneOffset) * lerpSpeed;
    car.laneOffset = clamp(car.laneOffset, -maxLaneOffset, maxLaneOffset);
}

function updateFarNPC(car, dt) {
    car.currentPathIdx += Math.floor(car.speed * 0.5);
    car.currentPathIdx = clamp(car.currentPathIdx, 0, trackPath.length - 1);
    let p = trackPath[car.currentPathIdx];
    car.x = p.x;
    car.y = p.y;
    car.direction = p.dir;
}

// ==================== 小地图边界 ====================
let minimapBounds = { minTX: 0, maxTX: 0, minTY: 0, maxTY: 0, scale: 1, cx: 0, cy: 0 };

function computeMinimapBounds() {
    let minTX = Infinity, maxTX = -Infinity, minTY = Infinity, maxTY = -Infinity;
    for (let p of trackPath) {
        if (p.x < minTX) minTX = p.x;
        if (p.x > maxTX) maxTX = p.x;
        if (p.y < minTY) minTY = p.y;
        if (p.y > maxTY) maxTY = p.y;
    }
    let rangeX = maxTX - minTX || 1;
    let rangeY = maxTY - minTY || 1;
    let mapSize = 140;
    minimapBounds = {
        minTX: minTX, maxTX: maxTX, minTY: minTY, maxTY: maxTY,
        scale: (mapSize - 20) / Math.max(rangeX, rangeY),
        cx: (minTX + maxTX) / 2,
        cy: (minTY + maxTY) / 2
    };
}

// ==================== 分支路径 ====================
// 分支路径边界框
let branchBounds = [];

// 分支点查询的空间网格（替代线性扫描）
const BRANCH_GRID_SIZE = 100;
let branchGrid = {};

function branchGridKey(x, y) {
    return Math.floor(x / BRANCH_GRID_SIZE) + "_" + Math.floor(y / BRANCH_GRID_SIZE);
}

function buildBranchGrid() {
    branchGrid = {};
    let threshold = (BRANCH_WIDTH / 2 + 30);
    for (let i = 0; i < branchPaths.length; i++) {
        let bp = branchPaths[i];
        if (!bp.path) continue;
        // 每隔一个点采样到网格（密度足够）
        for (let j = 0; j < bp.path.length; j += 2) {
            let pt = bp.path[j];
            let key = branchGridKey(pt.x, pt.y);
            if (!branchGrid[key]) branchGrid[key] = [];
            branchGrid[key].push({ x: pt.x, y: pt.y, branchIdx: i, pointIdx: j });
        }
    }
}

// 分支检查的空间缓存
let branchCache = { x: 0, y: 0, result: false, age: 0 };
const BRANCH_CACHE_SIZE = 100;
const BRANCH_CACHE_MAX_AGE = 5;

function generateBranches() {
    // 为分支生成设置派生种子
    setDerivedSeed('BRANCHES');
    
    branchPaths = [];
    branchBounds = [];
    let totalPts = trackPath.length;
    let numBranches = randInt(14, 20);
    let usedZones = [];

    for (let b = 0; b < numBranches; b++) {
        let attempts = 0;
        while (attempts < 50) {
            attempts++;
            let startIdx = randInt(Math.floor(totalPts * 0.06), Math.floor(totalPts * 0.7));
            let tooClose = false;
            for (let uz of usedZones) {
                if (Math.abs(startIdx - uz) < totalPts * 0.08) { tooClose = true; break; }
            }
            if (tooClose) continue;

            let sp = trackPath[startIdx];
            let side = randSign();
            let branchNodes = [];

            let rejoinIdx = Math.min(startIdx + randInt(50, 120), totalPts - 30);
            let rp = trackPath[rejoinIdx];
            let midCount = randInt(8, 14);
            let offsetDist = randRange(300, 600);
            
            // 将分支起点延伸到主赛道（实现平滑连接）
            let extendDist = TRACK_WIDTH * 0.6;
            let startExtendX = sp.x - Math.cos(sp.dir) * extendDist;
            let startExtendY = sp.y - Math.sin(sp.dir) * extendDist;
            branchNodes.push({ x: startExtendX, y: startExtendY });
            
            // 原始起点
            branchNodes.push({ x: sp.x, y: sp.y });
            
            // 创建分支路径 - 先向外弯曲再弯回（大弧形）
            for (let i = 1; i < midCount; i++) {
                let t = i / midCount;
                let baseX = lerp(sp.x, rp.x, t);
                let baseY = lerp(sp.y, rp.y, t);
                
                // 从主路向外弯曲再弯回 - 创建大弧形
                // 使用sin(PI * t)使起点/终点偏移小，中间最大
                let curveOutFactor = Math.sin(t * Math.PI); // 0 -> 1 -> 0
                let perpX = sp.nx * side * offsetDist * curveOutFactor;
                let perpY = sp.ny * side * offsetDist * curveOutFactor;
                
                let bx = baseX + perpX;
                let by = baseY + perpY;
                branchNodes.push({ x: bx, y: by });
            }
            
            // 原始终点
            branchNodes.push({ x: rp.x, y: rp.y });
            
            // 将分支终点延伸到主赛道（实现平滑连接）
            let endExtendX = rp.x + Math.cos(rp.dir) * extendDist;
            let endExtendY = rp.y + Math.sin(rp.dir) * extendDist;
            branchNodes.push({ x: endExtendX, y: endExtendY });

            if (branchNodes.length < 3) continue;
            let bPath = buildTrackPath(branchNodes, false);
            if (bPath.length < 10) continue;

            let bHalf = BRANCH_WIDTH / 2;
            let bLeft = [], bRight = [];
            for (let p of bPath) {
                bLeft.push({ x: p.x + p.nx * bHalf, y: p.y + p.ny * bHalf });
                bRight.push({ x: p.x - p.nx * bHalf, y: p.y - p.ny * bHalf });
            }

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (let p of bPath) {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            }

            branchPaths.push({ path: bPath, leftEdge: bLeft, rightEdge: bRight, startIdx: startIdx, endIdx: rejoinIdx });
            branchBounds.push({ minX: minX - BRANCH_WIDTH, maxX: maxX + BRANCH_WIDTH, minY: minY - BRANCH_WIDTH, maxY: maxY + BRANCH_WIDTH });
            usedZones.push(startIdx);
            break;
        }
    }
}

// ==================== 场景 ====================
function isNearBranch(x, y, margin) {
    for (let i = 0; i < branchPaths.length; i++) {
        let bb = branchBounds[i];
        if (!bb) continue;
        let expandedMargin = BRANCH_WIDTH / 2 + margin;
        if (x < bb.minX - margin || x > bb.maxX + margin || y < bb.minY - margin || y > bb.maxY + margin) continue;
        
        let bp = branchPaths[i];
        if (!bp.path) continue;
        for (let j = 0; j < bp.path.length; j += 2) {
            let dx = x - bp.path[j].x;
            let dy = y - bp.path[j].y;
            if (dx * dx + dy * dy < expandedMargin ** 2) return true;
        }
    }
    return false;
}



function isInSelfIntersectionZone(x, y, margin) {
    if (selfIntersectionZones.length === 0) return false;
    
    // 找到最近的赛道点
    let closest = findClosestTrackPoint(x, y);
    let idx = closest.index;
    
    // 检查此索引是否在任何自相交区域内
    for (let zone of selfIntersectionZones) {
        if (idx >= zone.start - margin && idx <= zone.end + margin) {
            return true;
        }
    }
    return false;
}

const SCENERY_GRID_SIZE = 400;
let sceneryGrid = {};

function sceneryGridKey(x, y) {
    return Math.floor(x / SCENERY_GRID_SIZE) + "_" + Math.floor(y / SCENERY_GRID_SIZE);
}

function buildSceneryGrid() {
    sceneryGrid = {};
    for (let i = 0; i < sceneryItems.length; i++) {
        let item = sceneryItems[i];
        let key = sceneryGridKey(item.x, item.y);
        if (!sceneryGrid[key]) sceneryGrid[key] = [];
        sceneryGrid[key].push(i);
    }
}

function getSceneryNear(x, y, radius) {
    let result = [];
    let gxMin = Math.floor((x - radius) / SCENERY_GRID_SIZE);
    let gxMax = Math.floor((x + radius) / SCENERY_GRID_SIZE);
    let gyMin = Math.floor((y - radius) / SCENERY_GRID_SIZE);
    let gyMax = Math.floor((y + radius) / SCENERY_GRID_SIZE);
    for (let gx = gxMin; gx <= gxMax; gx++) {
        for (let gy = gyMin; gy <= gyMax; gy++) {
            let cell = sceneryGrid[gx + "_" + gy];
            if (cell) {
                for (let j = 0; j < cell.length; j++) {
                    result.push(sceneryItems[cell[j]]);
                }
            }
        }
    }
    return result;
}

                let peopleGroup = peoplePool.get();

                peopleGroup.y = sy;

                        color: ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c'][randInt(0,6)] });
                }

        for (let side = -1; side <= 1; side += 2) {
            if (Math.random() < 0.3) continue;
            let offsetDist = TRACK_WIDTH / 2 + randRange(60, 200);
            let sx = p.x + p.nx * offsetDist * side;

            if (isNearBranch(sx, sy, 80)) continue;

                let peopleGroup = peoplePool.get();
                peopleGroup.x = sx;
                peopleGroup.y = sy;
                peopleGroup.people = [];
                let count = randInt(6, 12);
                for (let pp = 0; pp < count; pp++) {
                    peopleGroup.people.push({ dx: randRange(-25, 25), dy: randRange(-25, 25),
                        color: ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c'][randInt(0,6)] });

                peopleGroup.lastVisibleTime = 0;

    // 在起点和终点线外侧添加树木（赛道外围）- 使用对象池

    let startP = trackPath[startIdx];
