function playCountdownBeep(isGo) {
    if (!audioCtx) return;
    try {
        let now = audioCtx.currentTime;
        let osc = audioCtx.createOscillator();
        osc.type = 'sine';
        let g = audioCtx.createGain();
        if (isGo) {
            // Higher pitch, longer, for "GO!"
            osc.frequency.setValueAtTime(523, now);
            osc.frequency.setTargetAtTime(659, now + 0.05, 0.03);
            g.gain.setValueAtTime(0.12, now);
            g.gain.setTargetAtTime(0.001, now + 0.35, 0.1);
            osc.connect(g); g.connect(masterCompressor);
            osc.start(now); osc.stop(now + 0.5);
        } else {
            // Short tick for 3-2-1
            osc.frequency.setValueAtTime(440, now);
            g.gain.setValueAtTime(0.1, now);
            g.gain.setTargetAtTime(0.001, now + 0.12, 0.04);
            osc.connect(g); g.connect(masterCompressor);
            osc.start(now); osc.stop(now + 0.2);
        }
    } catch(e) {}
}

// ==================== MATH HELPERS ====================
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
function dist(x1, y1, x2, y2) { return Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1)); }
function angleDiff(a, b) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
}
function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
}

// ==================== SEEDED RANDOM GENERATOR ====================
let currentSeed = null;
let seedRandomState = 0;
let useSeededRandom = false;

// Simple hash function for string seeds
function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & 0xFFFFFFFF; // Keep within 32 bits
    }
    return Math.abs(hash >>> 0); // Convert to unsigned 32-bit
}

// Set the seed for map generation
function setMapSeed(seed) {
    // Reset seed state first
    useSeededRandom = false;
    seedRandomState = 0;
    
    if (seed === null || seed === undefined || seed === '') {
        // Generate random seed
        seed = Math.floor(Math.random() * 1000000).toString(36).toUpperCase();
    }
    currentSeed = seed.toString().toUpperCase();
    // Initialize random state from seed
    let numericSeed = hashString(currentSeed);
    seedRandomState = numericSeed % 2147483647;
    if (seedRandomState <= 0) seedRandomState += 2147483646;
    useSeededRandom = true;
}

// Set a derived seed for a specific generation step
function setDerivedSeed(stepName) {
    if (!currentSeed) return;
    let combined = currentSeed + stepName;
    let numericSeed = hashString(combined);
    seedRandomState = numericSeed % 2147483647;
    if (seedRandomState <= 0) seedRandomState += 2147483646;
    console.log('Derived seed for', stepName, ':', seedRandomState);
}

// Get current map seed
function getMapSeed() {
    return currentSeed || 'RANDOM';
}

// Enable/disable seeded random
function enableSeededRandom(enable) {
    useSeededRandom = enable;
}

// Seeded random number generator (0 to 1)
function seededRandom() {
    seedRandomState = (seedRandomState * 16807) % 2147483647;
    return (seedRandomState - 1) / 2147483646;
}

// Seeded random range [a, b)
function randRange(a, b) {
    if (useSeededRandom) {
        return a + seededRandom() * (b - a);
    }
    return a + Math.random() * (b - a);
}

// Seeded random integer [a, b]
function randInt(a, b) {
    return Math.floor(randRange(a, b + 1));
}

// Seeded random boolean with given probability
function randBool(prob) {
    if (useSeededRandom) {
        return seededRandom() < prob;
    }
    return Math.random() < prob;
}

// Seeded random choice: -1 or 1
function randSign() {
    return randBool(0.5) ? 1 : -1;
}

function segmentIntersect(ax,ay,bx,by,cx,cy,dx,dy) {
    let denom = (bx-ax)*(dy-cy) - (by-ay)*(dx-cx);
    if (Math.abs(denom) < 1e-10) return false;
    let t = ((cx-ax)*(dy-cy) - (cy-ay)*(dx-cx)) / denom;
    let u = ((cx-ax)*(by-ay) - (cy-ay)*(bx-ax)) / denom;
    return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}

// ==================== CATMULL-ROM SPLINE ====================
function catmullRom(p0, p1, p2, p3, t) {
    let t2 = t * t, t3 = t2 * t;
    return {
        x: 0.5 * ((2*p1.x) + (-p0.x + p2.x)*t + (2*p0.x - 5*p1.x + 4*p2.x - p3.x)*t2 + (-p0.x + 3*p1.x - 3*p2.x + p3.x)*t3),
        y: 0.5 * ((2*p1.y) + (-p0.y + p2.y)*t + (2*p0.y - 5*p1.y + 4*p2.y - p3.y)*t2 + (-p0.y + 3*p1.y - 3*p2.y + p3.y)*t3)
    };
}

function catmullRomDerivative(p0, p1, p2, p3, t) {
    let t2 = t * t;
    return {
        x: 0.5 * ((-p0.x + p2.x) + (4*p0.x - 10*p1.x + 8*p2.x - 2*p3.x)*t + (-3*p0.x + 9*p1.x - 9*p2.x + 3*p3.x)*t2),
        y: 0.5 * ((-p0.y + p2.y) + (4*p0.y - 10*p1.y + 8*p2.y - 2*p3.y)*t + (-3*p0.y + 9*p1.y - 9*p2.y + 3*p3.y)*t2)
    };
}

// ==================== TRACK GENERATION ====================
function segmentsIntersect(a, b, c, d) {
    let denom = (b.x - a.x) * (d.y - c.y) - (b.y - a.y) * (d.x - c.x);
    if (Math.abs(denom) < 1e-10) return false;
    let t = ((c.x - a.x) * (d.y - c.y) - (c.y - a.y) * (d.x - c.x)) / denom;
    let u = ((c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x)) / denom;
    return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}

// Calculate distance from point to line segment
function pointToSegmentDistance(point, segStart, segEnd) {
    let dx = segEnd.x - segStart.x;
    let dy = segEnd.y - segStart.y;
    let lenSq = dx * dx + dy * dy;
    
    if (lenSq === 0) {
        let px = point.x - segStart.x;
        let py = point.y - segStart.y;
        return Math.sqrt(px * px + py * py);
    }
    
    let t = ((point.x - segStart.x) * dx + (point.y - segStart.y) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    
    let projX = segStart.x + t * dx;
    let projY = segStart.y + t * dy;
    
    let px = point.x - projX;
    let py = point.y - projY;
    
    return Math.sqrt(px * px + py * py);
}

// Check if path points have self-intersection
function pathHasIntersection(path, skipNearby) {
    let len = path.length;
    for (let i = 0; i < len - 1; i++) {
        for (let j = i + skipNearby; j < len - 1; j++) {
            if (segmentsIntersect(path[i], path[i + 1], path[j], path[j + 1])) {
                return true;
            }
        }
    }
    return false;
}

function generateSprintTrack() {
    // Reset all continuation states for new track
    window.arcContinuation = { count: 0, amount: 0 };
    window.hairpinContinuation = { count: 0, amount: 0 };
    window.bigTurnContinuation = { count: 0, amount: 0 };
    window.sCurveContinuation = { count: 0, amount: 0, phase: 0 };
    
    // Set derived seed for track generation
    setDerivedSeed('TRACK');
    
    let maxAttempts = 30;
    
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
        let nodeCount = randInt(100, 130);
        let nodes = [];
        let baseAngle = randRange(-Math.PI / 2, Math.PI / 2);
        let x = 0, y = 0;
        let valid = true;
        
        // Track if last segment was a curve to enforce longer straights after curves
        let lastWasCurve = false;
        let straightAfterCurveCount = 0;
        
        for (let i = 0; i < nodeCount && valid; i++) {
            nodes.push({ x: x, y: y });
            
            let segLen = randRange(600, 1000);
            let r = randRange(0, 1);
            let turnAmount;
            let isCurve = false;

            // If we just had a curve, 25% chance to enforce a longer straight section
            if (lastWasCurve && straightAfterCurveCount < 2 && randBool(0.25)) {
                // Force a straight section after curve (minimum 2 segments)
                turnAmount = 0;
                segLen = randRange(700, 1100);
                straightAfterCurveCount++;
                lastWasCurve = false;
            }
            // Hairpin turn (发卡弯) - 12% chance
            if (r < 0.12) {
                let hairpinDir = randSign();
                turnAmount = randRange(0.6, 0.9) * hairpinDir;
                segLen = randRange(400, 600);
                isCurve = true;
                // Mark for hairpin continuation - opposite direction next
                if (!window.hairpinContinuation) window.hairpinContinuation = { count: 0, amount: 0 };
                window.hairpinContinuation.count = randInt(2, 3);
                window.hairpinContinuation.amount = -turnAmount * 0.7; // Opposite direction, slightly less
            }
            // Continue hairpin turn (second part of U-shape)
            else if (window.hairpinContinuation && window.hairpinContinuation.count > 0) {
                turnAmount = window.hairpinContinuation.amount;
                segLen = randRange(400, 600);
                isCurve = true;
                window.hairpinContinuation.count--;
            }
            // Big 90-degree turn for square-like track (25% chance)
            else if (r < 0.37) {
                let turnDir = randSign();
                turnAmount = randRange(0.8, 1.2) * turnDir; // Large turn angle
                segLen = randRange(600, 900);
                isCurve = true;
                if (!window.bigTurnContinuation) window.bigTurnContinuation = { count: 0, amount: 0 };
                window.bigTurnContinuation.count = 1;
                window.bigTurnContinuation.amount = turnAmount;
            }
            // Continue big turn - straight section to complete 90-degree
            else if (window.bigTurnContinuation && window.bigTurnContinuation.count > 0) {
                turnAmount = 0;
                segLen = randRange(600, 900); // Increased from 500-700
                window.bigTurnContinuation.count = 0;
            }
            // Large arc / near-circle curve (5% chance)
            else if (r < 0.42) {
                // Generate a continuous arc by setting a consistent small turn
                // This creates near-circular large radius curves
                let arcDir = randSign();
                turnAmount = randRange(0.08, 0.15) * arcDir;
                segLen = randRange(500, 800);
                isCurve = true;
                // Mark for continuation in next segments
                if (!window.arcContinuation) window.arcContinuation = { count: 0, amount: 0 };
                window.arcContinuation.count = randInt(3, 6);
                window.arcContinuation.amount = turnAmount;
            }
            // Continue previous arc
            else if (window.arcContinuation && window.arcContinuation.count > 0) {
                turnAmount = window.arcContinuation.amount;
                segLen = randRange(500, 800);
                isCurve = true;
                window.arcContinuation.count--;
            }
            // S-curve pattern - realistic S-bend (first turn) - 13% chance
            else if (r < 0.55) {
                turnAmount = randRange(0.7, 1.0) * randSign();
                if (!window.sCurveContinuation) window.sCurveContinuation = { count: 0, amount: 0, phase: 0 };
                window.sCurveContinuation.count = 1;
                window.sCurveContinuation.amount = turnAmount > 0 ? 1 : -1;
                window.sCurveContinuation.phase = 'turn1';
                segLen = randRange(500, 700);
                isCurve = true;
            }
            // S-curve - straight middle section
            else if (window.sCurveContinuation && window.sCurveContinuation.count > 0 && window.sCurveContinuation.phase === 'turn1') {
                turnAmount = 0;
                segLen = randRange(500, 700); // Increased from 400-600
                window.sCurveContinuation.count = 1;
                window.sCurveContinuation.phase = 'straight';
            }
            // S-curve - second opposite turn
            else if (window.sCurveContinuation && window.sCurveContinuation.count > 0 && window.sCurveContinuation.phase === 'straight') {
                turnAmount = randRange(0.7, 1.0) * (window.sCurveContinuation.amount > 0 ? -1 : 1);
                segLen = randRange(500, 700);
                window.sCurveContinuation.count = 0;
                window.sCurveContinuation.phase = 0;
                isCurve = true;
            }
            // Long straight (10% chance)
            else if (r < 0.65) {
                turnAmount = 0;
                segLen = randRange(800, 1200);
            }
            // Gentle curves (15% chance)
            else if (r < 0.80) {
                turnAmount = randRange(-0.35, 0.35);
                isCurve = Math.abs(turnAmount) > 0.15;
            }
            // Sharper turns (remaining chance)
            else {
                turnAmount = randRange(-0.5, 0.5);
                isCurve = Math.abs(turnAmount) > 0.15;
            }
            
            // Update curve tracking
            if (isCurve) {
                lastWasCurve = true;
                straightAfterCurveCount = 0;
            }
            
            let newAngle = baseAngle + turnAmount;
            let nx = x + Math.cos(newAngle) * segLen;
            let ny = y + Math.sin(newAngle) * segLen;
            
            // Self-intersection check on nodes (skip last 8 segments for better detection)
            let hasIntersection = false;
            if (nodes.length > 10) {
                let newSegStart = { x: x, y: y };
                let newSegEnd = { x: nx, y: ny };
                
                for (let j = 0; j < nodes.length - 8; j++) {
                    if (segmentsIntersect(nodes[j], nodes[j + 1], newSegStart, newSegEnd)) {
                        hasIntersection = true;
                        break;
                    }
                }
                
                // Also check if new segment comes too close to existing nodes (proximity check)
                if (!hasIntersection) {
                    for (let j = 0; j < nodes.length - 8; j++) {
                        let node = nodes[j];
                        let dist = pointToSegmentDistance(node, newSegStart, newSegEnd);
                        if (dist < TRACK_WIDTH * 0.6) {
                            hasIntersection = true;
                            break;
                        }
                    }
                }
            }
            
            if (hasIntersection) {
                // Try to find a valid direction with more retries
                let found = false;
                for (let retry = 0; retry < 15; retry++) {
                    turnAmount = randRange(-0.4, 0.4);
                    newAngle = baseAngle + turnAmount;
                    nx = x + Math.cos(newAngle) * segLen;
                    ny = y + Math.sin(newAngle) * segLen;
                    
                    hasIntersection = false;
                    let newSegStart = { x: x, y: y };
                    let newSegEnd = { x: nx, y: ny };
                    
                    for (let j = 0; j < nodes.length - 8; j++) {
                        if (segmentsIntersect(nodes[j], nodes[j + 1], newSegStart, newSegEnd)) {
                            hasIntersection = true;
                            break;
                        }
                    }
                    
                    // Also check proximity in retry
                    if (!hasIntersection) {
                        for (let j = 0; j < nodes.length - 8; j++) {
                            let node = nodes[j];
                            let dist = pointToSegmentDistance(node, newSegStart, newSegEnd);
                            if (dist < TRACK_WIDTH * 0.6) {
                                hasIntersection = true;
                                break;
                            }
                        }
                    }
                    
                    if (!hasIntersection) {
                        found = true;
                        break;
                    }
                }
                
                if (!found) {
                    // Continue in same direction
                    nx = x + Math.cos(baseAngle) * segLen;
                    ny = y + Math.sin(baseAngle) * segLen;
                    newAngle = baseAngle;
                }
            }
            
            x = nx;
            y = ny;
            baseAngle = newAngle;
        }
        
        // Build path and verify no intersection
        let testPath = buildTrackPath(nodes, false);
        
        // Check path for intersections (skip nearby segments - 50 points apart for stricter check)
        if (!pathHasIntersection(testPath, 50)) {
            return nodes;
        }
    }
    
    // Fallback: return a track with curves
    let nodes = [];
    let x = 0, y = 0, angle = 0;
    let curvePhase = 0;
    for (let i = 0; i < 80; i++) {
        nodes.push({ x: x, y: y });

        // Add some curves to fallback track
        if (i % 15 === 5) {
            // S-curve turn
            angle += randRange(0.6, 0.9) * randSign();
        } else if (i % 15 === 10) {
            // Opposite turn
            angle += randRange(0.6, 0.9) * randSign();
        } else {
            // Gentle variation
            angle += randRange(-0.15, 0.15);
        }

        x += Math.cos(angle) * 500;
        y += Math.sin(angle) * 500;
    }
    return nodes;
}

function buildTrackPath(nodes, closed) {
    let path = [];
    let n = nodes.length;
    let segCount = closed ? n : n - 1;
    for (let i = 0; i < segCount; i++) {
        let p0, p1, p2, p3;
        if (closed) {
            p0 = nodes[((i - 1) % n + n) % n];
            p1 = nodes[i % n];
            p2 = nodes[(i + 1) % n];
            p3 = nodes[(i + 2) % n];
        } else {
            p0 = nodes[Math.max(0, i - 1)];
            p1 = nodes[i];
            p2 = nodes[Math.min(n - 1, i + 1)];
            p3 = nodes[Math.min(n - 1, i + 2)];
        }
        for (let j = 0; j < SPLINE_SEGMENTS; j++) {
            let t = j / SPLINE_SEGMENTS;
            let pt = catmullRom(p0, p1, p2, p3, t);
            let dv = catmullRomDerivative(p0, p1, p2, p3, t);
            let len = Math.sqrt(dv.x * dv.x + dv.y * dv.y);
            if (len < 0.001) len = 0.001;
            let nx = -dv.y / len;
            let ny = dv.x / len;
            let dir = Math.atan2(dv.y, dv.x);
            path.push({ x: pt.x, y: pt.y, nx: nx, ny: ny, dir: dir });
        }
    }
    if (!closed) {
        let lastNode = nodes[n - 1];
        let prevPt = path[path.length - 1];
        let dx = lastNode.x - prevPt.x;
        let dy = lastNode.y - prevPt.y;
        let len = Math.sqrt(dx*dx + dy*dy);
        if (len < 0.001) len = 0.001;
        path.push({ x: lastNode.x, y: lastNode.y, nx: -dy / len, ny: dx / len, dir: Math.atan2(dy, dx) });
    }
    return path;
}

function buildEdges(path) {
    let left = [], right = [];
    let halfWidth = TRACK_WIDTH / 2;
    for (let i = 0; i < path.length; i++) {
        let p = path[i];
        left.push({ x: p.x + p.nx * halfWidth, y: p.y + p.ny * halfWidth });
        right.push({ x: p.x - p.nx * halfWidth, y: p.y - p.ny * halfWidth });
    }
    return { left, right };
}



// Detect self-intersections in the main track and return exclusion zones
function detectSelfIntersections(pathLength) {
    let zones = [];
    let checkInterval = Math.max(50, Math.floor(pathLength / 20)); // Check every 50 points
    let searchRadius = 150; // Search for intersections within this range
    
    for (let i = 0; i < pathLength; i += checkInterval) {
        let p1 = trackPath[i];
        if (!p1) continue;
        
        // Look for other points that are close but far in index (not adjacent)
        for (let j = i + searchRadius; j < Math.min(pathLength, i + searchRadius * 3); j++) {
            let p2 = trackPath[j];
            if (!p2) continue;
            
            let dx = p1.x - p2.x;
            let dy = p1.y - p2.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            
            // If points are close but far apart in index, it's a self-intersection
            if (dist < TRACK_WIDTH * 2.5) {
                // Create exclusion zone around both points
                let zoneSize = 50;
                zones.push({
                    start: Math.max(0, i - zoneSize),
                    end: Math.min(pathLength, i + zoneSize)
                });
                zones.push({
                    start: Math.max(0, j - zoneSize),
                    end: Math.min(pathLength, j + zoneSize)
                });
            }
        }
    }
    
    // Merge overlapping zones
    if (zones.length === 0) return [];
    
    zones.sort((a, b) => a.start - b.start);
    let merged = [zones[0]];
    for (let i = 1; i < zones.length; i++) {
        let last = merged[merged.length - 1];
        let curr = zones[i];
        if (curr.start <= last.end) {
            last.end = Math.max(last.end, curr.end);
        } else {
            merged.push(curr);
        }
    }
    
    return merged;
}

// Global variable to store self-intersection zones
let selfIntersectionZones = [];

function generateTrack() {
    trackNodes = generateSprintTrack();
    trackPath = buildTrackPath(trackNodes, false);
    let edges = buildEdges(trackPath);
    trackLeftEdge = edges.left;
    trackRightEdge = edges.right;
    buildTrackGrid();
    generateBranches();
    buildBranchGrid();
    selfIntersectionZones = detectSelfIntersections(trackPath.length);
    generateScenery();
    computeMinimapBounds();
    preprocessTrack(trackPath);
}

function preprocessTrack(trackPath) {
    for (let i = 0; i < trackPath.length; i++) {
        let p = trackPath[i];
        let next = trackPath[Math.min(i + 1, trackPath.length - 1)];
        let dx = next.x - p.x;
        let dy = next.y - p.y;
        p.dir = Math.atan2(dy, dx);
        let look = trackPath[Math.min(i + 6, trackPath.length - 1)];
        let d = angleDiff(p.dir, look.dir);
        p.curvature = Math.abs(d);
    }
}

function updateClosestPath(car) {
    let bestIdx = car.currentPathIdx;
    let bestDist = Infinity;
    for (let i = -5; i <= 5; i++) {
        let idx = clamp(car.currentPathIdx + i, 0, trackPath.length - 1);
        let dx = car.x - trackPath[idx].x;
        let dy = car.y - trackPath[idx].y;
        let d = dx * dx + dy * dy;
        if (d < bestDist) {
            bestDist = d;
            bestIdx = idx;
        }
    }
    car.currentPathIdx = bestIdx;
}

function computeDrivingTarget(car) {
    let speedRatio = car.speed / car.maxSpeed;
    let currentIdx = car.currentPathIdx;
    
    let lookAheadDist = 3 + Math.floor(speedRatio * 3);
    let targetIdx = Math.min(currentIdx + lookAheadDist, trackPath.length - 1);
    
    let offset = car.laneOffset * TRACK_WIDTH * 0.2;
    let target = trackPath[targetIdx];
    let tx = target.x - Math.sin(target.dir) * offset;
    let ty = target.y + Math.cos(target.dir) * offset;
    return { x: tx, y: ty, idx: targetIdx };
}

function computeTargetSpeed(car, targetIdx) {
    let curve = trackPath[targetIdx].curvature;
    let curveFactor = clamp(1 - curve * 1.2, 0.6, 1);
    let skillFactor = lerp(0.9, 1.05, car.skill);
    return car.maxSpeed * curveFactor * skillFactor;
}

function checkCollisionBox(car, other, boxLength, boxWidth, offsetX, offsetY) {
    let cosDir = Math.cos(car.direction);
    let sinDir = Math.sin(car.direction);
    
    let boxCenterX = car.x + cosDir * offsetX - sinDir * offsetY;
    let boxCenterY = car.y + sinDir * offsetX + cosDir * offsetY;
    
    let dx = other.x - boxCenterX;
    let dy = other.y - boxCenterY;
    
    let localX = dx * cosDir + dy * sinDir;
    let localY = -dx * sinDir + dy * cosDir;
    
    return Math.abs(localX) < boxLength / 2 + other.length / 2 &&
           Math.abs(localY) < boxWidth / 2 + other.width / 2;
}

function computeOvertaking(car, dt) {
    if (!car.overtakeState) {
        car.overtakeState = 'none';
        car.overtakeTargetLane = 0;
        car.overtakeTimer = 0;
    }
    
    car.overtakeTimer += dt;
    
    if (car.overtakeState === 'changing') {
        if (Math.abs(car.laneOffset - car.overtakeTargetLane) < 0.2) {
            car.overtakeState = 'overtaking';
        }
        return { overtaking: true, targetLane: car.overtakeTargetLane, blocked: true };
    }
    
    if (car.overtakeState === 'overtaking') {
        let frontCar = null;
        for (let other of cars) {
            if (other === car) continue;
            if (checkCollisionBox(car, other, 120, 60, 60, 0)) {
                frontCar = other;
                break;
            }
        }
        
        if (!frontCar && car.overtakeTimer > 2.0) {
            car.overtakeState = 'returning';
        } else if (car.overtakeTimer > 4.0) {
            car.overtakeState = 'returning';
        }
        return { overtaking: true, targetLane: car.overtakeTargetLane, blocked: true };
    }
    
    if (car.overtakeState === 'returning') {
        if (Math.abs(car.laneOffset) < 0.2) {
            car.overtakeState = 'none';
            car.overtakeTargetLane = 0;
        }
        return { overtaking: false, targetLane: 0, blocked: false };
    }
    
    let frontCar = null;
    for (let other of cars) {
        if (other === car) continue;
        if (checkCollisionBox(car, other, 250, 60, 125, 0)) {
            if (car.speed > other.speed) {
                frontCar = other;
                break;
            }
        }
    }
    
    if (!frontCar) {
        return { overtaking: false, targetLane: 0, blocked: false };
    }
    
    let leftClear = true;
    let rightClear = true;
    
    for (let other of cars) {
        if (other === car || other === frontCar) continue;
        if (checkCollisionBox(car, other, 150, 100, 75, 50)) {
            leftClear = false;
        }
        if (checkCollisionBox(car, other, 150, 100, 75, -50)) {
            rightClear = false;
        }
    }
    
    let targetLane = 0;
    if (leftClear) {
        targetLane = 1;
    } else if (rightClear) {
        targetLane = -1;
    } else {
        return { overtaking: false, targetLane: 0, blocked: true };
    }
    
    car.overtakeState = 'changing';
    car.overtakeTargetLane = targetLane;
    car.overtakeTimer = 0;
    return { overtaking: true, targetLane: targetLane, blocked: true };
}

function updateLaneDecision(car, overtakeData, dt) {
    let maxLaneOffset = 1.0;
    
    if (overtakeData.overtaking || car.overtakeState === 'returning') {
        car.targetLaneOffset = clamp(overtakeData.targetLane, -maxLaneOffset, maxLaneOffset);
    } else if (!overtakeData.blocked) {
        car.targetLaneOffset = 0;
    }
    
    let lerpSpeed = (overtakeData.overtaking || car.overtakeState === 'returning') ? 0.15 : 0.08;
    car.laneOffset += (car.targetLaneOffset - car.laneOffset) * lerpSpeed;
    car.laneOffset = clamp(car.laneOffset, -maxLaneOffset, maxLaneOffset);
}

function updateFarNPC(car, dt) {
    car.currentPathIdx += Math.floor(car.speed * 0.5);
    car.currentPathIdx = clamp(car.currentPathIdx, 0, trackPath.length - 1);
    let p = trackPath[car.currentPathIdx];
    car.x = p.x;
    car.y = p.y;
    car.direction = p.dir;
}

// ==================== MINIMAP BOUNDS ====================
let minimapBounds = { minTX: 0, maxTX: 0, minTY: 0, maxTY: 0, scale: 1, cx: 0, cy: 0 };

function computeMinimapBounds() {
    let minTX = Infinity, maxTX = -Infinity, minTY = Infinity, maxTY = -Infinity;
    for (let p of trackPath) {
        if (p.x < minTX) minTX = p.x;
        if (p.x > maxTX) maxTX = p.x;
        if (p.y < minTY) minTY = p.y;
        if (p.y > maxTY) maxTY = p.y;
    }
    let rangeX = maxTX - minTX || 1;
    let rangeY = maxTY - minTY || 1;
    let mapSize = 140;
    minimapBounds = {
        minTX: minTX, maxTX: maxTX, minTY: minTY, maxTY: maxTY,
        scale: (mapSize - 20) / Math.max(rangeX, rangeY),
        cx: (minTX + maxTX) / 2,
        cy: (minTY + maxTY) / 2
    };
}

// ==================== BRANCH PATHS ====================
// Branch path bounding boxes
let branchBounds = [];

// Spatial grid for branch point lookups (replaces linear scan)
const BRANCH_GRID_SIZE = 100;
let branchGrid = {};

function branchGridKey(x, y) {
    return Math.floor(x / BRANCH_GRID_SIZE) + "_" + Math.floor(y / BRANCH_GRID_SIZE);
}

function buildBranchGrid() {
    branchGrid = {};
    let threshold = (BRANCH_WIDTH / 2 + 30);
    for (let i = 0; i < branchPaths.length; i++) {
        let bp = branchPaths[i];
        if (!bp.path) continue;
        // Sample every other point for grid (density is sufficient)
        for (let j = 0; j < bp.path.length; j += 2) {
            let pt = bp.path[j];
            let key = branchGridKey(pt.x, pt.y);
            if (!branchGrid[key]) branchGrid[key] = [];
            branchGrid[key].push({ x: pt.x, y: pt.y, branchIdx: i, pointIdx: j });
        }
    }
}

// Spatial cache for branch checking
let branchCache = { x: 0, y: 0, result: false, age: 0 };
const BRANCH_CACHE_SIZE = 100;
const BRANCH_CACHE_MAX_AGE = 5;

function generateBranches() {
    // Set derived seed for branch generation
    setDerivedSeed('BRANCHES');
    
    branchPaths = [];
    branchBounds = [];
    let totalPts = trackPath.length;
    let numBranches = randInt(14, 20);
    let usedZones = [];

    for (let b = 0; b < numBranches; b++) {
        let attempts = 0;
        while (attempts < 50) {
            attempts++;
            let startIdx = randInt(Math.floor(totalPts * 0.06), Math.floor(totalPts * 0.7));
            let tooClose = false;
            for (let uz of usedZones) {
                if (Math.abs(startIdx - uz) < totalPts * 0.08) { tooClose = true; break; }
            }
            if (tooClose) continue;

            let sp = trackPath[startIdx];
            let side = randSign();
            let branchNodes = [];

            let rejoinIdx = Math.min(startIdx + randInt(50, 120), totalPts - 30);
            let rp = trackPath[rejoinIdx];
            let midCount = randInt(8, 14);
            let offsetDist = randRange(300, 600);
            
            // Extend branch start point into main track (for smooth connection)
            let extendDist = TRACK_WIDTH * 0.6;
            let startExtendX = sp.x - Math.cos(sp.dir) * extendDist;
            let startExtendY = sp.y - Math.sin(sp.dir) * extendDist;
            branchNodes.push({ x: startExtendX, y: startExtendY });
            
            // Original start point
            branchNodes.push({ x: sp.x, y: sp.y });
            
            // Create branch paths - curve out then curve back (large arc)
            for (let i = 1; i < midCount; i++) {
                let t = i / midCount;
                let baseX = lerp(sp.x, rp.x, t);
                let baseY = lerp(sp.y, rp.y, t);
                
                // Curve out from main road then curve back - creates large arc
                // Use sin(PI * t) to have small offset at start/end, max at middle
                let curveOutFactor = Math.sin(t * Math.PI); // 0 -> 1 -> 0
                let perpX = sp.nx * side * offsetDist * curveOutFactor;
                let perpY = sp.ny * side * offsetDist * curveOutFactor;
                
                let bx = baseX + perpX;
                let by = baseY + perpY;
                branchNodes.push({ x: bx, y: by });
            }
            
            // Original end point
            branchNodes.push({ x: rp.x, y: rp.y });
            
            // Extend branch end point into main track (for smooth connection)
            let endExtendX = rp.x + Math.cos(rp.dir) * extendDist;
            let endExtendY = rp.y + Math.sin(rp.dir) * extendDist;
            branchNodes.push({ x: endExtendX, y: endExtendY });

            if (branchNodes.length < 3) continue;
            let bPath = buildTrackPath(branchNodes, false);
            if (bPath.length < 10) continue;

            let bHalf = BRANCH_WIDTH / 2;
            let bLeft = [], bRight = [];
            for (let p of bPath) {
                bLeft.push({ x: p.x + p.nx * bHalf, y: p.y + p.ny * bHalf });
                bRight.push({ x: p.x - p.nx * bHalf, y: p.y - p.ny * bHalf });
            }

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (let p of bPath) {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            }

            branchPaths.push({ path: bPath, leftEdge: bLeft, rightEdge: bRight, startIdx: startIdx, endIdx: rejoinIdx });
            branchBounds.push({ minX: minX - BRANCH_WIDTH, maxX: maxX + BRANCH_WIDTH, minY: minY - BRANCH_WIDTH, maxY: maxY + BRANCH_WIDTH });
            usedZones.push(startIdx);
            break;
        }
    }
}

// ==================== SCENERY ====================
function isNearBranch(x, y, margin) {
    for (let i = 0; i < branchPaths.length; i++) {
        let bb = branchBounds[i];
        if (!bb) continue;
        let expandedMargin = BRANCH_WIDTH / 2 + margin;
        if (x < bb.minX - margin || x > bb.maxX + margin || y < bb.minY - margin || y > bb.maxY + margin) continue;
        
        let bp = branchPaths[i];
        if (!bp.path) continue;
        for (let j = 0; j < bp.path.length; j += 2) {
            let dx = x - bp.path[j].x;
            let dy = y - bp.path[j].y;
            if (dx * dx + dy * dy < expandedMargin ** 2) return true;
        }
    }
    return false;
}



function isInSelfIntersectionZone(x, y, margin) {
    if (selfIntersectionZones.length === 0) return false;
    
    // Find closest track point
    let closest = findClosestTrackPoint(x, y);
    let idx = closest.index;
    
    // Check if this index is in any self-intersection zone
    for (let zone of selfIntersectionZones) {
        if (idx >= zone.start - margin && idx <= zone.end + margin) {
            return true;
        }
    }
    return false;
}

// ==================== SCENERY SPATIAL GRID ====================
const SCENERY_GRID_SIZE = 400;
let sceneryGrid = {};

function sceneryGridKey(x, y) {
    return Math.floor(x / SCENERY_GRID_SIZE) + "_" + Math.floor(y / SCENERY_GRID_SIZE);
}

function buildSceneryGrid() {
    sceneryGrid = {};
    for (let i = 0; i < sceneryItems.length; i++) {
        let item = sceneryItems[i];
        let key = sceneryGridKey(item.x, item.y);
        if (!sceneryGrid[key]) sceneryGrid[key] = [];
        sceneryGrid[key].push(i);
    }
}

function getSceneryNear(x, y, radius) {
    let result = [];
    let gxMin = Math.floor((x - radius) / SCENERY_GRID_SIZE);
    let gxMax = Math.floor((x + radius) / SCENERY_GRID_SIZE);
    let gyMin = Math.floor((y - radius) / SCENERY_GRID_SIZE);
    let gyMax = Math.floor((y + radius) / SCENERY_GRID_SIZE);
    for (let gx = gxMin; gx <= gxMax; gx++) {
        for (let gy = gyMin; gy <= gyMax; gy++) {
            let cell = sceneryGrid[gx + "_" + gy];
            if (cell) {
                for (let j = 0; j < cell.length; j++) {
                    result.push(sceneryItems[cell[j]]);
                }
            }
        }
    }
    return result;
}

function generateScenery() {
    sceneryItems = [];
    let step = Math.max(1, Math.floor(trackPath.length / 1200));

    // Disable seeded random for scenery (trees, people are not seed-controlled)
    let wasSeeded = useSeededRandom;
    let savedSeedState = seedRandomState;
    enableSeededRandom(false);

    // Generate trees and people - using object pool
    for (let i = 0; i < trackPath.length; i += step) {
        let p = trackPath[i];
        for (let side = -1; side <= 1; side += 2) {
            if (Math.random() < 0.02) continue;
            let offsetDist = TRACK_WIDTH / 2 + randRange(40, 320);
            let sx = p.x + p.nx * offsetDist * side;
            let sy = p.y + p.ny * offsetDist * side;

            if (isNearBranch(sx, sy, 80)) continue;
            if (isInSelfIntersectionZone(sx, sy, 2)) continue;

            let closestPt = findClosestTrackPoint(sx, sy);
            let distToTrack = Math.abs(getTrackDistance(sx, sy, closestPt.index));
            if (distToTrack < TRACK_WIDTH / 2 + 15) continue;

            let r = Math.random();
            if (r < 0.92) {
                let tree = treePool.get();
                tree.x = sx;
                tree.y = sy;
                tree.size = randRange(20, 40);
                tree.shade = randRange(0.7, 1.0);
                tree.cachedColor = 'rgba(46,' + Math.floor(139 * tree.shade) + ',56,0.9)';
                tree.visible = false;
                tree.lastVisibleTime = 0;
                sceneryItems.push(tree);
            } else {
                let peopleGroup = peoplePool.get();
                peopleGroup.x = sx;
                peopleGroup.y = sy;
                peopleGroup.people = [];
                let count = randInt(4, 9);
                for (let pp = 0; pp < count; pp++) {
                    peopleGroup.people.push({ dx: randRange(-18, 18), dy: randRange(-18, 18),
                        color: ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c'][randInt(0,6)] });
                }
                peopleGroup.visible = false;
                peopleGroup.lastVisibleTime = 0;
                sceneryItems.push(peopleGroup);
            }
        }
    }
    
    // Restore seeded random state
    enableSeededRandom(wasSeeded);
    seedRandomState = savedSeedState;

    // Safety pass: remove any tree/people that ended up overlapping road or branch - return to pool
    let safeItems = [];
    for (let i = 0; i < sceneryItems.length; i++) {
        let item = sceneryItems[i];
        let cp = findClosestTrackPoint(item.x, item.y);
        let td = Math.abs(getTrackDistance(item.x, item.y, cp.index));
        if (td < TRACK_WIDTH / 2 + 10) {
            if (item.type === 'tree') {
                treePool.release(item);
            } else if (item.type === 'people') {
                peoplePool.release(item);
            }
            continue;
        }
        if (isOnBranch(item.x, item.y)) {
            if (item.type === 'tree') {
                treePool.release(item);
            } else if (item.type === 'people') {
                peoplePool.release(item);
            }
            continue;
        }
        safeItems.push(item);
    }
    sceneryItems = safeItems;

    // Add extra people near start and finish lines - using object pool
    const startFinishRange = 150; // distance in meters
    const startIdx = 0;
    const finishIdx = trackPath.length - 1;

    // Start line area
    for (let i = Math.max(0, startIdx - 5); i <= Math.min(trackPath.length - 1, startIdx + 5); i++) {
        let p = trackPath[i];
        for (let side = -1; side <= 1; side += 2) {
            if (Math.random() < 0.3) continue;
            let offsetDist = TRACK_WIDTH / 2 + randRange(60, 200);
            let sx = p.x + p.nx * offsetDist * side;
            let sy = p.y + p.ny * offsetDist * side;

            if (isNearBranch(sx, sy, 80)) continue;
            if (isInSelfIntersectionZone(sx, sy, 2)) continue;

            let closestPt = findClosestTrackPoint(sx, sy);
            let distToTrack = Math.abs(getTrackDistance(sx, sy, closestPt.index));
            if (distToTrack < TRACK_WIDTH / 2 + 15) continue;

            
                let peopleGroup = peoplePool.get();
                peopleGroup.x = sx;
                peopleGroup.y = sy;
                peopleGroup.people = [];
                let count = randInt(6, 12);
                for (let pp = 0; pp < count; pp++) {
                    peopleGroup.people.push({ dx: randRange(-25, 25), dy: randRange(-25, 25),
                        color: ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c'][randInt(0,6)] });
                }
                peopleGroup.visible = false;
                peopleGroup.lastVisibleTime = 0;
                sceneryItems.push(peopleGroup);
        }
    }

    // Finish line area
    for (let i = Math.max(0, finishIdx - 5); i <= Math.min(trackPath.length - 1, finishIdx + 5); i++) {
        let p = trackPath[i];
        for (let side = -1; side <= 1; side += 2) {
            if (Math.random() < 0.3) continue;
            let offsetDist = TRACK_WIDTH / 2 + randRange(60, 200);
            let sx = p.x + p.nx * offsetDist * side;
            let sy = p.y + p.ny * offsetDist * side;

            if (isNearBranch(sx, sy, 80)) continue;
            if (isInSelfIntersectionZone(sx, sy, 2)) continue;

            let closestPt = findClosestTrackPoint(sx, sy);
            let distToTrack = Math.abs(getTrackDistance(sx, sy, closestPt.index));
            if (distToTrack < TRACK_WIDTH / 2 + 15) continue;

            
                let peopleGroup = peoplePool.get();
                peopleGroup.x = sx;
                peopleGroup.y = sy;
                peopleGroup.people = [];
                let count = randInt(6, 12);
                for (let pp = 0; pp < count; pp++) {
                    peopleGroup.people.push({ dx: randRange(-25, 25), dy: randRange(-25, 25),
                        color: ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c'][randInt(0,6)] });
                }
                peopleGroup.visible = false;
                peopleGroup.lastVisibleTime = 0;
                sceneryItems.push(peopleGroup);
        }
    }

    // Add trees outside start and finish lines (beyond the track) - using object pool
    // Start line outer trees - before the start line in a circular arc
    let startP = trackPath[startIdx];
    let startDir = startP.dir;
    
    // Circular arc around start line
    const startArcRadius = 250;
    const startTreeCount = 18;
    
    for (let i = 0; i < startTreeCount; i++) {
        // Calculate angle for circular distribution
        let angleOffset = (i / startTreeCount) * Math.PI * 1.5 - Math.PI * 0.75; // 135-degree arc
        let angle = startDir + Math.PI + angleOffset; // Opposite direction of track
        
        let distance = startArcRadius + randRange(-50, 50); // Slight variation in distance
        let sx = startP.x + Math.cos(angle) * distance;
        let sy = startP.y + Math.sin(angle) * distance;
        
        // Ensure trees are outside track
        let closest = findClosestTrackPoint(sx, sy);
        let distToTrack = Math.abs(getTrackDistance(sx, sy, closest.index));
        if (distToTrack < TRACK_WIDTH / 2 + 30) continue; // Keep trees outside track
        
        // Skip if tree would overlap with road
        if (distToTrack < TRACK_WIDTH / 2 + 40) continue;
        
        let tree = treePool.get();
        tree.x = sx;
        tree.y = sy;
        tree.size = randRange(25, 50);
        tree.shade = randRange(0.7, 1.0);
        tree.cachedColor = 'rgba(46,' + Math.floor(139 * tree.shade) + ',56,0.9)';
        tree.visible = false;
        tree.lastVisibleTime = 0;
        sceneryItems.push(tree);
    }

    // Finish line outer trees - beyond the finish line in a circular arc
    let finishP = trackPath[finishIdx];
    let finishDir = finishP.dir;
    
    // Circular arc around finish line (expanded)
    const finishArcRadius = 400; // Increased radius to 400
    const finishTreeCount = 24; // Increased tree count
    
    for (let i = 0; i < finishTreeCount; i++) {
        // Calculate angle for circular distribution - expanded arc
        let angleOffset = (i / finishTreeCount) * Math.PI * 2 - Math.PI; // 180-degree arc (semi-circle)
        let angle = finishDir + angleOffset; // Same direction as track
        
        let distance = finishArcRadius + randRange(-100, 100); // More variation in distance
        let sx = finishP.x + Math.cos(angle) * distance;
        let sy = finishP.y + Math.sin(angle) * distance;
        
        // Ensure trees are outside track
        let closest = findClosestTrackPoint(sx, sy);
        let distToTrack = Math.abs(getTrackDistance(sx, sy, closest.index));
        if (distToTrack < TRACK_WIDTH / 2 + 50) continue; // Keep trees further outside track
        
        // Skip if tree would overlap with road
        if (distToTrack < TRACK_WIDTH / 2 + 60) continue;
        
        let tree = treePool.get();
        tree.x = sx;
        tree.y = sy;
        tree.size = randRange(25, 55); // Slightly larger trees
        tree.shade = randRange(0.7, 1.0);
        tree.cachedColor = 'rgba(46,' + Math.floor(139 * tree.shade) + ',56,0.9)';
        tree.visible = false;
        tree.lastVisibleTime = 0;
        sceneryItems.push(tree);
    }

    // Add sparse trees in empty areas of the map
    // First, calculate track bounds to know where to generate trees
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let p of trackPath) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
    }
    
    // Expand bounds to cover more area
    let padding = 1000;
    minX -= padding;
    maxX += padding;
    minY -= padding;
    maxY += padding;
    
    // Generate sparse trees in empty areas - using object pool
    const sparseTreeAttempts = 800; // Number of attempts to place trees (increased for denser trees)
    const minTreeDistance = 100; // Minimum distance between trees (decreased for denser trees)
    
    for (let i = 0; i < sparseTreeAttempts; i++) {
        // Random position within bounds
        let sx = randRange(minX, maxX);
        let sy = randRange(minY, maxY);
        
        // Check distance to track
        let closest = findClosestTrackPoint(sx, sy);
        let distToTrack = Math.abs(getTrackDistance(sx, sy, closest.index));
        if (distToTrack < TRACK_WIDTH / 2 + 100) continue; // Keep away from track
        
        // Check if on branch
        if (isOnBranch(sx, sy)) continue;
        
        // Check distance to other scenery items
        let tooClose = false;
        for (let item of sceneryItems) {
            let dx = sx - item.x;
            let dy = sy - item.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < minTreeDistance) {
                tooClose = true;
                break;
            }
        }
        if (tooClose) continue;
        
        // Check if near branch
        if (isNearBranch(sx, sy, 100)) continue;
        
        // If all checks pass, add the tree using object pool
        let tree = treePool.get();
        tree.x = sx;
        tree.y = sy;
        tree.size = randRange(20, 40);
        tree.shade = randRange(0.7, 1.0);
        tree.cachedColor = 'rgba(46,' + Math.floor(139 * tree.shade) + ',56,0.9)';
        tree.visible = false;
        tree.lastVisibleTime = 0;
        sceneryItems.push(tree);
    }

    buildSceneryGrid();
}

// ==================== CLOSEST TRACK POINT ====================
// Spatial grid index for fast track point queries
const TRACK_GRID_SIZE = 200;
let trackGrid = {};

function gridKey(x, y) {
    const gx = Math.floor(x / TRACK_GRID_SIZE);
    const gy = Math.floor(y / TRACK_GRID_SIZE);
    return gx + "_" + gy;
}

function buildTrackGrid() {
    trackGrid = {};
    for (let i = 0; i < trackPath.length; i++) {
        let p = trackPath[i];
        let key = gridKey(p.x, p.y);
        if (!trackGrid[key]) trackGrid[key] = [];
        trackGrid[key].push({ x: p.x, y: p.y, index: i });
    }
}

// Closest track point cache
let lastClosestCache = { x: 0, y: 0, index: 0, dist: Infinity };
const CACHE_RADIUS = 200;

// Optimized track point cache with larger radius and index-based validation
const TRACK_CACHE_RADIUS = 250;
const TRACK_CACHE_MAX_AGE = 3;
let trackCache = { x: 0, y: 0, index: 0, dist: Infinity, age: 0 };
let trackPointResult = { index: 0, dist: 0 };

function findClosestTrackPoint(x, y) {
    // Check if cached result is still valid
    let cacheDist = Math.sqrt((x - trackCache.x) ** 2 + (y - trackCache.y) ** 2);
    if (cacheDist < TRACK_CACHE_RADIUS && trackCache.dist < Infinity && trackCache.age < TRACK_CACHE_MAX_AGE) {
        trackCache.age++;
        trackPointResult.index = trackCache.index;
        trackPointResult.dist = trackCache.dist;
        return trackPointResult;
    }

    // Use spatial grid for fast lookup
    let gx = Math.floor(x / TRACK_GRID_SIZE);
    let gy = Math.floor(y / TRACK_GRID_SIZE);
    
    let bestDist = Infinity;
    let bestIdx = 0;
    
    // Check 9 neighboring cells
    for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
            let key = (gx + dx) + "_" + (gy + dy);
            let cell = trackGrid[key];
            if (!cell) continue;
            
            for (let pt of cell) {
                let ddx = x - pt.x;
                let ddy = y - pt.y;
                let d = ddx * ddx + ddy * ddy;
                if (d < bestDist) {
                    bestDist = d;
                    bestIdx = pt.index;
                }
            }
        }
    }
    
    // Fallback to coarse search if grid lookup failed
    if (bestDist === Infinity) {
        let coarseStep = 10;
        for (let i = 0; i < trackPath.length; i += coarseStep) {
            let dx = x - trackPath[i].x;
            let dy = y - trackPath[i].y;
            let d = dx * dx + dy * dy;
            if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
        
        // Fine search around best coarse result
        let fineStart = Math.max(0, bestIdx - coarseStep);
        let fineEnd = Math.min(trackPath.length - 1, bestIdx + coarseStep);
        for (let i = fineStart; i <= fineEnd; i++) {
            let dx = x - trackPath[i].x;
            let dy = y - trackPath[i].y;
            let d = dx * dx + dy * dy;
            if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
    }

    let finalDist = Math.sqrt(bestDist);
    trackCache.x = x;
    trackCache.y = y;
    trackCache.index = bestIdx;
    trackCache.dist = finalDist;
    trackCache.age = 0;
    lastClosestCache.x = x;
    lastClosestCache.y = y;
    lastClosestCache.index = bestIdx;
    lastClosestCache.dist = finalDist;
    trackPointResult.index = bestIdx;
    trackPointResult.dist = finalDist;
    return trackPointResult;
}

function getTrackDistance(x, y, idx) {
    let p = trackPath[idx];
    let dx = x - p.x;
    let dy = y - p.y;
    // Signed distance: positive = left side, negative = right side
    return dx * p.nx + dy * p.ny;
}

// Check if car's physical collision box is on road surface
function isCarOnRoadSurface(car) {
    // Define car's collision box (4 corners + center)
    const carHalfWidth = CAR_WIDTH / 2;
    const carHalfLength = CAR_LENGTH / 2;
    
    // Calculate car's 4 corner points based on direction
    const cos = Math.cos(car.direction);
    const sin = Math.sin(car.direction);
    
    // Front-left, front-right, rear-left, rear-right corners
    const corners = [
        { x: car.x + (cos * carHalfLength - sin * carHalfWidth), y: car.y + (sin * carHalfLength + cos * carHalfWidth) },
        { x: car.x + (cos * carHalfLength + sin * carHalfWidth), y: car.y + (sin * carHalfLength - cos * carHalfWidth) },
        { x: car.x - (cos * carHalfLength + sin * carHalfWidth), y: car.y - (sin * carHalfLength - cos * carHalfWidth) },
        { x: car.x - (cos * carHalfLength - sin * carHalfWidth), y: car.y - (sin * carHalfLength + cos * carHalfWidth) },
        { x: car.x, y: car.y } // center point
    ];
    
    // Check if any corner is on road (main or branch)
    const roadMargin = 2; // Small margin to prevent edge flickering
    for (let corner of corners) {
        // Check main road using track distance
        let closest = findClosestTrackPoint(corner.x, corner.y);
        let trackDist = Math.abs(getTrackDistance(corner.x, corner.y, closest.index));
        if (trackDist < TRACK_WIDTH / 2 - roadMargin) {
            return true;
        }
        
        // Check branch road using closest branch point
        let branchClosest = getClosestBranchPoint(corner.x, corner.y);
        if (branchClosest.dist < BRANCH_WIDTH / 2 - roadMargin) {
            return true;
        }
    }
    
    return false;
}

function isOnTrack(x, y) {
    let closest = findClosestTrackPoint(x, y);
    let trackDist = Math.abs(getTrackDistance(x, y, closest.index));
    if (trackDist < TRACK_WIDTH / 2) return true;
    // Check branch paths
    return isOnBranch(x, y);
}

// ==================== CAR FACTORY ====================

// ==================== PLACE CARS (PLAYER + NPC TRAFFIC) ====================
let npcSpawnTimer = 0;
let npcSpawnStarted = false;

// Initialize NPC pool - create all NPC cars upfront
function initNPCPool() {
    npcPool = [];
    activeNPCs = [];
    npcAudioNodes = [];
    for (let i = 0; i < NPC_MAX_COUNT; i++) {
        let color = COLORS.npcCars[Math.floor(Math.random() * COLORS.npcCars.length)];
        let npc = createCar(color, false);
        npc.active = false;
        npc.audioIndex = i;
        npcPool.push(npc);
        npcAudioNodes.push(null);
    }
}

function placeCars() {
    cars = [];
    let startIdx = 5;

    let pCar = createCar(COLORS.playerCar, true);
    let sp = trackPath[startIdx];
    pCar.x = sp.x; pCar.y = sp.y;
    pCar.direction = sp.dir; pCar.visualAngle = sp.dir;
    pCar.currentPathIdx = startIdx;
    player = pCar;
    cars.push(pCar);
    playerPrevX = pCar.x; playerPrevY = pCar.y;
    
    // Initialize NPC pool
    initNPCPool();
    
    npcSpawnTimer = 0;
    npcSpawnStarted = false;
}

function spawnNPCNearPlayer() {
    if (!player) return;

    // Get inactive NPC from pool instead of creating new one
    let npc = null;
    for (let i = 0; i < npcPool.length; i++) {
        if (!npcPool[i].active) {
            npc = npcPool[i];
            break;
        }
    }
    if (!npc) return; // Pool exhausted

    let forwardDist = randRange(NPC_SPAWN_DISTANCE * 0.5, NPC_SPAWN_DISTANCE);
    let backwardDist = randRange(NPC_SPAWN_DISTANCE * 0.3, NPC_SPAWN_DISTANCE * 0.7);

    let pathLength = trackPath.length;
    let playerIdx = player.currentPathIdx;
    let spawnIdx;

    // Try multiple positions to find one far enough from other NPCs
    let minNPCSeparation = 250; // minimum distance between NPCs
    let minSepSq = minNPCSeparation * minNPCSeparation;
    let placed = false;

    for (let attempt = 0; attempt < 6; attempt++) {
        let isBehind = !randBool(0.7); // 30% spawn behind player
        if (!isBehind) {
            let idxOffset = Math.floor(forwardDist / 10) + randInt(-20, 20);
            spawnIdx = Math.min(playerIdx + idxOffset, pathLength - 50);
        } else {
            let idxOffset = Math.floor(backwardDist / 10) + randInt(-20, 20);
            spawnIdx = Math.max(playerIdx - idxOffset, 20);
        }
        spawnIdx = clamp(spawnIdx, 20, pathLength - 50);

        // Avoid spawning near finish line
        if (Math.abs(spawnIdx - (pathLength - 1)) < 100) {
            continue; // Skip finish line area
        }

        let np = trackPath[spawnIdx];
        
        // Detect curve intensity by checking direction change over nearby points
        let curveIntensity = 0;
        let lookAhead = 15;
        let lookBehind = 15;
        if (spawnIdx > lookBehind && spawnIdx < pathLength - lookAhead) {
            let prevDir = trackPath[spawnIdx - lookBehind].dir;
            let nextDir = trackPath[spawnIdx + lookAhead].dir;
            curveIntensity = Math.abs(angleDiff(prevDir, nextDir));
        }
        
        // Spawn at random position on track
        let candX = trackPath[spawnIdx].x;
        let candY = trackPath[spawnIdx].y;

        // Check distance to all active NPCs
        let tooClose = false;
        for (let other of activeNPCs) {
            let ddx = candX - other.x;
            let ddy = candY - other.y;
            if (ddx * ddx + ddy * ddy < minSepSq) {
                tooClose = true;
                break;
            }
        }

        if (!tooClose) {
            // Reject if spawn position is visible on screen (prevents flash-in)
            if (isInViewBounds(candX, candY, 100)) {
                // Try further away next attempt
                forwardDist = randRange(NPC_SPAWN_DISTANCE * 0.8, NPC_SPAWN_DISTANCE * 1.3);
                backwardDist = randRange(NPC_SPAWN_DISTANCE * 0.6, NPC_SPAWN_DISTANCE * 1.0);
                continue;
            }

            npc.x = candX;
            npc.y = candY;
            npc.direction = np.dir;
            npc.visualAngle = np.dir;
            npc.currentPathIdx = spawnIdx;
            // Rear-spawned NPCs start at high speed to catch up naturally
            if (isBehind) {
                npc.speed = npc.maxSpeed * randRange(0.85, 1.0);
            } else {
                npc.speed = npc.maxSpeed * randRange(0.5, 0.85);
            }
            npc.collisionPenalty = 0;
            npc.active = true;
            activeNPCs.push(npc);
            placed = true;
            break;
        }

        // Vary distances for next attempt
        forwardDist = randRange(NPC_SPAWN_DISTANCE * 0.4, NPC_SPAWN_DISTANCE * 1.1);
        backwardDist = randRange(NPC_SPAWN_DISTANCE * 0.2, NPC_SPAWN_DISTANCE * 0.8);
    }
    // If no valid position found after all attempts, skip this spawn cycle
}

let npcDensityTimer = 0;

function updateNPCSpawning() {
    if (!player) return;
    
    // Stop spawning NPCs after player finishes
    if (player.finished) return;
    
    // If NPCs are disabled, despawn all existing NPCs and don't spawn new ones
    if (!showNPCs) {
        // Despawn all active NPCs
        for (let i = activeNPCs.length - 1; i >= 0; i--) {
            let car = activeNPCs[i];
            car.active = false;
            car.finished = false;
            car.finishTime = 0;
        }
        activeNPCs.length = 0;
        // Update cars array to only contain player
        cars.length = 1;
        cars[0] = player;
        return;
    }

    if (!npcSpawnStarted) {
        npcSpawnTimer++;
        if (npcSpawnTimer < NPC_START_DELAY) return;
        if (player.currentPathIdx < 30) return;
        npcSpawnStarted = true;
        npcTargetCount = NPC_COUNT_MIN + randInt(0, 1); // start with 2-3
        let spawnCount = Math.min(npcTargetCount, npcPool.length);
        for (let i = 0; i < spawnCount; i++) {
            spawnNPCNearPlayer();
        }
        return;
    }

    // Periodically adjust target NPC count (every ~5 seconds at 60fps)
    npcDensityTimer++;
    if (npcDensityTimer > 300) {
        npcDensityTimer = 0;
        // Random target within range, biased toward lower end
        let r = Math.random();
        // 60% chance low (2-3), 30% chance mid (3-4), 10% chance high (4-5)
        if (r < 0.6) npcTargetCount = NPC_COUNT_MIN + randInt(0, 1);
        else if (r < 0.9) npcTargetCount = NPC_COUNT_MIN + randInt(1, 2);
        else npcTargetCount = NPC_COUNT_MAX;
    }

    // Despawn NPCs that are too far - use swap remove for O(1) removal
    for (let i = activeNPCs.length - 1; i >= 0; i--) {
        let car = activeNPCs[i];

        let dx = car.x - player.x;
        let dy = car.y - player.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > NPC_DESPAWN_DISTANCE) {
            car.active = false;
            car.finished = false; // Reset finished state when despawned
            car.finishTime = 0; // Reset finish time
            let lastIdx = activeNPCs.length - 1;
            if (i !== lastIdx) {
                activeNPCs[i] = activeNPCs[lastIdx];
            }
            activeNPCs.pop();
        }
    }

    // Spawn new NPCs if below dynamic target
    if (activeNPCs.length < npcTargetCount) {
        spawnNPCNearPlayer();
    }

    // Update cars array in place instead of creating new array
    cars.length = 1;
    cars[0] = player;
    for (let npc of activeNPCs) {
        cars.push(npc);
    }
}

// ==================== PLAYER UPDATE ====================
function updatePlayer(car, dt) {
    if (car.collisionCooldown > 0) car.collisionCooldown -= dt;
    if (car.collisionPenalty > 0) car.collisionPenalty -= dt;

    let inputUp = keys['ArrowUp'] || keys['KeyW'] || touchControls.up;
    let inputDown = keys['ArrowDown'] || keys['KeyS'] || touchControls.down;
    let inputLeft = keys['ArrowLeft'] || keys['KeyA'] || touchControls.left;
    let inputRight = keys['ArrowRight'] || keys['KeyD'] || touchControls.right;

    // Post-finish: allow control but gradually reduce speed to a stop
    let effectiveMaxSpeed = car.maxSpeed;
    let postFinishDeceleration = false;
    if (car.finished) {
        let elapsed = raceTime - car.finishTime;
        // Immediate strong deceleration after finish
        if (elapsed > 0.5) {
            let brakeFactor = clamp((elapsed - 0.5) / 2, 0, 1);
            effectiveMaxSpeed = car.maxSpeed * (1 - brakeFactor * 0.95);
            if (!inputUp) {
                car.speed *= lerp(0.97, 0.70, brakeFactor); // Stronger deceleration
                postFinishDeceleration = true;
            }
        }
        if (elapsed > 2.5) {
            car.speed *= 0.65; // Much faster deceleration
            postFinishDeceleration = true;
            if (Math.abs(car.speed) < 0.05) car.speed = 0;
        }
    }

    // Acceleration with collision penalty: slower recovery after crashes
    let accelMult = 1;
    if (car.collisionPenalty > 0) {
        accelMult = 0.5 + 0.5 * (1 - clamp(car.collisionPenalty / 1.0, 0, 1));
    }

    if (inputUp) {
        let accelFactor = 1 - (car.speed / effectiveMaxSpeed) * 0.5;
        
        // Slow down acceleration linearly above 160 speed (corresponds to ~7.11 in game units)
        let speed160 = 7.11;
        if (car.speed > speed160) {
            // Calculate linear slowdown factor (from 0.6 to 0.1 as speed approaches max)
            let excessSpeed = car.speed - speed160;
            let maxExcess = car.maxSpeed - speed160;
            let slowdownFactor = 0.6 - (excessSpeed / maxExcess) * 0.5;
            accelFactor *= slowdownFactor;
        }
        
        car.speed += car.acceleration * accelFactor * accelMult;
    } else if (inputDown) {
        car.speed -= car.braking;
    } else if (!postFinishDeceleration) {
        car.speed *= car.friction;
    }
    car.speed = clamp(car.speed, -effectiveMaxSpeed * 0.175, effectiveMaxSpeed);

    // Turning: speed-dependent steering with moderate high-speed penalty
    let speedRatio = Math.abs(car.speed) / car.maxSpeed;
    // Smoother curve: good at mid-speed, stronger reduction at high speed
    let turnFactor = speedRatio * Math.max(0.2, 1.0 - speedRatio * speedRatio * 0.85);

    // Target steering input: -1 (left), 0 (center), +1 (right)
    let targetSteer = 0;
    if (inputLeft) targetSteer = -1;
    if (inputRight) targetSteer = 1;

    // Linear delay: smooth steering ramp
    let steerSmooth = 0.18;
    car.steeringInput += (targetSteer - car.steeringInput) * steerSmooth;
    // Snap to zero when nearly centered to avoid drift
    if (Math.abs(car.steeringInput) < 0.01 && targetSteer === 0) car.steeringInput = 0;

    let turnAmount = car.steeringInput * car.turnRate * turnFactor;

    car.direction += turnAmount;
    car.direction = normalizeAngle(car.direction);

    // Move
    car.x += Math.cos(car.direction) * car.speed;
    car.y += Math.sin(car.direction) * car.speed;

    // Brake sound when braking at speed
    if (inputDown && Math.abs(car.speed) > car.maxSpeed * 0.3) {
        let brakeIntensity = Math.abs(car.speed) / car.maxSpeed;
        playBrakeSound(brakeIntensity);
    } else {
        stopBrakeSound();
    }

    // Visual angle interpolation (smooth)
    let angleDelta = angleDiff(car.visualAngle, car.direction);
    car.visualAngle += angleDelta * 0.2;

    // Update engine sound
    updateEngineSound(car.speed, car.maxSpeed);

    // Track index - compute once and reuse
    let closest = findClosestTrackPoint(car.x, car.y);
    car.currentPathIdx = closest.index;

    // Off-track friction + dust - check if car is on road surface
    let onTrack = isCarOnRoadSurface(car);
    
    if (!onTrack) {
        car.speed *= car.offTrackFriction;
        if (Math.abs(car.speed) > 1 && Math.random() < 0.5) {
            spawnDust(car.x, car.y, car.speed, car.direction);
        }
    }

    // Track distance traveled (stop counting after finish)
    let ddx = car.x - playerPrevX, ddy = car.y - playerPrevY;
    if (!car.finished) {
        totalDistance += Math.sqrt(ddx * ddx + ddy * ddy);
    }
    playerPrevX = car.x; playerPrevY = car.y;
}

// ==================== NPC UPDATE ====================
const NPC_ACTIVE_DISTANCE = 500;
const NPC_SIMPLE_DISTANCE = 800;

function updateNPC(car, dt, isPlayerNearby) {
    if (car.collisionCooldown > 0) car.collisionCooldown -= dt;
    
    if (car.finished) {
        let elapsed = raceTime - car.finishTime;
        
        if (elapsed < 1.5) {
            let brakeFactor = elapsed / 1.5;
            car.speed *= lerp(0.94, 0.70, brakeFactor);
        } else {
            car.speed *= 0.65;
        }
        
        if (Math.abs(car.speed) < 0.1) {
            car.speed = 0;
        } else {
            car.x += Math.cos(car.direction) * car.speed;
            car.y += Math.sin(car.direction) * car.speed;
        }
        
        let finishP = trackPath[trackPath.length - 1];
        let dx = car.x - finishP.x;
        let dy = car.y - finishP.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > 300) {
            let angle = Math.atan2(dy, dx);
            let targetX = finishP.x + Math.cos(angle) * 250;
            let targetY = finishP.y + Math.sin(angle) * 250;
            car.x += (targetX - car.x) * 0.05;
            car.y += (targetY - car.y) * 0.05;
        }
        
        if (car.speed === 0) {
            return;
        }
    }
    
    if (!isPlayerNearby) {
        let closest = findClosestTrackPoint(car.x, car.y);
        car.currentPathIdx = closest.index;
        
        let trackDir = trackPath[closest.index].dir;
        let steerAngle = angleDiff(car.direction, trackDir);
        
        let lateralDist = getTrackDistance(car.x, car.y, closest.index);
        let absLateralDist = Math.abs(lateralDist);
        let lateralCorrection = 0;
        if (absLateralDist > TRACK_WIDTH * 0.35) {
            lateralCorrection = -lateralDist / (TRACK_WIDTH * 0.5) * 0.3;
        }
        
        let maxTurn = car.turnRate * 0.7;
        let desiredTurn = steerAngle * 0.5 + lateralCorrection;
        let targetSteerInput = clamp(desiredTurn / maxTurn, -1, 1);
        let steerSmooth = 0.1;
        car.npcSteerInput += (targetSteerInput - car.npcSteerInput) * steerSmooth;
        car.direction += car.npcSteerInput * maxTurn;
        car.direction = normalizeAngle(car.direction);
        
        let targetSpeed = car.maxSpeed * 0.6;
        if (car.speed < targetSpeed) car.speed += car.acceleration * 0.3;
        else car.speed *= 0.995;
        car.speed = clamp(car.speed, 0, car.maxSpeed);
        
        car.x += Math.cos(car.direction) * car.speed;
        car.y += Math.sin(car.direction) * car.speed;
        
        let ad = angleDiff(car.visualAngle, car.direction);
        car.visualAngle += ad * 0.1;
        return;
    }

    updateClosestPath(car);
    let overtakeData = computeOvertaking(car, dt);
    updateLaneDecision(car, overtakeData, dt);
    let target = computeDrivingTarget(car);

    let dx = target.x - car.x;
    let dy = target.y - car.y;
    let targetAngle = Math.atan2(dy, dx);
    let steerAngle = angleDiff(car.direction, targetAngle);

    let speedRatio = Math.abs(car.speed) / car.maxSpeed;
    let currentCurvature = trackPath[car.currentPathIdx].curvature;
    
    let isOvertaking = Math.abs(car.laneOffset) > 0.1;
    
    let maxTurn;
    if (isOvertaking) {
        maxTurn = car.turnRate * Math.max(0.6, speedRatio * 1.0);
    } else {
        maxTurn = car.turnRate * Math.max(0.35, speedRatio * 0.8);
    }
    
    let steerInput = clamp(steerAngle / maxTurn, -1, 1);
    
    if (Math.abs(steerAngle) > 0.05) {
        let boost = isOvertaking ? 0.6 : 0.3;
        steerInput = Math.sign(steerInput) * Math.min(1, Math.abs(steerInput) + boost);
    }

    let steerSmooth = isOvertaking ? 0.25 : 0.15;
    car.npcSteerInput += (steerInput - car.npcSteerInput) * steerSmooth;
    car.direction += car.npcSteerInput * maxTurn;
    car.direction = normalizeAngle(car.direction);

    let targetSpeed = computeTargetSpeed(car, target.idx);
    
    if (overtakeData.blocked && !overtakeData.overtaking) {
        targetSpeed *= 0.6;
    }
    
    let speedDiff = targetSpeed - car.speed;
    if (speedDiff > 0) {
        car.speed += Math.min(car.acceleration * 0.5, speedDiff * 0.1);
    } else {
        car.speed *= 0.98;
    }
    car.speed = clamp(car.speed, 0, car.maxSpeed);

    car.x += Math.cos(car.direction) * car.speed;
    car.y += Math.sin(car.direction) * car.speed;

    let ad = angleDiff(car.visualAngle, car.direction);
    car.visualAngle += ad * 0.2;

    let closestIdx = car.currentPathIdx;
    let trackDist = getTrackDistance(car.x, car.y, closestIdx);
    let absTrackDist = Math.abs(trackDist);
    let onTrack = absTrackDist < TRACK_WIDTH / 2;
    if (!onTrack) onTrack = isOnBranch(car.x, car.y);

    if (!onTrack) {
        car.speed *= car.offTrackFriction;
    }

    let halfW = TRACK_WIDTH / 2;
    if (absTrackDist > halfW + 20) {
        let p = trackPath[closestIdx];
        let pushDir = trackDist > 0 ? -1 : 1;
        let pushAmount = Math.min((absTrackDist - halfW) * 0.05, 3);
        car.x += p.nx * pushDir * pushAmount;
        car.y += p.ny * pushDir * pushAmount;
    }

    if (absTrackDist > TRACK_WIDTH * 2) {
        let p = trackPath[closestIdx];
        let offset = (Math.random() - 0.5) * TRACK_WIDTH * 0.4;
        car.x = p.x - Math.sin(p.dir) * offset;
        car.y = p.y + Math.cos(p.dir) * offset;
        car.direction = p.dir;
        car.speed = car.maxSpeed * 0.5;
    }
}



// ==================== TRACK BOUNDARY (SOFT PUSH-BACK) ====================
function isOnBranch(x, y) {
    // Check cache first
    let cdx = x - branchCache.x, cdy = y - branchCache.y;
    if (cdx * cdx + cdy * cdy < 2500 && branchCache.age < BRANCH_CACHE_MAX_AGE) {
        branchCache.age++;
        return branchCache.result;
    }

    let threshold = BRANCH_WIDTH / 2;
    let thresholdSq = threshold * threshold;
    let gx = Math.floor(x / BRANCH_GRID_SIZE);
    let gy = Math.floor(y / BRANCH_GRID_SIZE);

    for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
            let key = (gx + dx) + "_" + (gy + dy);
            let cell = branchGrid[key];
            if (!cell) continue;
            for (let pt of cell) {
                let ddx = x - pt.x, ddy = y - pt.y;
                if (ddx * ddx + ddy * ddy < thresholdSq) {
                    branchCache.x = x;
                    branchCache.y = y;
                    branchCache.result = true;
                    branchCache.age = 0;
                    return true;
                }
            }
        }
    }

    branchCache.x = x;
    branchCache.y = y;
    branchCache.result = false;
    branchCache.age = 0;
    return false;
}

// Pre-allocated result for getClosestBranchPoint
let closestBranchResult = { point: null, path: null, dist: Infinity, px: 0, py: 0, pnx: 0, pny: 0, pindex: 0 };

function getClosestBranchPoint(x, y) {
    let bestDist = Infinity;
    let bestPt = null;
    let bestPath = null;
    let bestIdx = 0;
    
    for (let bp of branchPaths) {
        if (!bp.path) continue;
        
        for (let i = 0; i < bp.path.length; i++) {
            let pt = bp.path[i];
            let dx = x - pt.x;
            let dy = y - pt.y;
            let d = dx * dx + dy * dy;
            if (d < bestDist) {
                bestDist = d;
                bestPt = pt;
                bestPath = bp;
                bestIdx = i;
            }
        }
    }
    
    if (bestPt) {
        closestBranchResult.point = bestPt;
        closestBranchResult.path = bestPath;
        closestBranchResult.dist = Math.sqrt(bestDist);
        closestBranchResult.px = bestPt.x;
        closestBranchResult.py = bestPt.y;
        closestBranchResult.pnx = bestPt.nx;
        closestBranchResult.pny = bestPt.ny;
        closestBranchResult.pindex = bestIdx;
        return closestBranchResult;
    }
    
    closestBranchResult.point = null;
    closestBranchResult.path = null;
    closestBranchResult.dist = Infinity;
    return closestBranchResult;
}

function enforceTrackBoundary(car) {
    if (car.isPlayer) return;

    // Branch boundary constraint removed - only main track constraint
    /*
    if (isOnBranch(car.x, car.y)) {
